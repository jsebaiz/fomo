<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>fomo / create a clan</title>
<link rel="icon" href="/fomo-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B091F; --ink-2:#141230; --field:#100E24; --border:rgba(234,237,255,0.14);
  --text:#EAEDFF; --text-dim:rgba(234,237,255,0.62); --text-faint:rgba(234,237,255,0.38);
  --blue:#516AF6; --blue-electric:#4A36FF; --blue-light:#ACB8F9; --red:#ff9a9a;
  --radius:16px; --radius-sm:12px;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0; background:var(--ink);}
body{color:var(--text); font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif; line-height:1.45; min-height:100vh;}
button{font-family:inherit;}
a{color:inherit; text-decoration:none;}
svg{display:block;}
.phone{max-width:480px; margin:0 auto; min-height:100vh; padding:0 18px 110px; position:relative; z-index:1;}
.halo{position:fixed; top:-30%; left:50%; transform:translateX(-50%); width:900px; height:600px; background:radial-gradient(circle, rgba(74,54,255,0.16) 0%, rgba(74,54,255,0.04) 45%, transparent 70%); pointer-events:none; z-index:0;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 0 6px; position:relative;}
.iconbtn{width:34px; height:34px; border-radius:999px; background:none; border:none; color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.iconbtn:hover{background:rgba(255,255,255,0.06);}
.iconbtn svg{width:19px; height:19px;}
.topbar h2{position:absolute; left:0; right:0; text-align:center; font-size:1.02rem; font-weight:700; margin:0; pointer-events:none;}
.brandmark img{display:block; width:26px; height:26px; border-radius:7px;}

.banner-wrap{position:relative; margin:22px 0 46px;}
.banner{height:120px; border-radius:16px; background:linear-gradient(135deg, #232145, #14122a); position:relative; transition:background .2s ease; overflow:hidden;}
.banner::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.18), transparent 55%);}
.pencil-btn{position:absolute; width:28px; height:28px; border-radius:999px; background:rgba(11,9,31,0.65); border:1px solid var(--border); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(4px);}
.pencil-btn svg{width:13px; height:13px;}
.banner .pencil-btn{right:10px; bottom:10px;}
.icon-wrap{position:absolute; left:14px; bottom:-24px;}
.icon{width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg, #232145, #14122a); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.3rem; color:#fff; letter-spacing:0.01em;}
.icon.small-glyph{font-size:1.05rem;}
.icon-wrap .pencil-btn{width:22px; height:22px; right:-4px; bottom:-4px;}
.icon-wrap .pencil-btn svg{width:11px; height:11px;}

.field{margin-bottom:20px;}
.field label{display:block; font-size:0.86rem; color:var(--text-dim); margin-bottom:8px; font-weight:600;}
.field input, .field select{width:100%; background:var(--field); border:1px solid var(--border); border-radius:12px; padding:13px 14px; color:var(--text); font-family:inherit; font-size:0.95rem; outline:none; transition:border-color .15s ease;}
.field select{appearance:none; -webkit-appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ACB8F9" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'); background-repeat:no-repeat; background-position:right 14px center; padding-right:38px;}
.field select:invalid{color:var(--text-faint);}
.field option{color:#000;}
.field input::placeholder{color:var(--text-faint);}
.field input:focus, .field select:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(81,106,246,0.15);}
.field .hint{font-size:0.76rem; color:var(--text-faint); margin-top:6px;}

.row-action{display:flex; align-items:center; gap:12px; padding:14px 4px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.row-action .ricon{width:22px; height:22px; flex-shrink:0; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
.row-action .ricon svg{width:19px; height:19px;}
.row-action .rlabel{flex:1; font-weight:700; font-size:0.95rem;}
.row-action .rlabel small{display:block; font-weight:400; font-size:0.76rem; color:var(--text-faint); margin-top:1px;}
.row-action .rmeta{color:var(--text-faint); font-size:0.85rem; flex-shrink:0;}
.row-action.copyable{cursor:pointer;}
.row-action.copyable:hover{background:rgba(255,255,255,0.03);}
.row-action.copyable .ricon, .row-action.copyable .rlabel{color:var(--blue-light);}

.msg{font-size:0.84rem; margin:14px 2px 0; min-height:1.2em;}
.msg.err{color:var(--red);}

.bottom-bar{position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--ink) 55%, transparent); z-index:2;}
.bottom-inner{max-width:480px; margin:0 auto;}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px; border-radius:14px; font-weight:700; font-size:0.98rem; cursor:pointer; border:none; transition:transform .15s ease, filter .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg, var(--blue-electric), var(--blue)); color:#fff; box-shadow:0 8px 24px rgba(81,106,246,.3);}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:disabled{opacity:.5; cursor:default; transform:none; filter:none;}
.btn-secondary{background:var(--ink-2); color:var(--text); border:1px solid var(--border);}

.success{display:none; text-align:center; margin:34px 0 10px;}
.success.show{display:block;}
.success .check{width:56px; height:56px; border-radius:999px; background:rgba(81,106,246,0.14); color:var(--blue-light); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.success .check svg{width:26px; height:26px;}
.success h3{margin:0 0 6px; font-size:1.15rem;}
.success p{font-size:0.88rem; color:var(--text-dim); margin:0;}
</style>
</head>
<body>

<div class="halo" aria-hidden="true"></div>

<div class="phone">
  <div class="topbar">
    <button class="iconbtn" id="back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h2>Create a clan</h2>
    <span class="brandmark"><img src="/fomo-favicon.svg" alt="fomo"></span>
  </div>

  <form id="clan-form">
    <div class="banner-wrap">
      <div class="banner" id="banner">
        <button type="button" class="pencil-btn" id="banner-pencil" title="Generated from your school and chapter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <div class="icon-wrap">
        <div class="icon" id="icon-preview">?</div>
        <button type="button" class="pencil-btn" title="Generated from your school and chapter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="c-school">School</label>
      <select id="c-school" required>
        <option value="" disabled selected>Choose your school</option>
      </select>
    </div>

    <div class="field">
      <label for="c-chapter">Chapter name</label>
      <input type="text" id="c-chapter" maxlength="40" placeholder="e.g. Sigma Chi" autocomplete="off" required>
      <div class="hint" id="chapter-hint">We'll recognize national fraternities and sororities and use their letters.</div>
    </div>

    <div class="field">
      <label for="c-size">How many members are in your chapter?</label>
      <input type="number" id="c-size" min="1" max="2000" step="1" placeholder="e.g. 45" inputmode="numeric">
      <div class="hint">Optional — shown as your chapter's size on the clans list.</div>
    </div>

    <div class="row-action" id="invite-row">
      <span class="ricon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 8.5c1.4.3 2.5 1.5 2.5 3s-1.1 2.7-2.5 3M20 19c0-2.3-1.6-4.2-3.8-4.8"/></svg></span>
      <span class="rlabel">Invite members<small>Available once your clan is created</small></span>
      <span class="rmeta">0</span>
    </div>

    <p class="msg" id="form-msg"></p>
  </form>

  <div class="success" id="success">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3 id="success-name"></h3>
    <p>Your clan is live. Share your link to bring the frat in.</p>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button type="submit" form="clan-form" class="btn btn-primary" id="submit-btn">Create a clan</button>
    <a href="../" class="btn btn-secondary" id="done-btn" style="display:none; margin-top:10px;">View all clans</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
document.getElementById('back-btn').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = '../'; });

// ---------------------------------------------------------------------------
// School code -> [display name, primary color, secondary color (null = auto-shade)]
// Colors are each school's real, commonly recognized colors.
// ---------------------------------------------------------------------------
const SCHOOLS = {
  asu: ['Arizona State University', '#8C1D40', '#FFC627'],
  ua: ['University of Arizona', '#AB0520', '#0C234B'],
  ucla: ['UCLA', '#2774AE', '#FFD100'],
  usc: ['University of Southern California', '#990000', '#FFC72C'],
  cal: ['UC Berkeley', '#003262', '#FDB515'],
  stanford: ['Stanford University', '#8C1515', null],
  ucsd: ['UC San Diego', '#182B49', '#C69214'],
  sdsu: ['San Diego State University', '#A6192E', null],
  uw: ['University of Washington', '#4B2E83', '#B7A57A'],
  uo: ['University of Oregon', '#154733', '#FEE123'],
  utah: ['University of Utah', '#CC0000', null],
  cu: ['CU Boulder', '#CFB87C', '#000000'],
  utaustin: ['UT Austin', '#BF5700', null],
  tamu: ['Texas A&M University', '#500000', null],
  rice: ['Rice University', '#00205B', null],
  smu: ['Southern Methodist University', '#C8102E', '#0033A0'],
  ou: ['University of Oklahoma', '#841617', null],
  mizzou: ['University of Missouri', '#F1B82D', '#000000'],
  wustl: ['Washington University in St. Louis', '#A51417', null],
  wisconsin: ['University of Wisconsin–Madison', '#C5050C', null],
  minnesota: ['University of Minnesota', '#7A0019', '#FFCC33'],
  northwestern: ['Northwestern University', '#4E2A84', null],
  uchicago: ['University of Chicago', '#800000', null],
  illinois: ['University of Illinois', '#E84A27', '#13294B'],
  purdue: ['Purdue University', '#B1810B', '#000000'],
  iu: ['Indiana University', '#990000', null],
  michigan: ['University of Michigan', '#00274C', '#FFCB05'],
  osu: ['Ohio State University', '#BB0000', null],
  penn: ['University of Pennsylvania', '#011F5B', '#990000'],
  pennstate: ['Penn State University', '#041E42', null],
  pitt: ['University of Pittsburgh', '#003594', '#FFB81C'],
  cmu: ['Carnegie Mellon University', '#C41230', null],
  nyu: ['New York University', '#57068C', null],
  columbia: ['Columbia University', '#003D74', '#B9D9EB'],
  cornell: ['Cornell University', '#B31B1B', null],
  yale: ['Yale University', '#00356B', null],
  harvard: ['Harvard University', '#A51C30', null],
  bu: ['Boston University', '#CC0000', null],
  georgetown: ['Georgetown University', '#041E42', null],
  umd: ['University of Maryland', '#E21833', '#FFD520'],
  uva: ['University of Virginia', '#232D4B', '#E57200'],
  duke: ['Duke University', '#001A57', null],
  unc: ['UNC Chapel Hill', '#7BAFD4', '#13294B'],
  gt: ['Georgia Tech', '#B3A369', '#003057'],
  uga: ['University of Georgia', '#BA0C2F', '#000000'],
  vanderbilt: ['Vanderbilt University', '#866D4B', '#000000'],
  ala: ['University of Alabama', '#9E1B32', null],
  uf: ['University of Florida', '#0021A5', '#FA4616'],
  fsu: ['Florida State University', '#782F40', '#CEB888'],
  miami: ['University of Miami', '#F47321', '#005030'],
};

// Recognized national fraternities/sororities -> their actual Greek letters.
// Unrecognized names fall back to initials, further down.
const GREEK_LETTERS = {
  'sigma chi': 'ΣΧ', 'sigma alpha epsilon': 'ΣΑΕ', 'sae': 'ΣΑΕ', 'kappa sigma': 'ΚΣ',
  'sigma nu': 'ΣΝ', 'phi delta theta': 'ΦΔΘ', 'phi delt': 'ΦΔΘ', 'pi kappa alpha': 'ΠΚΑ',
  'pike': 'ΠΚΑ', 'beta theta pi': 'ΒΘΠ', 'delta tau delta': 'ΔΤΔ', 'delt': 'ΔΤΔ',
  'phi gamma delta': 'ΦΓΔ', 'fiji': 'ΦΓΔ', 'alpha tau omega': 'ΑΤΩ', 'ato': 'ΑΤΩ',
  'kappa alpha': 'ΚΑ', 'kappa alpha order': 'ΚΑ', 'theta chi': 'ΘΧ', 'delta sigma phi': 'ΔΣΦ',
  'lambda chi alpha': 'ΛΧΑ', 'tau kappa epsilon': 'ΤΚΕ', 'tke': 'ΤΚΕ', 'zeta beta tau': 'ΖΒΤ',
  'zbt': 'ΖΒΤ', 'delta upsilon': 'ΔΥ', 'phi kappa psi': 'ΦΚΨ', 'alpha epsilon pi': 'ΑΕΠ',
  'aepi': 'ΑΕΠ', 'sigma phi epsilon': 'ΣΦΕ', 'sig ep': 'ΣΦΕ', 'chi phi': 'ΧΦ',
  'pi kappa phi': 'ΠΚΦ', 'phi kappa tau': 'ΦΚΤ', 'delta chi': 'ΔΧ', 'alpha sigma phi': 'ΑΣΦ',
  'psi upsilon': 'ΨΥ', 'alpha chi omega': 'ΑΧΩ', 'axo': 'ΑΧΩ', 'kappa kappa gamma': 'ΚΚΓ',
  'chi omega': 'ΧΩ', 'delta gamma': 'ΔΓ', 'alpha phi': 'ΑΦ', 'pi beta phi': 'ΠΒΦ',
  'kappa delta': 'ΚΔ', 'zeta tau alpha': 'ΖΤΑ', 'zta': 'ΖΤΑ', 'gamma phi beta': 'ΓΦΒ',
  'alpha delta pi': 'ΑΔΠ', 'adpi': 'ΑΔΠ', 'sigma kappa': 'ΣΚ', 'delta delta delta': 'ΔΔΔ',
  'tri delta': 'ΔΔΔ', 'tridelta': 'ΔΔΔ', 'alpha omicron pi': 'ΑΟΠ', 'phi mu': 'ΦΜ',
  'alpha gamma delta': 'ΑΓΔ', 'alpha xi delta': 'ΑΞΔ', 'delta zeta': 'ΔΖ',
  'kappa alpha theta': 'ΚΑΘ', 'alpha epsilon phi': 'ΑΕΦ',
};

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp(((n >> 16) & 255) * (1 + pct));
  const g = clamp(((n >> 8) & 255) * (1 + pct));
  const b = clamp((n & 255) * (1 + pct));
  return '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function schoolColors(code) {
  const s = SCHOOLS[code];
  if (!s) return ['#516AF6', '#2E3A8C'];
  return [s[1], s[2] || shade(s[1], -0.42)];
}
function normChapter(s) { return String(s).toLowerCase().replace(/[.'’]/g, '').replace(/\s+/g, ' ').trim(); }
function greekFor(chapterName) { return GREEK_LETTERS[normChapter(chapterName)] || null; }
function initialsOf(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function glyphFor(chapterName) { return chapterName ? (greekFor(chapterName) || initialsOf(chapterName)) : '?'; }

function fillSchools() {
  const opts = Object.keys(SCHOOLS).sort((a, b) => SCHOOLS[a][0].localeCompare(SCHOOLS[b][0]))
    .map((c) => `<option value="${c}">${SCHOOLS[c][0]}</option>`).join('');
  $('c-school').innerHTML = '<option value="" disabled selected>Choose your school</option>' + opts;
}
fillSchools();

function updatePreview() {
  const school = $('c-school').value;
  const chapter = $('c-chapter').value.trim();
  const [a, b] = school ? schoolColors(school) : ['#232145', '#14122a'];
  $('banner').style.background = `linear-gradient(135deg, ${a}, ${b})`;
  const icon = $('icon-preview');
  icon.style.background = `linear-gradient(135deg, ${a}, ${b})`;
  const glyph = glyphFor(chapter);
  icon.textContent = glyph;
  icon.classList.toggle('small-glyph', glyph.length >= 3);
  $('chapter-hint').textContent = chapter && greekFor(chapter)
    ? `Recognized ${greekFor(chapter)} — using the real letters.`
    : "We'll recognize national fraternities and sororities and use their letters.";
}
$('c-school').addEventListener('change', updatePreview);
$('c-chapter').addEventListener('input', updatePreview);
document.querySelectorAll('.pencil-btn').forEach((b) => b.addEventListener('click', () => b.blur()));

let created = false;
$('clan-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (created) return;
  const msg = $('form-msg');
  msg.className = 'msg'; msg.textContent = '';
  const school = $('c-school').value;
  const chapterName = $('c-chapter').value.trim();
  if (!school) { msg.className = 'msg err'; msg.textContent = 'choose your school.'; return; }
  if (chapterName.length < 2) { msg.className = 'msg err'; msg.textContent = 'enter a chapter name.'; return; }

  $('submit-btn').disabled = true;
  try {
    const res = await fetch('/api/clans', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ school, chapterName, chapterSize: $('c-size').value }),
    });
    if (res.status === 201) {
      const { clan } = await res.json();
      created = true;
      showCreated(clan);
    } else {
      const body = await res.json().catch(() => ({}));
      msg.className = 'msg err'; msg.textContent = (body.error || 'something went wrong.').toLowerCase();
      $('submit-btn').disabled = false;
    }
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'couldn’t reach the server.';
    $('submit-btn').disabled = false;
  }
});

function showCreated(clan) {
  $('c-school').disabled = true; $('c-chapter').disabled = true; $('c-size').disabled = true;
  $('success-name').textContent = clan.name + ' is ready.';
  $('success').classList.add('show');
  $('form-msg').textContent = '';

  const row = $('invite-row');
  row.classList.add('copyable');
  row.innerHTML = `<span class="ricon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 15 9"/><path d="M10.5 6.5 12 5a4 4 0 0 1 5.7 5.7l-1.5 1.5"/><path d="M13.5 17.5 12 19a4 4 0 0 1-5.7-5.7l1.5-1.5"/></svg></span><span class="rlabel">Copy link<small>Send it to your group chat</small></span><span class="rmeta" id="copy-state">→</span>`;
  row.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(clan.referralUrl);
      $('copy-state').textContent = 'Copied!';
      setTimeout(() => { $('copy-state').textContent = '→'; }, 1800);
    } catch (e) {
      prompt('Copy this link:', clan.referralUrl);
    }
  });

  $('submit-btn').style.display = 'none';
  $('done-btn').style.display = 'flex';
}

updatePreview();
</script>
</body>
</html>
