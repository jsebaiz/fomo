<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>fomo / clans</title>
<link rel="icon" href="/fomo-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B091F; --ink-2:#141230; --ink-3:#1C1940;
  --border:rgba(234,237,255,0.10); --border-strong:rgba(234,237,255,0.20);
  --blue:#516AF6; --blue-electric:#4A36FF; --blue-light:#ACB8F9;
  --text:#EAEDFF; --text-dim:rgba(234,237,255,0.62); --text-faint:rgba(234,237,255,0.38);
  --red:#FF8C8C; --radius:16px; --radius-sm:12px;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0; background:var(--ink);}
body{color:var(--text); font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif; line-height:1.45; min-height:100vh;}
button{font-family:inherit;}
a{color:inherit; text-decoration:none;}
svg{display:block;}
.phone{max-width:480px; margin:0 auto; min-height:100vh; padding:0 18px 40px; position:relative;}
.halo{position:fixed; top:-30%; left:50%; transform:translateX(-50%); width:900px; height:600px; background:radial-gradient(circle, rgba(74,54,255,0.16) 0%, rgba(74,54,255,0.04) 45%, transparent 70%); pointer-events:none; z-index:0;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 0 4px; position:relative; z-index:1;}
.iconbtn{width:34px; height:34px; border-radius:999px; background:none; border:none; color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.iconbtn:hover{background:rgba(255,255,255,0.06);}
.iconbtn svg{width:19px; height:19px;}
.brandmark{display:flex; align-items:center; gap:8px; color:var(--text-dim); font-weight:700; font-size:0.92rem;}
.brandmark img{display:block; width:24px; height:24px; border-radius:7px;}

.title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-top:10px; position:relative; z-index:1;}
h1{font-size:1.9rem; font-weight:800; margin:0; letter-spacing:-0.02em;}
.tabs{display:flex; gap:2px; background:var(--ink-2); border:1px solid var(--border); border-radius:999px; padding:3px; flex-shrink:0; margin-top:4px;}
.tabs button{background:none; border:none; color:var(--text-dim); font-weight:600; font-size:0.8rem; padding:7px 12px; border-radius:999px; cursor:pointer; transition:background .15s ease, color .15s ease;}
.tabs button.active{background:var(--blue); color:#fff;}

.desc{font-size:0.88rem; color:var(--text-dim); margin:12px 0 24px; position:relative; z-index:1;}

.list{display:flex; flex-direction:column; position:relative; z-index:1;}
.row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border);}
.rank{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.82rem; color:var(--text-faint); flex-shrink:0;}
.rank.r1{background:var(--blue); color:#fff;}
.rank.r2{background:var(--blue-electric); color:#fff;}
.rank.r3{background:rgba(172,184,249,0.28); color:var(--text);}
.icon{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.95rem; color:#fff; flex-shrink:0; letter-spacing:0.01em;}
.icon.small-glyph{font-size:0.78rem;}
.meta{flex:1; min-width:0;}
.meta .name{font-weight:700; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.meta .sub{font-size:0.8rem; color:var(--text-faint); display:flex; align-items:center; gap:5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.meta .sub svg{width:13px; height:13px; flex-shrink:0;}
.stat{text-align:right; flex-shrink:0;}
.stat .joined{color:var(--blue-light); font-weight:700; font-size:0.95rem; white-space:nowrap;}
.stat .joined.zero{color:var(--text-faint);}
.stat .window-label{font-size:0.72rem; color:var(--text-faint); margin-top:2px;}

.skeleton{padding:13px 0; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border);}
.sk{background:linear-gradient(90deg, var(--ink-2) 25%, var(--ink-3) 37%, var(--ink-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.sk-icon{width:44px; height:44px; border-radius:13px; flex-shrink:0;}
.sk-lines{flex:1;}
.sk-line1{width:45%; height:14px; margin-bottom:8px;}
.sk-line2{width:30%; height:10px;}

.empty{padding:56px 20px; text-align:center; color:var(--text-faint); font-size:0.9rem;}
.empty svg{width:32px; height:32px; margin:0 auto 14px; color:var(--text-faint); opacity:.6;}
.load-error{margin:20px 0; padding:14px 16px; background:rgba(255,90,90,0.08); border:1px solid rgba(255,90,90,0.25); border-radius:12px; font-size:0.86rem; color:var(--red); display:flex; justify-content:space-between; align-items:center; gap:12px;}
.load-error button{background:none; border:1px solid rgba(255,90,90,0.4); color:var(--red); border-radius:999px; padding:6px 12px; font-size:0.8rem; cursor:pointer;}

.footer-cta{text-align:center; padding:38px 10px 10px; position:relative; z-index:1;}
.footer-cta p{font-size:0.88rem; color:var(--text-dim); margin-bottom:16px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 26px; border-radius:999px; font-weight:700; font-size:0.94rem; cursor:pointer; border:none; transition:transform .15s ease, filter .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg, var(--blue-electric), var(--blue)); color:#fff; box-shadow:0 8px 24px rgba(81,106,246,.28);}
.btn-primary:hover{filter:brightness(1.1);}
</style>
</head>
<body>

<div class="halo" aria-hidden="true"></div>

<div class="phone">
  <div class="topbar">
    <button class="iconbtn" id="back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="brandmark"><img src="/fomo-favicon.svg" alt="">fomo</div>
  </div>

  <div class="title-row">
    <h1>Clans</h1>
    <div class="tabs" id="tabs">
      <button data-w="24h">24h</button>
      <button data-w="7d">7d</button>
      <button data-w="30d">30d</button>
      <button data-w="all" class="active">All</button>
    </div>
  </div>
  <p class="desc">Clans are frat groups competing in Greek Wars, ranked by how many members they've brought in.</p>

  <div class="load-error" id="load-error" hidden>
    <span>couldn't load clans right now.</span>
    <button id="retry-btn">retry</button>
  </div>

  <div class="list" id="list">
    <div class="skeleton"><div class="sk sk-icon"></div><div class="sk-lines"><div class="sk sk-line1"></div><div class="sk sk-line2"></div></div></div>
    <div class="skeleton"><div class="sk sk-icon"></div><div class="sk-lines"><div class="sk sk-line1"></div><div class="sk sk-line2"></div></div></div>
    <div class="skeleton"><div class="sk sk-icon"></div><div class="sk-lines"><div class="sk sk-line1"></div><div class="sk sk-line2"></div></div></div>
  </div>

  <div class="footer-cta">
    <p>Want to see your frat on this list?</p>
    <a href="create/" class="btn btn-primary">Create a clan</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('back-btn').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = '/'; });

// Same school-color and Greek-letter tables as the create page, so an icon looks
// identical wherever it appears.
const SCHOOLS = {
  asu: ['Arizona State University', '#8C1D40', '#FFC627'],
  ua: ['University of Arizona', '#AB0520', '#0C234B'],
  ucla: ['UCLA', '#2774AE', '#FFD100'],
  usc: ['University of Southern California', '#990000', '#FFC72C'],
  cal: ['UC Berkeley', '#003262', '#FDB515'],
  stanford: ['Stanford University', '#8C1515', null],
  ucsd: ['UC San Diego', '#182B49', '#C69214'],
  sdsu: ['San Diego State University', '#A6192E', null],
  uw: ['University of Washington', '#4B2E83', '#B7A57A'],
  uo: ['University of Oregon', '#154733', '#FEE123'],
  utah: ['University of Utah', '#CC0000', null],
  cu: ['CU Boulder', '#CFB87C', '#000000'],
  utaustin: ['UT Austin', '#BF5700', null],
  tamu: ['Texas A&M University', '#500000', null],
  rice: ['Rice University', '#00205B', null],
  smu: ['Southern Methodist University', '#C8102E', '#0033A0'],
  ou: ['University of Oklahoma', '#841617', null],
  mizzou: ['University of Missouri', '#F1B82D', '#000000'],
  wustl: ['Washington University in St. Louis', '#A51417', null],
  wisconsin: ['University of Wisconsin–Madison', '#C5050C', null],
  minnesota: ['University of Minnesota', '#7A0019', '#FFCC33'],
  northwestern: ['Northwestern University', '#4E2A84', null],
  uchicago: ['University of Chicago', '#800000', null],
  illinois: ['University of Illinois', '#E84A27', '#13294B'],
  purdue: ['Purdue University', '#B1810B', '#000000'],
  iu: ['Indiana University', '#990000', null],
  michigan: ['University of Michigan', '#00274C', '#FFCB05'],
  osu: ['Ohio State University', '#BB0000', null],
  penn: ['University of Pennsylvania', '#011F5B', '#990000'],
  pennstate: ['Penn State University', '#041E42', null],
  pitt: ['University of Pittsburgh', '#003594', '#FFB81C'],
  cmu: ['Carnegie Mellon University', '#C41230', null],
  nyu: ['New York University', '#57068C', null],
  columbia: ['Columbia University', '#003D74', '#B9D9EB'],
  cornell: ['Cornell University', '#B31B1B', null],
  yale: ['Yale University', '#00356B', null],
  harvard: ['Harvard University', '#A51C30', null],
  bu: ['Boston University', '#CC0000', null],
  georgetown: ['Georgetown University', '#041E42', null],
  umd: ['University of Maryland', '#E21833', '#FFD520'],
  uva: ['University of Virginia', '#232D4B', '#E57200'],
  duke: ['Duke University', '#001A57', null],
  unc: ['UNC Chapel Hill', '#7BAFD4', '#13294B'],
  gt: ['Georgia Tech', '#B3A369', '#003057'],
  uga: ['University of Georgia', '#BA0C2F', '#000000'],
  vanderbilt: ['Vanderbilt University', '#866D4B', '#000000'],
  ala: ['University of Alabama', '#9E1B32', null],
  uf: ['University of Florida', '#0021A5', '#FA4616'],
  fsu: ['Florida State University', '#782F40', '#CEB888'],
  miami: ['University of Miami', '#F47321', '#005030'],
};
const GREEK_LETTERS = {
  'sigma chi': 'ΣΧ', 'sigma alpha epsilon': 'ΣΑΕ', 'sae': 'ΣΑΕ', 'kappa sigma': 'ΚΣ',
  'sigma nu': 'ΣΝ', 'phi delta theta': 'ΦΔΘ', 'phi delt': 'ΦΔΘ', 'pi kappa alpha': 'ΠΚΑ',
  'pike': 'ΠΚΑ', 'beta theta pi': 'ΒΘΠ', 'delta tau delta': 'ΔΤΔ', 'delt': 'ΔΤΔ',
  'phi gamma delta': 'ΦΓΔ', 'fiji': 'ΦΓΔ', 'alpha tau omega': 'ΑΤΩ', 'ato': 'ΑΤΩ',
  'kappa alpha': 'ΚΑ', 'kappa alpha order': 'ΚΑ', 'theta chi': 'ΘΧ', 'delta sigma phi': 'ΔΣΦ',
  'lambda chi alpha': 'ΛΧΑ', 'tau kappa epsilon': 'ΤΚΕ', 'tke': 'ΤΚΕ', 'zeta beta tau': 'ΖΒΤ',
  'zbt': 'ΖΒΤ', 'delta upsilon': 'ΔΥ', 'phi kappa psi': 'ΦΚΨ', 'alpha epsilon pi': 'ΑΕΠ',
  'aepi': 'ΑΕΠ', 'sigma phi epsilon': 'ΣΦΕ', 'sig ep': 'ΣΦΕ', 'chi phi': 'ΧΦ',
  'pi kappa phi': 'ΠΚΦ', 'phi kappa tau': 'ΦΚΤ', 'delta chi': 'ΔΧ', 'alpha sigma phi': 'ΑΣΦ',
  'psi upsilon': 'ΨΥ', 'alpha chi omega': 'ΑΧΩ', 'axo': 'ΑΧΩ', 'kappa kappa gamma': 'ΚΚΓ',
  'chi omega': 'ΧΩ', 'delta gamma': 'ΔΓ', 'alpha phi': 'ΑΦ', 'pi beta phi': 'ΠΒΦ',
  'kappa delta': 'ΚΔ', 'zeta tau alpha': 'ΖΤΑ', 'zta': 'ΖΤΑ', 'gamma phi beta': 'ΓΦΒ',
  'alpha delta pi': 'ΑΔΠ', 'adpi': 'ΑΔΠ', 'sigma kappa': 'ΣΚ', 'delta delta delta': 'ΔΔΔ',
  'tri delta': 'ΔΔΔ', 'tridelta': 'ΔΔΔ', 'alpha omicron pi': 'ΑΟΠ', 'phi mu': 'ΦΜ',
  'alpha gamma delta': 'ΑΓΔ', 'alpha xi delta': 'ΑΞΔ', 'delta zeta': 'ΔΖ',
  'kappa alpha theta': 'ΚΑΘ', 'alpha epsilon phi': 'ΑΕΦ',
};
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp(((n >> 16) & 255) * (1 + pct));
  const g = clamp(((n >> 8) & 255) * (1 + pct));
  const b = clamp((n & 255) * (1 + pct));
  return '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function schoolColors(code) {
  const s = SCHOOLS[code];
  if (!s) return ['#516AF6', '#2E3A8C'];
  return [s[1], s[2] || shade(s[1], -0.42)];
}
function normChapter(s) { return String(s).toLowerCase().replace(/[.'’]/g, '').replace(/\s+/g, ' ').trim(); }
function greekFor(chapterName) { return GREEK_LETTERS[normChapter(chapterName)] || null; }
function initialsOf(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function glyphFor(chapterName) { return chapterName ? (greekFor(chapterName) || initialsOf(chapterName)) : '?'; }

const WINDOW_LABEL = { '24h': 'today', '7d': 'this week', '30d': 'this month', all: 'total' };
const PEOPLE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 8.5c1.4.3 2.5 1.5 2.5 3s-1.1 2.7-2.5 3M20 19c0-2.3-1.6-4.2-3.8-4.8"/></svg>';
const EMPTY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 3.5 21 8.5M21 3.5 16 8.5"/></svg>';

let currentWindow = 'all';

async function loadClans() {
  try {
    const res = await fetch('/api/clans?window=' + currentWindow, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad status');
    const { clans } = await res.json();
    render(clans);
    $('load-error').hidden = true;
  } catch (e) {
    $('load-error').hidden = false;
    $('list').innerHTML = '';
  }
}
$('retry-btn').addEventListener('click', loadClans);

function render(clans) {
  if (!clans.length) {
    $('list').innerHTML = `<div class="empty">${EMPTY_ICON}No clans yet — be the first to create one.</div>`;
    return;
  }
  const showStat = currentWindow !== 'all'; // "all" would just repeat the member count
  $('list').innerHTML = clans.map((c, i) => {
    const rank = i + 1;
    const rankCls = rank <= 3 ? ' r' + rank : '';
    const [a, b] = schoolColors(c.school);
    const glyph = glyphFor(c.chapterName);
    const membersLine = c.chapterSize ? `${c.members} of ${c.chapterSize} joined` : `${c.members} joined`;
    return `<div class="row">
      <div class="rank${rankCls}">${rank}</div>
      <div class="icon ${glyph.length >= 3 ? 'small-glyph' : ''}" style="background:linear-gradient(135deg, ${a}, ${b})">${esc(glyph)}</div>
      <div class="meta">
        <div class="name">${esc(c.chapterName)}</div>
        <div class="sub" title="${esc(c.schoolLabel)}">${esc(c.schoolLabel)} · ${membersLine}</div>
      </div>
      ${showStat ? `<div class="stat">
        <div class="joined ${c.joined === 0 ? 'zero' : ''}">${c.joined > 0 ? '+' : ''}${c.joined}</div>
        <div class="window-label">${esc(WINDOW_LABEL[currentWindow])}</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

$('tabs').querySelectorAll('button').forEach((b) => {
  b.addEventListener('click', () => {
    currentWindow = b.dataset.w;
    $('tabs').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
    loadClans();
  });
});

loadClans();
</script>
</body>
</html>
