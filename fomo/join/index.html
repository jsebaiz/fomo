<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>fomo / join</title>
<link rel="icon" href="/fomo-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B091F; --space:#05040f;
  --border:rgba(234,237,255,0.10); --border-strong:rgba(234,237,255,0.18);
  --blue:#516AF6; --blue-electric:#4A36FF; --blue-light:#ACB8F9;
  --text:#EAEDFF; --text-dim:rgba(234,237,255,0.68); --text-faint:rgba(234,237,255,0.44);
  --red:#FF8C8C;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html{overflow-x:hidden;}
body{margin:0; background:var(--space); color:var(--text); font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif; line-height:1.5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; overflow:hidden;}
button{font-family:inherit;}
a{color:inherit; text-decoration:none;}

.stars{position:fixed; inset:0; z-index:0;}
.star{position:absolute; border-radius:50%; background:#fff;}
.earth{position:fixed; z-index:0; width:140vw; height:140vw; left:54vw; top:-84vw; border-radius:50%;
  background:radial-gradient(closest-side, #060a1c 0%, #0a1740 58%, #17356f 78%, #3f6fc0 90%, #a9c6ff 96.5%, #f2f6ff 99%, #ffffff 100%);
  box-shadow:0 0 90px 12px rgba(120,160,255,0.28), inset 0 0 60px rgba(255,255,255,0.25);}
.shade{position:fixed; inset:0; z-index:1; background:radial-gradient(ellipse 46% 42% at 50% 45%, rgba(5,4,15,0.6), rgba(5,4,15,0) 72%);}

.card{position:relative; z-index:2; max-width:480px; width:100%; text-align:center;}
.brand{display:flex; align-items:center; justify-content:center; gap:12px; font-size:1.55rem; font-weight:800; letter-spacing:-0.03em; margin-bottom:38px; color:var(--text);}
.badge{display:flex; align-items:center; justify-content:center; flex-shrink:0; width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, var(--blue-light), var(--blue-electric)); box-shadow:0 3px 14px rgba(81,106,246,.4);}
.badge svg{width:58%; height:58%; color:#fff;}
h1{font-size:clamp(1.9rem,4.5vw,2.6rem); font-weight:800; letter-spacing:-0.03em; margin:0 0 16px; line-height:1.15;
   background:linear-gradient(135deg, var(--text) 30%, var(--blue-light)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sub{font-size:1.05rem; color:var(--text-dim); margin:0 0 34px;}

.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:17px; border-radius:14px; font-weight:700; font-size:1.02rem; cursor:pointer; border:1px solid transparent; transition:transform .15s ease, filter .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--blue-electric); color:#fff; box-shadow:0 10px 30px rgba(81,106,246,.35);}
.btn-primary:hover{filter:brightness(1.12);}
.btn:disabled{opacity:.5; cursor:default; transform:none;}

.divider{display:flex; align-items:center; gap:12px; margin:34px 0 20px; color:var(--text-faint); font-size:0.8rem;}
.divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--border);}

.username-block p{font-size:0.88rem; color:var(--text-dim); margin:0 0 12px;}
.username-row{display:flex; gap:8px;}
.username-row input{flex:1; min-width:0; background:rgba(255,255,255,0.05); border:1px solid var(--border-strong); border-radius:12px; padding:13px 14px; color:var(--text); font-family:inherit; font-size:0.95rem; outline:none;}
.username-row input:focus{border-color:var(--blue);}
.username-row button{background:#fff; color:var(--ink); border:none; border-radius:12px; padding:0 18px; font-weight:700; font-size:0.92rem; cursor:pointer; white-space:nowrap;}
.username-row button:hover{background:var(--blue-light);}
.username-row button:disabled{opacity:.5; cursor:default;}

.msg{font-size:0.84rem; margin:12px 0 0; min-height:1.2em;}
.msg.err{color:var(--red);}
.msg.ok{color:var(--blue-light);}
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="earth" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>

<div class="card">
  <div class="brand"><span class="badge"><svg viewBox="0 0 100 100" fill="currentColor"><path d="M36.9747 24.3586C44.1067 24.3587 49.7941 27.9515 52.9484 33.5959C48.7626 38.0418 45.6617 43.7612 44.4679 50.0002C43.2743 56.2391 44.1865 61.9572 46.67 66.4026C41.3555 72.0468 34.2931 75.6408 27.1613 75.6409C18.432 75.6407 11.8659 70.2588 9.46204 62.3196H26.8478C27.4159 62.3193 28.0059 61.8593 28.1691 61.2932L34.6486 38.7043C34.8098 38.1381 34.4815 37.6782 33.9152 37.678H14.1788C19.6213 29.7404 28.2465 24.3588 36.9747 24.3586Z"/><path d="M72.3285 24.3586C85.0779 24.3586 93.2156 35.8374 90.5062 49.9993C87.7966 64.1596 75.2646 75.6409 62.515 75.6409C53.7856 75.6408 47.2196 70.2589 44.8158 62.3196H64.1537C64.7218 62.3194 65.3127 61.8594 65.476 61.2932L71.9545 38.7043C72.1157 38.138 71.7876 37.678 71.2211 37.678H49.5316C54.9741 29.7401 63.5999 24.3587 72.3285 24.3586Z"/></svg></span>fomo</div>
  <h1 id="headline">Join your frat in Greek Wars.</h1>
  <p class="sub">Trade with your brothers. Climb the board. Bring the house.</p>

  <a class="btn btn-primary" href="https://fomo.family" target="_blank" rel="noopener">Join now</a>

  <div class="username-block" id="username-block" hidden>
    <div class="divider">already have fomo?</div>
    <p>Type your username to join the frat.</p>
    <div class="username-row">
      <input type="text" id="username" placeholder="your fomo username" autocomplete="off" maxlength="24">
      <button type="button" id="join-btn">Join</button>
    </div>
    <p class="msg" id="join-msg"></p>
  </div>
</div>

<script>
function buildStars() {
  const host = document.getElementById('stars');
  let s = 20260919;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('i');
    el.className = 'star';
    const size = rnd() < 0.85 ? 1 : 2;
    el.style.cssText = 'left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) + '%;width:' + size + 'px;height:' + size + 'px;opacity:' + (0.25 + rnd() * 0.65).toFixed(2);
    host.appendChild(el);
  }
}
buildStars();

// The headline always reads "Join your frat in Greek Wars." — only whether the
// username section appears depends on the referral code actually being valid.
const ref = new URLSearchParams(location.search).get('ref');
if (ref && /^[a-z0-9]{4,16}$/.test(ref)) {
  fetch('/api/clans/' + encodeURIComponent(ref))
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => { if (data) document.getElementById('username-block').hidden = false; })
    .catch(() => {});
}

document.getElementById('join-btn').addEventListener('click', async () => {
  const input = document.getElementById('username');
  const msg = document.getElementById('join-msg');
  const btn = document.getElementById('join-btn');
  msg.className = 'msg'; msg.textContent = '';
  const username = input.value.trim();
  if (username.length < 2) { msg.className = 'msg err'; msg.textContent = 'enter your fomo username.'; return; }

  btn.disabled = true;
  try {
    const res = await fetch('/api/clans/' + encodeURIComponent(ref) + '/join', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username }),
    });
    if (res.status === 201) {
      const data = await res.json();
      msg.className = 'msg ok'; msg.textContent = `thanks — you're submitted to ${data.name}. we'll get you approved into the frat soon.`;
      input.value = ''; input.disabled = true; btn.disabled = true;
    } else {
      const body = await res.json().catch(() => ({}));
      msg.className = 'msg err'; msg.textContent = (body.error || 'something went wrong.').toLowerCase();
      btn.disabled = false;
    }
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = 'couldn’t reach the server.';
    btn.disabled = false;
  }
});
document.getElementById('username').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('join-btn').click(); });
</script>
</body>
</html>
