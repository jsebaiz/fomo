<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Campus leaderboard · fomo</title>
<link rel="icon" href="/fomo-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070D; --surface:#101019; --surface-2:#191924; --surface-3:#22222F;
  --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.15);
  --white:#FFFFFF; --text:#ECECF4; --text-dim:#9A9AAE; --text-faint:#67677A;
  --violet:#7C5CFF; --violet-hi:#9179FF; --violet-dim:#B3A5FF; --violet-soft:rgba(124,92,255,.14);
  --green:#2ED47A; --red:#F2555A;
  --gold:#FFC53D; --silver:#C9CEDC; --bronze:#DE8B4F;
  --r:16px; --r-lg:24px;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{background:var(--bg); color:var(--text); font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif; line-height:1.45; min-height:100vh; -webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;}
a{color:inherit; text-decoration:none;}
svg{display:block;}
.num{font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }

.wrap{max-width:720px; margin:0 auto; padding:0 20px 56px;}

/* ---------- top ---------- */
.top{display:flex; align-items:center; gap:10px; padding:20px 0 26px;}
.brand{display:flex; align-items:center; gap:8px; font-size:1.05rem; font-weight:800; color:var(--white); letter-spacing:-0.02em;}
.brand svg{width:22px; height:22px;}
.brand .slash{color:var(--text-faint); font-weight:600;}
.sp{flex:1;}
.gbtn{border:1px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:12px; padding:9px 15px; font-size:0.85rem; font-weight:700; cursor:pointer; transition:.15s;}
.gbtn:hover{background:var(--surface-2); color:var(--white);}
.gbtn.on{background:var(--violet); border-color:var(--violet); color:#fff;}

h1{font-size:clamp(2rem,7vw,2.6rem); font-weight:800; letter-spacing:-0.04em; line-height:1.05; margin:0 0 8px; color:var(--white);}
.sub{font-size:0.95rem; color:var(--text-faint); margin:0 0 22px;}
.sub .seed{color:var(--gold); font-weight:600;}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; background:var(--surface); border-radius:14px; padding:5px; margin-bottom:18px;}
.tabs button{flex:1; background:none; border:none; color:var(--text-faint); font-weight:700; font-size:0.88rem; padding:11px 8px; border-radius:10px; cursor:pointer; transition:.15s;}
.tabs button:hover{color:var(--text);}
.tabs button.active{background:var(--violet); color:#fff;}

/* ---------- pills ---------- */
.pills{display:flex; gap:10px; margin-bottom:26px;}
.pill{flex:1; background:var(--surface); border-radius:var(--r); padding:15px 16px; min-width:0;}
.pill .v{font-size:1.45rem; font-weight:800; color:var(--white); letter-spacing:-0.03em; line-height:1;}
.pill .v.violet{color:var(--violet-dim);} .pill .v.green{color:var(--green);}
.pill .k{font-size:0.74rem; color:var(--text-faint); margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
@media (max-width:460px){ .pill{padding:13px 12px;} .pill .v{font-size:1.2rem;} .pill .k{font-size:0.68rem;} }

/* ---------- leader card ---------- */
.lead{position:relative; border-radius:var(--r-lg); padding:24px; margin-bottom:26px; overflow:hidden;
  background:linear-gradient(135deg, #7C5CFF 0%, #6246E0 42%, #3A2E7A 100%); border:1px solid rgba(255,255,255,.14);}
.lead::after{content:''; position:absolute; inset:0; background:radial-gradient(120% 90% at 100% 0%, var(--tint,transparent) 0%, transparent 60%); pointer-events:none; opacity:.75;}
.lead > *{position:relative; z-index:1;}
.lead-tag{display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,.26); color:#FFE9A8; font-size:0.66rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; padding:6px 11px; border-radius:8px; margin-bottom:18px;}
.lead-tag svg{width:12px; height:12px;}
.lead-row{display:flex; align-items:center; gap:15px;}
.lead-id{flex:1; min-width:0;}
.lead-id .h{font-size:1.4rem; font-weight:800; color:var(--white); letter-spacing:-0.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lead-id .s{font-size:0.86rem; color:rgba(255,255,255,.72); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lead-big{text-align:right; flex-shrink:0;}
.lead-big b{display:block; font-size:1.7rem; font-weight:800; color:var(--white); letter-spacing:-0.035em; line-height:1;}
.lead-big span{font-size:0.72rem; color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:0.08em;}
@media (max-width:430px){ .lead-big b{font-size:1.35rem;} }
.lead-foot{display:flex; align-items:center; gap:8px; margin-top:18px; padding-top:15px; border-top:1px solid rgba(255,255,255,.16); font-size:0.85rem; color:rgba(255,255,255,.62); flex-wrap:wrap;}
.lead-foot a{color:#fff; font-weight:700;}
.lead-foot a:hover{text-decoration:underline;}
.lead-foot em{font-style:italic;}

/* ---------- list ---------- */
.list-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.list-top h2{font-size:1.1rem; font-weight:800; color:var(--white); letter-spacing:-0.02em; margin:0; flex:1;}
.mini{display:flex; gap:3px; background:var(--surface); border-radius:11px; padding:4px;}
.mini button{background:none; border:none; color:var(--text-faint); font-weight:700; font-size:0.78rem; padding:7px 11px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.mini button:hover{color:var(--text);}
.mini button.active{background:var(--surface-3); color:var(--white);}

.find{width:100%; background:var(--surface); border:1px solid transparent; border-radius:13px; padding:12px 15px; color:var(--text); font-size:0.9rem; outline:none; margin-bottom:12px; transition:.15s;}
.find:focus{border-color:var(--violet);}
.find::placeholder{color:var(--text-faint);}

.board{display:flex; flex-direction:column; gap:8px;}
.card{background:var(--surface); border-radius:var(--r); overflow:hidden; transition:background .14s ease;}
.card.open{background:var(--surface-2);}
.row{position:relative; display:flex; align-items:center; gap:13px; padding:14px 16px; cursor:pointer;}
.row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:var(--fill,0%);
  background:linear-gradient(90deg, var(--violet-soft), transparent); pointer-events:none;}
.row > *{position:relative;}
.card:hover .row{background:rgba(255,255,255,.025);}

.medal{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; font-weight:800; color:var(--text-faint); background:var(--surface-3); flex-shrink:0;}
.medal.g1{background:linear-gradient(145deg,#FFD873,#E8A61C); color:#3A2600;}
.medal.g2{background:linear-gradient(145deg,#E4E8F2,#A9B0C2); color:#2B2F3A;}
.medal.g3{background:linear-gradient(145deg,#F0A96A,#C06F2E); color:#3A1F00;}

.who{flex:1; min-width:0;}
.who .h{font-size:1rem; font-weight:700; color:var(--white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.who .s{display:flex; align-items:center; gap:7px; font-size:0.78rem; color:var(--text-faint); margin-top:3px;}
.who .s .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.flame{display:inline-flex; align-items:center; gap:3px; color:var(--gold); font-weight:700; flex-shrink:0;}
.flame svg{width:11px; height:11px;}
.quiet{color:var(--red); font-weight:700; flex-shrink:0;}

.big{text-align:right; flex-shrink:0;}
.big b{display:block; font-size:1.05rem; font-weight:800; color:var(--white); letter-spacing:-0.02em; line-height:1.15;}
.big b.off{color:var(--text-faint);}
.big span{font-size:0.74rem; font-weight:700;}
.big span.up{color:var(--green);} .big span.down{color:var(--red);} .big span.flat{color:var(--text-faint);}
.chev{width:15px; height:15px; color:var(--text-faint); flex-shrink:0; transition:transform .2s ease;}
.card.open .chev{transform:rotate(180deg); color:var(--violet-dim);}

/* ---------- expanded ---------- */
.open-body{padding:4px 16px 18px;}
.facts{display:flex; gap:10px; margin-bottom:16px;}
.fact{flex:1; background:var(--bg); border-radius:13px; padding:12px 13px; min-width:0;}
.fact b{display:block; font-size:1.05rem; font-weight:800; color:var(--white); letter-spacing:-0.02em;}
.fact span{display:block; font-size:0.7rem; color:var(--text-faint); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.lbl{font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-faint); margin:0 0 11px;}
.bars{display:flex; align-items:flex-end; gap:5px; height:64px;}
.bars .b{flex:1; display:flex; align-items:flex-end; height:100%;}
.bars .b i{display:block; width:100%; min-height:3px; border-radius:4px; background:var(--surface-3);}
.bars .b.has i{background:var(--violet);}
.bars .b.now i{background:var(--violet-hi);}
.bars-x{display:flex; gap:5px; margin-top:7px;}
.bars-x span{flex:1; text-align:center; font-size:0.62rem; color:var(--text-faint);}

.ups{margin-top:18px;}
.up-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem;}
.up-row:last-child{border-bottom:none;}
.up-row .t{font-size:0.58rem; font-weight:800; letter-spacing:0.07em; text-transform:uppercase; padding:3px 6px; border-radius:5px; background:var(--surface-3); color:var(--text-faint); flex-shrink:0;}
.up-row .t.reel{background:var(--violet-soft); color:var(--violet-dim);}
.up-row .d{flex:1; color:var(--text-dim); min-width:0;}
.up-row .v{font-weight:800; color:var(--white); flex-shrink:0;}
.up-row .v.best{color:var(--green);}

.owner{margin-top:18px; padding-top:15px; border-top:1px solid var(--border); display:flex; align-items:center; gap:9px; font-size:0.87rem; color:var(--text-faint); flex-wrap:wrap;}
.owner a{color:var(--violet-dim); font-weight:700;}
.owner a:hover{text-decoration:underline;}
.owner .go{margin-left:auto; border:1px solid var(--border); border-radius:10px; padding:7px 12px; font-size:0.78rem; font-weight:700; color:var(--text-dim);}
.owner .go:hover{color:var(--white); border-color:var(--border-2);}

.edit{margin-top:16px; padding-top:15px; border-top:1px solid var(--border);}
.edit .grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
@media (max-width:520px){ .edit .grid{grid-template-columns:1fr;} }
.edit input, .edit select{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:11px 13px; color:var(--text); font-size:0.87rem; outline:none;}
.edit input:focus, .edit select:focus{border-color:var(--violet);}
.edit .go{margin-top:9px; background:var(--violet); color:#fff; border:none; border-radius:11px; padding:11px 18px; font-size:0.85rem; font-weight:800; cursor:pointer;}
.edit .go:hover{background:var(--violet-hi);}
.edit .go.done{background:var(--green); color:#062B18;}

.none{padding:48px 16px; text-align:center; color:var(--text-faint); font-size:0.92rem;}
.foot{text-align:center; font-size:0.78rem; color:var(--text-faint); margin-top:40px;}
.foot a{color:var(--text-dim);} .foot a:hover{color:var(--white);}

/* ---------- modal ---------- */
.ov{position:fixed; inset:0; background:rgba(5,5,12,.78); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:40; padding:18px;}
.mod{width:100%; max-width:560px; background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-lg); padding:22px;}
.mod h3{margin:0 0 6px; font-size:1.05rem; font-weight:800; color:var(--white);}
.mod p{margin:0 0 14px; font-size:0.85rem; color:var(--text-dim); line-height:1.5;}
.mod textarea{width:100%; height:200px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--text); font-family:ui-monospace,Menlo,monospace; font-size:0.76rem; outline:none; resize:vertical;}
.mod .acts{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.mod .acts button{padding:10px 16px; border-radius:11px; font-weight:700; font-size:0.85rem; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text);}
.mod .acts button.p{background:var(--violet); border-color:var(--violet); color:#fff;}
.mod .acts button.d{color:var(--red); border-color:rgba(242,85,90,.3);}
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <a class="brand" href="/fomocontent/">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="26" fill="#171722"/><g fill="#EAEDFF"><path d="M36.9747 24.3586C44.1067 24.3587 49.7941 27.9515 52.9484 33.5959C48.7626 38.0418 45.6617 43.7612 44.4679 50.0002C43.2743 56.2391 44.1865 61.9572 46.67 66.4026C41.3555 72.0468 34.2931 75.6408 27.1613 75.6409C18.432 75.6407 11.8659 70.2588 9.46204 62.3196H26.8478C27.4159 62.3193 28.0059 61.8593 28.1691 61.2932L34.6486 38.7043C34.8098 38.1381 34.4815 37.6782 33.9152 37.678H14.1788C19.6213 29.7404 28.2465 24.3588 36.9747 24.3586Z"/><path d="M72.3285 24.3586C85.0779 24.3586 93.2156 35.8374 90.5062 49.9993C87.7966 64.1596 75.2646 75.6409 62.515 75.6409C53.7856 75.6408 47.2196 70.2589 44.8158 62.3196H64.1537C64.7218 62.3194 65.3127 61.8594 65.476 61.2932L71.9545 38.7043C72.1157 38.138 71.7876 37.678 71.2211 37.678H49.5316C54.9741 29.7401 63.5999 24.3587 72.3285 24.3586Z"/></g></svg>
      fomo <span class="slash">/content</span>
    </a>
    <div class="sp"></div>
    <button class="gbtn" id="admin-btn">Admin</button>
    <button class="gbtn" id="export-btn" hidden>Export</button>
  </div>

  <h1>Campus leaderboard</h1>
  <p class="sub" id="sub"></p>

  <div class="tabs" id="tabs" role="group" aria-label="Period">
    <button data-days="1">24h</button>
    <button data-days="7" class="active">7d</button>
    <button data-days="30">30d</button>
    <button data-days="0">All</button>
  </div>

  <div class="pills" id="pills"></div>

  <div id="lead"></div>

  <div class="list-top">
    <h2>All pages</h2>
    <div class="mini" id="mini" role="group" aria-label="Sort">
      <button data-k="views" class="active">Views</button>
      <button data-k="posts">Uploads</button>
      <button data-k="last">Recent</button>
    </div>
  </div>

  <input class="find" id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search pages">

  <div class="board" id="board"></div>

  <p class="foot"><a href="/fomo/clans/">Chapter leaderboard</a> · <a href="/fomo/prizes/">Prizes</a></p>

</div>

<script src="/fomocontent/content-data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const { SEED, COLORS, ACCOUNTS } = FomoContent;

/* ------------------------------------------------------------------ format */

function fmt(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (n >= 1e4) return Math.round(n / 1e3) + 'K';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}
const comma = (n) => Math.round(n).toLocaleString('en-US');

function ago(ms, now) {
  if (ms == null) return 'never';
  const d = now - ms;
  if (d < 36e5) return Math.max(1, Math.round(d / 6e4)) + 'm';
  if (d < DAY) return Math.round(d / 36e5) + 'h';
  const days = Math.round(d / DAY);
  return days < 14 ? days + 'd' : Math.round(days / 7) + 'w';
}
const dayLabel = (ms) => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

function delta(cur, prev) {
  if (!prev || !cur) return { txt: '', cls: 'flat' };
  const p = Math.round(((cur - prev) / prev) * 100);
  if (p === 0) return { txt: 'flat', cls: 'flat' };
  return { txt: (p > 0 ? '+' : '−') + Math.abs(p) + '%', cls: p > 0 ? 'up' : 'down' };
}

/* ------------------------------------------------------------------ colors */

const lum = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
};
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (sh) => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return '#' + [ch(16), ch(8), ch(0)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
const contrast = (x, y) => { const a = lum(x) + 0.05, b = lum(y) + 0.05; return a > b ? a / b : b / a; };

// The real avatars are the fomo mark in a school's bright color on a deep field
// of its dark one. Sink the field first so a saturated school red stays red.
function crestColors(acc) {
  const [c1, c2] = COLORS[acc.school] || GreekData.schoolColors(acc.school);
  let mark = lum(c1) >= lum(c2) ? c1 : c2;
  const dark = lum(c1) >= lum(c2) ? c2 : c1;
  let bg = mix(dark, '#05050B', 0.62);
  for (let i = 0; i < 3 && contrast(mark, bg) < 3; i++) bg = mix(bg, '#05050B', 0.4);
  for (let i = 0; i < 8 && contrast(mark, bg) < 3; i++) mark = mix(mark, '#FFFFFF', 0.12);
  return { bg, mark, tint: mix(dark, '#1A1526', 0.55) };
}

const MARK = '<path d="M36.9747 24.3586C44.1067 24.3587 49.7941 27.9515 52.9484 33.5959C48.7626 38.0418 45.6617 43.7612 44.4679 50.0002C43.2743 56.2391 44.1865 61.9572 46.67 66.4026C41.3555 72.0468 34.2931 75.6408 27.1613 75.6409C18.432 75.6407 11.8659 70.2588 9.46204 62.3196H26.8478C27.4159 62.3193 28.0059 61.8593 28.1691 61.2932L34.6486 38.7043C34.8098 38.1381 34.4815 37.6782 33.9152 37.678H14.1788C19.6213 29.7404 28.2465 24.3588 36.9747 24.3586Z"/><path d="M72.3285 24.3586C85.0779 24.3586 93.2156 35.8374 90.5062 49.9993C87.7966 64.1596 75.2646 75.6409 62.515 75.6409C53.7856 75.6408 47.2196 70.2589 44.8158 62.3196H64.1537C64.7218 62.3194 65.3127 61.8594 65.476 61.2932L71.9545 38.7043C72.1157 38.138 71.7876 37.678 71.2211 37.678H49.5316C54.9741 29.7401 63.5999 24.3587 72.3285 24.3586Z"/>';

function crest(acc, px) {
  const c = crestColors(acc);
  const r = Math.round(px * 0.34);
  return `<span style="width:${px}px;height:${px}px;border-radius:${r}px;background:${c.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0" aria-hidden="true"><svg viewBox="0 0 100 100" fill="${c.mark}" style="width:66%;height:66%">${MARK}</svg></span>`;
}

/* ------------------------------------------------------------- local edits */

const LS_KEY = 'fomo.content.overrides.v1';
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { overrides = {}; }
const saveOverrides = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(overrides)); } catch (e) {} };
const ov = (h) => (overrides[h] = overrides[h] || {});

function merged(acc) {
  const o = overrides[acc.handle] || {};
  const extra = o.posts || [];
  return {
    ...acc,
    posts: acc.posts.concat(extra).sort((a, b) => Date.parse(a.at) - Date.parse(b.at)),
    manager: { name: (o.manager && o.manager.name) || acc.manager.name, ig: (o.manager && o.manager.ig) || acc.manager.ig },
    totalUploads: acc.totalUploads + extra.length,
  };
}

/* ----------------------------------------------------------------- metrics */

// Consecutive 24h buckets with an upload, counting back from now. Posting
// yesterday but not yet today still keeps the run alive.
function streak(posts, now) {
  if (!posts.length) return 0;
  const seen = new Set(posts.map((p) => Math.floor((now - Date.parse(p.at)) / DAY)));
  let d = 0;
  if (!seen.has(0)) { if (!seen.has(1)) return 0; d = 1; }
  let s = 0;
  while (seen.has(d)) { s++; d++; }
  return s;
}

// `days` of 0 means all time: no comparison period, cadence over the real span.
function metrics(acc, now, days) {
  const all = days === 0;
  const span = all ? Infinity : days * DAY;
  const at = (p) => Date.parse(p.at);
  const cur = all ? acc.posts : acc.posts.filter((p) => now - at(p) <= span);
  const prev = all ? [] : acc.posts.filter((p) => { const d = now - at(p); return d > span && d <= 2 * span; });
  const sum = (a) => a.reduce((s, p) => s + p.views, 0);
  const avg = (a) => (a.length ? Math.round(sum(a) / a.length) : 0);
  const last = acc.posts.length ? at(acc.posts[acc.posts.length - 1]) : null;
  const weeksSpan = all && acc.posts.length ? Math.max(1, (now - at(acc.posts[0])) / (7 * DAY)) : days / 7;

  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const hi = now - i * 7 * DAY, lo = hi - 7 * DAY;
    const w = acc.posts.filter((p) => at(p) > lo && at(p) <= hi);
    weeks.push({ posts: w.length, views: sum(w) });
  }

  return {
    acc, weeks,
    uploads: cur.length,
    reach: sum(cur),
    avgViews: avg(cur),
    prevAvg: avg(prev),
    cadence: cur.length / weeksSpan,
    best: cur.length ? cur.reduce((m, p) => (p.views > m.views ? p : m)) : null,
    last,
    cold: last == null || now - last > 3 * DAY,
    streak: streak(acc.posts, now),
    recent: acc.posts.slice(-5).reverse(),
  };
}

/* ------------------------------------------------------------------- state */

let WINDOW = 7;
let SORT = 'views';
let QUERY = '';
let ADMIN = false;
const open = new Set();

const SORTERS = {
  views: (a, b) => b.avgViews - a.avgViews,
  posts: (a, b) => b.uploads - a.uploads || b.avgViews - a.avgViews,
  last: (a, b) => (b.last || 0) - (a.last || 0),
};
const periodWord = () => (WINDOW === 0 ? 'all time' : WINDOW === 1 ? 'today' : 'last ' + WINDOW + ' days');
const compute = () => { const now = Date.now(); return ACCOUNTS.map((a) => metrics(merged(a), now, WINDOW)); };

/* ------------------------------------------------------------------ render */

const FLAME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.4-2-.4-2 2 1.4 3.4 3.4 3.4 6a8 8 0 0 1-16 0C2 10 8 8 12 2z"/></svg>';

function renderPills(rows) {
  const uploads = rows.reduce((s, r) => s + r.uploads, 0);
  const reach = rows.reduce((s, r) => s + r.reach, 0);
  const avg = uploads ? Math.round(reach / uploads) : 0;
  $('pills').innerHTML = `
    <div class="pill"><div class="v">${comma(uploads)}</div><div class="k">Uploads</div></div>
    <div class="pill"><div class="v violet">${fmt(avg)}</div><div class="k">Avg views</div></div>
    <div class="pill"><div class="v green">${fmt(reach)}</div><div class="k">Total views</div></div>`;
}

function ownerBit(m, fallback) {
  if (!m.ig) return `<em>${fallback}</em>`;
  const h = m.ig.replace(/^@/, '');
  return `<a href="https://www.instagram.com/${encodeURIComponent(h)}/" target="_blank" rel="noopener" onclick="event.stopPropagation()">@${esc(h)}</a>${m.name ? ' · ' + esc(m.name) : ''}`;
}

function renderLead(rows) {
  const top = rows.filter((r) => r.uploads > 0).sort((a, b) => b.reach - a.reach)[0];
  if (!top) { $('lead').innerHTML = ''; return; }
  const c = crestColors(top.acc);
  $('lead').innerHTML = `
    <div class="lead" style="--tint:${c.tint}">
      <div class="lead-tag">${FLAME} Top page · ${esc(periodWord())}</div>
      <div class="lead-row">
        ${crest(top.acc, 54)}
        <div class="lead-id">
          <div class="h">@${esc(top.acc.handle)}</div>
          <div class="s">${esc(top.acc.short)} · ${top.uploads} upload${top.uploads === 1 ? '' : 's'}</div>
        </div>
        <div class="lead-big"><b class="num">${fmt(top.reach)}</b><span>views</span></div>
      </div>
      <div class="lead-foot">Run by ${ownerBit(top.acc.manager, 'owner not set')}</div>
    </div>`;
}

function body(m) {
  const a = m.acc;
  const max = Math.max(1, ...m.weeks.map((w) => w.views));
  const bars = m.weeks.map((w, i) => `<div class="b ${w.views ? 'has' : ''} ${i === 7 ? 'now' : ''}" title="${w.posts} upload${w.posts === 1 ? '' : 's'} · ${comma(w.views)} views"><i style="height:${Math.max(3, Math.round((w.views / max) * 60))}px"></i></div>`).join('');
  const topUp = m.recent.length ? Math.max(...m.recent.map((p) => p.views)) : 0;

  return `<div class="open-body">
    <div class="facts">
      <div class="fact"><b class="num">${comma(a.totalUploads)}</b><span>Uploads all time</span></div>
      <div class="fact"><b class="num">${fmt(a.lifetimeAvgViews)}</b><span>All-time avg</span></div>
      <div class="fact"><b class="num">${m.cadence.toFixed(1)}</b><span>A week</span></div>
    </div>

    <p class="lbl">Views · last 8 weeks</p>
    <div class="bars">${bars}</div>
    <div class="bars-x">${m.weeks.map((w, i) => `<span>${i === 7 ? 'now' : 8 - i + 'w'}</span>`).join('')}</div>

    <div class="ups">
      <p class="lbl">Recent uploads</p>
      ${m.recent.length ? m.recent.map((p) => `<div class="up-row">
          <span class="t ${p.type}">${p.type}</span>
          <span class="d">${esc(dayLabel(Date.parse(p.at)))}</span>
          <span class="v num ${m.recent.length > 1 && p.views === topUp ? 'best' : ''}">${fmt(p.views)}</span>
        </div>`).join('') : '<div class="none" style="padding:16px 0">Nothing logged.</div>'}
    </div>

    <div class="owner">
      Run by ${ownerBit(a.manager, 'not set')}
      <a class="go" href="https://www.instagram.com/${encodeURIComponent(a.handle)}/" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open page</a>
    </div>

    ${ADMIN ? `<div class="edit" onclick="event.stopPropagation()">
      <p class="lbl">Owner</p>
      <div class="grid">
        <input data-f="name" data-h="${a.handle}" value="${esc(a.manager.name)}" placeholder="Name" autocomplete="off">
        <input data-f="ig" data-h="${a.handle}" value="${esc(a.manager.ig)}" placeholder="@instagram" autocomplete="off" spellcheck="false">
      </div>
      <button class="go" data-save="${a.handle}">Save owner</button>
      <p class="lbl" style="margin-top:18px">Log an upload</p>
      <div class="grid">
        <input type="datetime-local" data-f="at" data-h="${a.handle}">
        <input type="number" min="0" step="1" data-f="views" data-h="${a.handle}" placeholder="Views">
        <select data-f="type" data-h="${a.handle}"><option value="reel">Reel</option><option value="post">Post</option></select>
      </div>
      <button class="go" data-add="${a.handle}">Add upload</button>
    </div>` : ''}
  </div>`;
}

function renderBoard(rows) {
  const q = QUERY.trim().toLowerCase();
  const list = rows
    .filter((r) => !q || r.acc.handle.includes(q) || r.acc.label.toLowerCase().includes(q) || r.acc.short.toLowerCase().includes(q))
    .sort(SORTERS[SORT]);

  if (!list.length) { $('board').innerHTML = `<div class="none">Nothing matches “${esc(QUERY)}”.</div>`; return; }

  // The violet underlay scales every row against the leader on the active sort.
  const peak = Math.max(1, ...list.map((r) => (SORT === 'posts' ? r.uploads : r.avgViews)));

  $('board').innerHTML = list.map((m, i) => {
    const a = m.acc;
    const d = delta(m.avgViews, m.prevAvg);
    const isOpen = open.has(a.handle);
    const val = SORT === 'posts' ? m.uploads : m.avgViews;
    const headline = SORT === 'posts' ? String(m.uploads) : (m.avgViews ? fmt(m.avgViews) : '—');
    const note = SORT === 'last' ? ago(m.last, Date.now()) : d.txt;
    const noteCls = SORT === 'last' ? 'flat' : d.cls;

    return `<div class="card ${isOpen ? 'open' : ''}">
      <div class="row" data-h="${a.handle}" role="button" tabindex="0" aria-expanded="${isOpen}" style="--fill:${Math.round((val / peak) * 100)}%">
        <div class="medal ${i < 3 ? 'g' + (i + 1) : ''} num">${i + 1}</div>
        ${crest(a, 40)}
        <div class="who">
          <div class="h">@${esc(a.handle)}</div>
          <div class="s">
            <span class="nm">${esc(a.short)}</span>
            ${m.streak >= 2 ? `<span class="flame">${FLAME}${m.streak}d</span>` : ''}
            ${m.cold ? `<span class="quiet">quiet ${esc(ago(m.last, Date.now()))}</span>` : ''}
          </div>
        </div>
        <div class="big">
          <b class="num ${val ? '' : 'off'}">${headline}</b>
          ${note ? `<span class="${noteCls}">${esc(note)}</span>` : ''}
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      ${isOpen ? body(m) : ''}
    </div>`;
  }).join('');
}

function render() {
  const rows = compute();
  $('sub').innerHTML = `${ACCOUNTS.length} pages · ranked by views, ${esc(periodWord())}${SEED ? ' · <span class="seed">sample data</span>' : ''}`;
  renderPills(rows);
  renderLead(rows);
  renderBoard(rows);
}

/* ------------------------------------------------------------- interaction */

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-days]'); if (!b) return;
  WINDOW = Number(b.dataset.days);
  [...$('tabs').children].forEach((x) => x.classList.toggle('active', x === b));
  render();
});

$('mini').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  SORT = b.dataset.k;
  [...$('mini').children].forEach((x) => x.classList.toggle('active', x === b));
  render();
});

let qt;
$('q').addEventListener('input', (e) => {
  clearTimeout(qt);
  const v = e.target.value;
  qt = setTimeout(() => { QUERY = v; renderBoard(compute()); }, 120);
});

const toggleRow = (h) => { open.has(h) ? open.delete(h) : open.add(h); renderBoard(compute()); };

$('board').addEventListener('click', (e) => {
  const save = e.target.closest('[data-save]'); if (save) return saveOwner(save.dataset.save, save);
  const add = e.target.closest('[data-add]'); if (add) return addUpload(add.dataset.add);
  if (e.target.closest('a') || e.target.closest('.edit')) return;
  const row = e.target.closest('.row[data-h]');
  if (row) toggleRow(row.dataset.h);
});

$('board').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.row[data-h]'); if (!row) return;
  e.preventDefault();
  toggleRow(row.dataset.h);
});

/* -------------------------------------------------------------- admin mode */

const field = (h, f, tag) => (document.querySelector(`${tag || 'input'}[data-h="${h}"][data-f="${f}"]`) || {}).value;

function saveOwner(h, btn) {
  ov(h).manager = { name: (field(h, 'name') || '').trim(), ig: (field(h, 'ig') || '').trim().replace(/^@+/, '') };
  saveOverrides();
  btn.classList.add('done');
  btn.textContent = 'Saved';
  setTimeout(render, 450);
}

function addUpload(h) {
  const at = field(h, 'at');
  const views = Number(field(h, 'views'));
  const type = field(h, 'type', 'select') || 'reel';
  if (!at || !(views >= 0)) { alert('Pick a date and enter the view count.'); return; }
  const o = ov(h);
  o.posts = o.posts || [];
  // datetime-local is local time; store the UTC minute so it sorts with the file.
  o.posts.push({ at: new Date(at).toISOString().slice(0, 16) + 'Z', views: Math.round(views), type });
  saveOverrides();
  render();
}

$('admin-btn').addEventListener('click', () => {
  ADMIN = !ADMIN;
  $('admin-btn').classList.toggle('on', ADMIN);
  $('export-btn').hidden = !ADMIN;
  render();
});

/* ------------------------------------------------------------ export edits */

const closeModal = () => { const o = document.querySelector('.ov'); if (o) o.remove(); };

$('export-btn').addEventListener('click', () => {
  const n = Object.keys(overrides).length;
  const text = JSON.stringify(overrides, null, 2);
  const el = document.createElement('div');
  el.className = 'ov';
  el.innerHTML = `<div class="mod" role="dialog" aria-modal="true" aria-label="Local edits">
      <h3>Local edits</h3>
      <p>${n ? `Edits for <b style="color:var(--white)">${n}</b> page${n === 1 ? '' : 's'}, saved in this browser only. Paste them into <code>/fomocontent/content-data.js</code> to make them permanent.` : 'Nothing edited yet. Owners and uploads you add in admin mode land here.'}</p>
      <textarea readonly spellcheck="false">${esc(text)}</textarea>
      <div class="acts">
        <button class="p" id="m-copy">Copy</button>
        <button class="d" id="m-clear">Clear</button>
        <div style="flex:1"></div>
        <button id="m-close">Close</button>
      </div>
    </div>`;
  document.body.appendChild(el);

  el.addEventListener('click', (e) => { if (e.target === el) closeModal(); });
  $('m-close').addEventListener('click', closeModal);
  $('m-copy').addEventListener('click', async (e) => {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (err) {
      // Clipboard API needs a secure context; fall back to selecting the text.
      try { const ta = el.querySelector('textarea'); ta.select(); ta.setSelectionRange(0, 99999); ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    }
    e.target.textContent = ok ? 'Copied' : 'Press ⌘C';
    setTimeout(() => { e.target.textContent = 'Copy'; }, 1800);
  });
  $('m-clear').addEventListener('click', () => {
    if (!confirm('Remove every owner and upload added from this browser? The roster file is untouched.')) return;
    overrides = {};
    saveOverrides();
    closeModal();
    render();
  });
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ------------------------------------------------------------------- start */

// /fomocontent/#fomouva lands with that page already open.
const deep = decodeURIComponent(location.hash.replace(/^#@?/, '')).toLowerCase();
if (deep && ACCOUNTS.some((a) => a.handle === deep)) open.add(deep);

render();

if (deep && open.has(deep)) {
  const el = document.querySelector(`.row[data-h="${deep}"]`);
  if (el) el.scrollIntoView({ block: 'center' });
}
</script>
</body>
</html>
