<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fomo / clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="fomo-favicon.svg" type="image/svg+xml">
<style>
:root{
  --ink:#0B091F; --ink-2:#131029; --ink-3:#1b1740;
  --border:rgba(234,237,255,0.10); --border-strong:rgba(234,237,255,0.18);
  --blue:#516AF6; --blue-electric:#4A36FF; --blue-light:#ACB8F9;
  --lavender:#EAEDFF; --text:#EAEDFF; --text-dim:rgba(234,237,255,0.68); --text-faint:rgba(234,237,255,0.42);
  --green:#7FE3B4; --amber:#F6C85F; --red:#FF8C8C;
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{margin:0; background:var(--ink); color:var(--text); font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif; line-height:1.5;}
h1,h2,h3{margin:0 0 .4em; letter-spacing:-0.01em; font-weight:700;}
p{color:var(--text-dim); margin:0;}
.halo{position:fixed; top:-20%; left:50%; transform:translateX(-50%); width:1400px; height:900px; max-width:200vw; background:radial-gradient(circle, rgba(74,54,255,0.2) 0%, rgba(74,54,255,0.05) 45%, transparent 70%); pointer-events:none; z-index:0;}
.container{max-width:1080px; margin:0 auto; padding:0 24px; position:relative; z-index:1;}

header{padding:28px 24px 8px;}
.header-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; max-width:1080px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem;}
.brand img{width:26px; height:26px; border-radius:7px;}
.brand .tag{color:var(--blue-light); font-weight:600;}
.clock-now{font-size:0.86rem; color:var(--text-faint); font-variant-numeric:tabular-nums;}

section{padding:24px 0;}
.section-title{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--blue-light); font-weight:700; margin-bottom:16px;}

/* Person cards */
.people-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;}
.person-card{background:var(--ink-2); border:1px solid var(--border); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; gap:14px;}
.person-card.active{border-color:rgba(127,227,180,0.4); box-shadow:0 0 0 1px rgba(127,227,180,0.15);}
.person-head{display:flex; align-items:center; gap:12px;}
.avatar{width:38px; height:38px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; color:#fff; flex-shrink:0;}
.person-name{font-weight:700; font-size:1.02rem;}
.status-row{display:flex; align-items:center; gap:7px; font-size:0.8rem; color:var(--text-faint);}
.status-dot{width:8px; height:8px; border-radius:999px; background:var(--text-faint);}
.person-card.active .status-dot{background:var(--green); box-shadow:0 0 0 3px rgba(127,227,180,0.18);}
.person-card.active .status-row{color:var(--green);}

.session-timer{font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text-faint);}
.person-card.active .session-timer{color:var(--text);}

.stat-row{display:flex; gap:18px;}
.stat{display:flex; flex-direction:column; gap:2px;}
.stat .num{font-size:1.05rem; font-weight:700;}
.stat .lbl{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint);}
.stat.overtime .num{color:var(--amber);}

.btn{display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:999px; font-weight:700; font-size:0.92rem; cursor:pointer; border:none; font-family:inherit; transition:transform .15s ease, filter .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-in{background:linear-gradient(135deg, var(--blue-electric), var(--blue)); color:#fff;}
.btn-out{background:#000; color:#fff; border:1px solid var(--border-strong);}

/* Week nav + summary */
.week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.week-nav-btns{display:flex; gap:8px;}
.icon-btn{width:32px; height:32px; border-radius:9px; background:var(--ink-2); border:1px solid var(--border-strong); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.9rem;}
.icon-btn:hover{background:var(--ink-3);}
.icon-btn:disabled{opacity:.35; cursor:default;}
.week-label{font-weight:700; font-size:0.95rem;}

.table-wrap{overflow-x:auto; background:var(--ink-2); border:1px solid var(--border); border-radius:var(--radius); padding:6px;}
table{width:100%; border-collapse:collapse; min-width:640px;}
th,td{padding:12px 14px; text-align:left; font-size:0.84rem;}
thead th{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); border-bottom:1px solid var(--border); font-weight:700;}
tbody tr:not(:last-child) td{border-bottom:1px solid var(--border);}
tbody tr.today{background:rgba(81,106,246,0.06);}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
td.total{font-weight:700;}
td.overtime-val{color:var(--amber); font-weight:700;}
tfoot td{border-top:1px solid var(--border-strong); font-weight:700; padding-top:14px;}

.pill{display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:2px 8px; border-radius:999px; margin-left:6px;}
.pill-ot{background:rgba(246,200,95,0.15); color:var(--amber);}

/* Activity log */
.log-row{display:grid; grid-template-columns:110px 1fr 100px 100px 90px 32px; gap:10px; align-items:center; padding:11px 14px; font-size:0.84rem; border-bottom:1px solid var(--border);}
.log-row:last-child{border-bottom:none;}
.log-row.header-row-log{color:var(--text-faint); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
.log-open{color:var(--green); font-weight:700;}
.del-btn{background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:1rem; justify-self:end;}
.del-btn:hover{color:var(--red);}
.empty-note{padding:24px; text-align:center; color:var(--text-faint); font-size:0.86rem;}

footer{padding:30px 24px 50px; text-align:center;}
footer p{font-size:0.76rem; color:var(--text-faint); max-width:560px; margin:0 auto; line-height:1.5;}

@media (max-width:640px){
  .log-row{grid-template-columns:1fr; gap:2px; padding:12px 14px;}
  .log-row span::before{content:attr(data-label) ": "; color:var(--text-faint); font-weight:600;}
  .log-row.header-row-log{display:none;}
  .del-btn{justify-self:start; margin-top:4px;}
}
</style>
</head>
<body>

<div class="halo" aria-hidden="true"></div>

<header>
  <div class="header-row">
    <div class="brand">fomo <span class="tag">/ clock</span></div>
    <div class="clock-now" id="clock-now"></div>
  </div>
</header>

<div class="container">

  <section>
    <p class="section-title">clock in / clock out</p>
    <div class="people-grid" id="people-grid"></div>
  </section>

  <section>
    <div class="week-nav">
      <p class="section-title" style="margin:0;">weekly summary</p>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="week-label" id="week-label"></span>
        <div class="week-nav-btns">
          <button class="icon-btn" id="week-prev" aria-label="Previous week">←</button>
          <button class="icon-btn" id="week-next" aria-label="Next week">→</button>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table id="week-table">
        <thead><tr><th>intern</th><th class="num">mon</th><th class="num">tue</th><th class="num">wed</th><th class="num">thu</th><th class="num">fri</th><th class="num">sat</th><th class="num">sun</th><th class="num">total</th><th class="num">overtime</th></tr></thead>
        <tbody id="week-body"></tbody>
      </table>
    </div>
  </section>

  <section>
    <p class="section-title">activity log</p>
    <div class="table-wrap" style="padding:0;">
      <div class="log-row header-row-log">
        <span>date</span><span>intern</span><span>clock in</span><span>clock out</span><span>hours</span><span></span>
      </div>
      <div id="log-list"></div>
    </div>
  </section>

</div>

<script>
const PEOPLE = [
  { name: 'Jesse', color: '#2FB893' },
  { name: 'Milo', color: '#F2994A' },
  { name: 'Luci', color: '#9B59D0' },
  { name: 'Bijan', color: '#E0555F' },
];
const STORAGE_KEY = 'fomo_timeclock_v1';
const WEEK_HOURS_LIMIT = 40;

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}
let entries = loadEntries();
let weekOffset = 0;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function openEntryFor(name) {
  return entries.find((e) => e.name === name && e.clockOut === null) || null;
}

function clockIn(name) {
  if (openEntryFor(name)) return;
  entries.push({ id: uid(), name, clockIn: Date.now(), clockOut: null });
  saveEntries(entries);
  render();
}
function clockOut(name) {
  const e = openEntryFor(name);
  if (!e) return;
  e.clockOut = Date.now();
  saveEntries(entries);
  render();
}
function deleteEntry(id) {
  entries = entries.filter((e) => e.id !== id);
  saveEntries(entries);
  render();
}

function dayKey(date) {
  const d = new Date(date);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

// Splits one [start,end) interval into per-calendar-day millisecond chunks.
function splitByDay(start, end) {
  const chunks = [];
  let cursor = start;
  while (cursor < end) {
    const dayStart = startOfDay(cursor);
    const nextDayStart = dayStart + 86400000;
    const chunkEnd = Math.min(end, nextDayStart);
    chunks.push({ day: dayKey(cursor), ms: chunkEnd - cursor });
    cursor = chunkEnd;
  }
  return chunks;
}

function dailyHoursByPerson(nowTs) {
  // { name: { 'YYYY-MM-DD': hours } }
  const map = {};
  PEOPLE.forEach((p) => { map[p.name] = {}; });
  entries.forEach((e) => {
    const end = e.clockOut === null ? nowTs : e.clockOut;
    if (end <= e.clockIn) return;
    splitByDay(e.clockIn, end).forEach((chunk) => {
      const bucket = map[e.name];
      if (!bucket) return;
      bucket[chunk.day] = (bucket[chunk.day] || 0) + chunk.ms / 3600000;
    });
  });
  return map;
}

function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay(); // 0 = Sun
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function weekDates(offset) {
  const base = new Date();
  base.setDate(base.getDate() + offset * 7);
  const monday = mondayOf(base);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}
function fmtShortDate(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function fmtHours(h) { return h.toFixed(1) + 'h'; }
function fmtDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return [h, m, s].map((n) => String(n).padStart(2, '0')).join(':');
}
function fmtClock(ts) {
  return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function initials(name) { return name.slice(0, 1).toUpperCase(); }

function renderPeople(nowTs) {
  const grid = document.getElementById('people-grid');
  const daily = dailyHoursByPerson(nowTs);
  const todayKey = dayKey(nowTs);
  const days = weekDates(0).map((d) => dayKey(d));

  grid.innerHTML = PEOPLE.map((p) => {
    const open = openEntryFor(p.name);
    const isActive = !!open;
    const todayHours = daily[p.name][todayKey] || 0;
    const weekHours = days.reduce((sum, k) => sum + (daily[p.name][k] || 0), 0);
    const overtime = Math.max(0, weekHours - WEEK_HOURS_LIMIT);
    const sessionMs = isActive ? nowTs - open.clockIn : 0;

    return `
      <div class="person-card ${isActive ? 'active' : ''}">
        <div class="person-head">
          <div class="avatar" style="background:${p.color}">${initials(p.name)}</div>
          <div>
            <div class="person-name">${p.name}</div>
            <div class="status-row"><span class="status-dot"></span>${isActive ? 'clocked in · ' + fmtClock(open.clockIn) : 'clocked out'}</div>
          </div>
        </div>
        <div class="session-timer">${isActive ? fmtDuration(sessionMs) : '—:—:—'}</div>
        <div class="stat-row">
          <div class="stat"><span class="num">${fmtHours(todayHours)}</span><span class="lbl">today</span></div>
          <div class="stat ${overtime > 0 ? 'overtime' : ''}"><span class="num">${fmtHours(weekHours)}</span><span class="lbl">this week</span></div>
          ${overtime > 0 ? `<div class="stat overtime"><span class="num">${fmtHours(overtime)}</span><span class="lbl">overtime</span></div>` : ''}
        </div>
        <button class="btn ${isActive ? 'btn-out' : 'btn-in'}" data-action="${isActive ? 'out' : 'in'}" data-name="${p.name}">
          ${isActive ? 'Clock Out' : 'Clock In'}
        </button>
      </div>`;
  }).join('');

  grid.querySelectorAll('button[data-action]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.action === 'in') clockIn(btn.dataset.name);
      else clockOut(btn.dataset.name);
    });
  });
}

function renderWeekTable(nowTs) {
  const days = weekDates(weekOffset);
  const daily = dailyHoursByPerson(nowTs);
  const label = fmtShortDate(days[0]) + ' – ' + fmtShortDate(days[6]) + (weekOffset === 0 ? ' (this week)' : '');
  document.getElementById('week-label').textContent = label;
  document.getElementById('week-next').disabled = weekOffset >= 0;

  const todayKey = dayKey(nowTs);
  const body = PEOPLE.map((p) => {
    const cells = days.map((d) => {
      const k = dayKey(d);
      const h = daily[p.name][k] || 0;
      const isToday = k === todayKey;
      return `<td class="num${isToday ? '' : ''}">${h > 0 ? fmtHours(h) : '–'}</td>`;
    }).join('');
    const total = days.reduce((sum, d) => sum + (daily[p.name][dayKey(d)] || 0), 0);
    const overtime = Math.max(0, total - WEEK_HOURS_LIMIT);
    return `<tr>
      <td><strong>${p.name}</strong></td>
      ${cells}
      <td class="num total">${fmtHours(total)}</td>
      <td class="num ${overtime > 0 ? 'overtime-val' : ''}">${overtime > 0 ? fmtHours(overtime) : '–'}</td>
    </tr>`;
  }).join('');
  document.getElementById('week-body').innerHTML = body;
}

function renderLog() {
  const list = document.getElementById('log-list');
  const sorted = [...entries].sort((a, b) => b.clockIn - a.clockIn);
  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-note">No clock-ins yet — hit "Clock In" above to get started.</div>';
    return;
  }
  list.innerHTML = sorted.map((e) => {
    const hours = e.clockOut ? (e.clockOut - e.clockIn) / 3600000 : (Date.now() - e.clockIn) / 3600000;
    return `<div class="log-row">
      <span data-label="Date">${new Date(e.clockIn).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
      <span data-label="Intern"><strong>${e.name}</strong></span>
      <span data-label="In">${fmtClock(e.clockIn)}</span>
      <span data-label="Out">${e.clockOut ? fmtClock(e.clockOut) : '<span class="log-open">active</span>'}</span>
      <span data-label="Hours">${fmtHours(hours)}</span>
      <button class="del-btn" data-id="${e.id}" title="Delete entry" aria-label="Delete entry">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.del-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (confirm("Delete this entry? This can't be undone.")) deleteEntry(btn.dataset.id);
    });
  });
}

function renderClockNow() {
  document.getElementById('clock-now').textContent = new Date().toLocaleString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit'
  });
}

function render() {
  const now = Date.now();
  renderClockNow();
  renderPeople(now);
  renderWeekTable(now);
  renderLog();
}

document.getElementById('week-prev').addEventListener('click', () => { weekOffset -= 1; renderWeekTable(Date.now()); });
document.getElementById('week-next').addEventListener('click', () => { if (weekOffset < 0) { weekOffset += 1; renderWeekTable(Date.now()); } });

render();
setInterval(render, 1000);
</script>
</body>
</html>
