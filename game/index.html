<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gappy · the daily leap</title>
<meta name="description" content="Seven gaps a day. Two things, one chasm — guess how far apart they really are, build the bridge, make the leap. Same seven for everyone, new set at midnight UTC.">
<meta name="theme-color" content="#120B20">
<meta property="og:title" content="Gappy · the daily leap">
<meta property="og:description" content="Seven gaps a day. How far apart are they really?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23120B20'/%3E%3Crect x='1' y='9' width='4' height='6' fill='%234A2E68'/%3E%3Crect x='11' y='7' width='4' height='8' fill='%234A2E68'/%3E%3Crect x='2' y='6' width='2' height='2' fill='%23FF4D9D'/%3E%3Crect x='5' y='8' width='2' height='1' fill='%23FFC94D'/%3E%3Crect x='8' y='8' width='2' height='1' fill='%23FFC94D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* teal night over sandstone */
  --sky-1:#07171C; --sky-2:#0E2F38; --sky-3:#2A5A5C; --sky-4:#B4763C; --sky-5:#E8A64C;
  --rock-far:#2A4A4E; --rock-mid:#3A2A22; --rock-near:#241812; --rock-lip:#C98A47;
  --ink:#06141A; --panel:#0C2129; --panel-2:#113039; --line:#1E4B55; --line-hi:#2E6E78;
  --text:#F2F7F5; --dim:#8FB3B0; --faint:#5C8A88;
  --pink:#19E59B; --pink-dk:#0E8F62;
  --cyan:#5FD9E8; --mint:#19E59B; --gold:#F5C542; --red:#E8604A; --amber:#E89B3C;
  --disp:'Press Start 2P', monospace;
  --ui:'Silkscreen', monospace;
  --body:'VT323', monospace;
  --px:4px;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%; background:var(--ink);}
body{margin:0; background:var(--ink); color:var(--text); font-family:var(--ui);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:none; image-rendering:pixelated;
  overscroll-behavior-y:none; min-height:100dvh;}
button,input{font-family:var(--ui); font-size:inherit; color:inherit;}
button{cursor:pointer; border:0; background:none;}
svg{display:block; shape-rendering:crispEdges;}
::selection{background:var(--pink); color:#fff;}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

/* ====================================================== pixel chrome ===== */
/* hard-edged box with a chunky offset shadow — no blur anywhere */
.box{background:rgba(12,33,41,.93); border:3px solid var(--line); box-shadow:0 4px 0 0 rgba(6,20,26,.85);}
.box-hi{border-color:var(--line-hi);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  font-family:var(--ui); font-weight:700; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
  padding:15px 18px; border:3px solid var(--ink); background:var(--panel-2); color:var(--text);
  box-shadow:0 5px 0 0 var(--ink); transition:transform .06s steps(2), box-shadow .06s steps(2);}
.btn:active{transform:translateY(5px); box-shadow:0 0 0 0 var(--ink);}
.btn:disabled{opacity:.4; cursor:default; transform:none; box-shadow:0 5px 0 0 var(--ink);}
.btn-go{background:var(--pink); color:#2A0A1A; border-color:#2A0A1A; box-shadow:0 5px 0 0 #2A0A1A;}
.btn-go:active{box-shadow:0 0 0 0 #2A0A1A;}
.btn-gold{background:var(--gold); color:#2A1E05; border-color:#2A1E05; box-shadow:0 5px 0 0 #2A1E05;}
.btn-gold:active{box-shadow:0 0 0 0 #2A1E05;}
.btn-ghost{background:rgba(255,255,255,.05); border-color:var(--line);
  box-shadow:0 5px 0 0 var(--ink); color:var(--dim);}
.btn-ghost:hover{color:var(--text); border-color:var(--line-hi);}
.btn-sm{padding:9px 12px; font-size:11px; width:auto; box-shadow:0 3px 0 0 var(--ink);}
.btn-sm:active{transform:translateY(3px);}

.lbl{font-family:var(--ui); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);}
.lbl-hi{color:var(--cyan);}
.p{font-family:var(--body); font-size:19px; line-height:1.3; color:var(--dim);}
.p b{color:var(--text); font-weight:400;}

/* ====================================================== the canyon ======= */
#scene{position:fixed; inset:0; z-index:0; overflow:hidden; background:linear-gradient(
  180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 62%, var(--sky-4) 80%, var(--sky-5) 100%);
  transition:background 1.1s steps(6);}
#scene .band{position:absolute; left:0; right:0; bottom:0;}
#scene .stars{position:absolute; inset:0 0 40% 0;}
#scene .sun{position:absolute; left:50%; bottom:28%; width:120px; height:120px; margin-left:-60px;
  background:var(--sky-5); opacity:.5;}
#scene .far{bottom:46%; height:20%;}
#scene .mid{bottom:36%; height:18%;}
/* the playable canyon IS the page background, not a panel inside it */
#stage{position:absolute; left:0; right:0; bottom:0; height:40vh; width:100%; display:block;}
@media (max-width:420px){ #stage{height:36vh;} }
@media (max-height:720px){ #stage{height:28vh;} }
#scene .band{display:block; width:100%; height:100%;}
#grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.055;
  background-image:repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px);}
#vig{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(130% 95% at 50% 42%, transparent 48%, rgba(10,5,18,.72) 100%);}

/* ====================================================== layout =========== */
.app{position:relative; z-index:2; min-height:100dvh; display:flex; flex-direction:column;
  max-width:560px; margin:0 auto; padding:0 14px calc(14px + env(safe-area-inset-bottom));}
@media (min-width:600px){ .app{padding:0 20px 20px;} }

/* --- top bar --- */
.top{display:flex; align-items:center; gap:6px; padding:12px 0 10px;}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--text);}
.brand .mk{width:30px; height:30px; flex:0 0 30px;}
.brand b{font-family:var(--disp); font-size:12px; letter-spacing:0;
  color:#F6E3C4; text-shadow:0 2px 0 #6E4722;}
.top .sp{flex:1;}
.chip{display:inline-flex; align-items:center; gap:5px; padding:5px 7px; white-space:nowrap; flex:0 0 auto; background:rgba(18,11,32,.72);
  border:2px solid var(--line); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);}
.chip b{color:var(--gold); font-weight:700;}
.chip.fire b{color:var(--amber);}
.icb{width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center;
  background:rgba(18,11,32,.72); border:2px solid var(--line); color:var(--dim);}
.icb:hover{border-color:var(--line-hi); color:var(--text);}
.icb svg{width:16px; height:16px;}
.icb.off{color:var(--faint);}

main{flex:1; display:flex; flex-direction:column; min-height:0;}
.rope{height:7px; margin:2px 0 10px; background-image:
  linear-gradient(90deg, var(--rock-lip) 0 5px, transparent 5px 10px);
  background-size:10px 3px; background-repeat:repeat-x; background-position:0 2px; opacity:.5;}
/* four icons, two chips and a wordmark do not fit a small phone; the sparks
   count is the one that can wait for the stats sheet */
@media (max-width:430px){ #chip-sparks{display:none;} }
@media (max-width:340px){ .brand b{display:none;} }

/* ====================================================== title screen ===== */
.title{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; padding:10px 0 16px;}
.title-art{text-align:center; position:relative;}
.title-art h1{font-family:var(--disp); font-size:clamp(30px,10.5vw,54px); line-height:1; margin:0;
  letter-spacing:0; color:#F6E3C4;
  text-shadow:0 3px 0 var(--rock-lip), 0 6px 0 #6E4722, 0 9px 0 var(--ink), 4px 9px 0 var(--ink);}
.title-art h1 span{color:var(--mint); text-shadow:0 3px 0 #0E8F62, 0 6px 0 #075C3F, 0 9px 0 var(--ink);}
.title-art .sub{font-family:var(--ui); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gold); margin-top:12px;}
.title-art .day{font-family:var(--ui); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); margin-top:6px;}
.title-art .hero{width:100%; max-width:380px; margin:14px auto 2px; display:block;}

.modes{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.mode{padding:11px 8px; border:3px solid var(--ink); background:rgba(35,20,57,.82); text-align:center;
  box-shadow:0 4px 0 0 var(--ink);}
.mode b{display:block; font-family:var(--ui); font-weight:700; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase;}
.mode span{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.08em; color:var(--faint); margin-top:4px;}
.mode.on{background:var(--cyan); color:#06282A;}
.mode.on span{color:#0A3A3C;}
.mode:disabled{opacity:.45;}

.howto{display:grid; gap:8px;}
.howto div{display:flex; gap:10px; align-items:flex-start; font-family:var(--body); font-size:18px;
  line-height:1.25; color:var(--dim);}
.howto i{flex:0 0 20px; height:20px; background:var(--pink); color:#2A0A1A; font-family:var(--ui);
  font-size:10px; font-weight:700; display:grid; place-items:center; font-style:normal; margin-top:2px;}
.howto b{color:var(--text); font-weight:400;}

/* ====================================================== play ============= */
.play{flex:1; display:flex; flex-direction:column; min-height:0; padding-bottom:calc(40vh - 46px);}
@media (max-width:420px){ .play{padding-bottom:calc(36vh - 40px);} }
@media (max-height:720px){ .play{padding-bottom:calc(28vh - 34px);} .qcard{padding:10px 11px 11px;} .verdict{margin:7px 0;} }
.hud{display:flex; align-items:center; gap:8px; padding:2px 0 9px;}
.hud .lbl{font-size:10px;}
.hud .sp{flex:1;}
.pips{display:flex; gap:3px;}
.pips i{width:13px; height:13px; border:2px solid var(--line); background:rgba(18,11,32,.6);}
.pips i.g{background:var(--mint); border-color:var(--mint);}
.pips i.y{background:var(--gold); border-color:var(--gold);}
.pips i.o{background:var(--amber); border-color:var(--amber);}
.pips i.r{background:var(--red); border-color:var(--red);}
.pips i.now{border-color:var(--cyan); animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{background:var(--cyan);}}

.qcard{padding:13px 13px 14px; margin-bottom:10px;}
.qcard .cat{display:flex; align-items:center; gap:7px; margin-bottom:8px;}
.qcard .cat i{width:9px; height:9px; background:var(--cyan); font-style:normal;}
.qcard h2{font-family:var(--body); font-size:clamp(23px,6.4vw,30px); line-height:1.08; margin:0;
  color:var(--text); font-weight:400; letter-spacing:.01em;}

/* labels that sit on the cliff tops, out in the scene */
.cliffnotes{position:fixed; left:0; right:0; z-index:3; pointer-events:none;
  max-width:560px; margin:0 auto; padding:0 14px;}
@media (min-width:600px){ .cliffnotes{padding:0 20px;} }
.cn{position:absolute; max-width:40%; padding:5px 7px; background:rgba(6,20,26,.86);
  border:2px solid var(--line-hi); border-bottom:3px solid var(--rock-lip);}
.cn b{display:block; font-family:var(--ui); font-weight:700; font-size:9px; letter-spacing:.05em;
  line-height:1.25; color:var(--text);}
.cn em{display:block; font-style:normal; font-family:var(--ui); font-size:9px; color:var(--gold); margin-top:3px;}
.cn.a{left:14px;} .cn.b{right:14px; text-align:right;}
@media (min-width:600px){ .cn.a{left:20px;} .cn.b{right:20px;} }
.axis{display:flex; justify-content:space-between; font-family:var(--ui); font-size:9px;
  letter-spacing:.08em; color:var(--faint); padding:4px 1px 0;}

/* the dial */
.dial{margin-top:auto; padding-top:8px;}
.readout{text-align:center; position:relative;}
.readout .v{font-family:var(--disp); font-size:clamp(30px,10vw,46px); line-height:1; color:var(--gold);
  text-shadow:0 4px 0 var(--ink); letter-spacing:0;}
.readout .u{font-family:var(--disp); font-size:.52em; color:var(--amber);}
.readout .hint{font-family:var(--ui); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin-top:9px;}
.track{position:relative; margin:11px 0 3px; padding:12px 0;}
.track input{-webkit-appearance:none; appearance:none; width:100%; height:16px; background:none; display:block; margin:0;}
.track input::-webkit-slider-runnable-track{height:16px; border:3px solid var(--ink);
  background:linear-gradient(90deg, var(--pink) var(--p,0%), rgba(18,11,32,.72) var(--p,0%));}
.track input::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:34px; margin-top:-12px;
  background:var(--gold); border:3px solid var(--ink); box-shadow:inset 0 -5px 0 0 rgba(0,0,0,.22);}
.track input::-moz-range-track{height:16px; border:3px solid var(--ink); background:rgba(18,11,32,.72);}
.track input::-moz-range-progress{height:16px; background:var(--pink);}
.track input::-moz-range-thumb{width:22px; height:30px; border-radius:0; background:var(--gold); border:3px solid var(--ink);}
.steppers{display:flex; gap:7px; justify-content:center; margin:9px 0 11px;}
.steppers button{width:54px; height:34px; border:3px solid var(--ink); background:var(--panel-2);
  font-family:var(--disp); font-size:11px; color:var(--dim); box-shadow:0 4px 0 0 var(--ink);}
.steppers button:hover{color:var(--text);}
.steppers button:active{transform:translateY(4px); box-shadow:none;}

/* ====================================================== reveal =========== */
.reveal{animation:pop .22s steps(3);}
@keyframes pop{from{transform:translateY(8px); opacity:0;}}
.verdict{display:flex; align-items:center; gap:9px; padding:10px 12px; margin:10px 0;
  border:3px solid var(--ink);}
.verdict .vl{font-family:var(--disp); font-size:13px; letter-spacing:0;}
.verdict .vp{margin-left:auto; font-family:var(--disp); font-size:17px;}
.verdict.b0{background:var(--mint); color:#06301E;} .verdict.b0 .vp{color:#06301E;}
.verdict.b1{background:var(--gold); color:#2E2205;} .verdict.b1 .vp{color:#2E2205;}
.verdict.b2{background:var(--amber); color:#331B05;} .verdict.b2 .vp{color:#331B05;}
.verdict.b3{background:var(--red);  color:#330A10;} .verdict.b3 .vp{color:#330A10;}

.ledger{padding:11px 12px; display:grid; gap:7px; margin-bottom:9px;}
.ledger div{display:flex; gap:10px; align-items:baseline; font-family:var(--ui); font-size:11px;}
.ledger .k{color:var(--dim); flex:1; min-width:0;}
.ledger .v{color:var(--text); white-space:nowrap; letter-spacing:.06em;}
.ledger .hl .v{color:var(--gold); font-weight:700; letter-spacing:.1em;}
.cite{font-family:var(--body); font-size:16px; line-height:1.3; color:var(--faint); margin:0 0 11px;}

/* ====================================================== results ========== */
.done{flex:1; display:flex; flex-direction:column; justify-content:center; gap:13px; padding:8px 0 10px;}
.bigscore{text-align:center;}
.bigscore .n{font-family:var(--disp); font-size:clamp(34px,12vw,58px); line-height:1; color:var(--gold);
  text-shadow:0 5px 0 var(--ink), 3px 0 rgba(255,158,77,.5);}
.bigscore .of{font-family:var(--disp); font-size:.4em; color:var(--faint); display:inline-block; margin-left:4px;}
.rank{display:inline-flex; align-items:center; gap:8px; margin-top:11px; padding:7px 13px;
  border:3px solid var(--ink); background:var(--pink); color:#2A0A1A;
  font-family:var(--disp); font-size:11px; box-shadow:0 4px 0 0 var(--ink);}
.rank .rs{width:16px; height:16px;}

.log{padding:11px 12px;}
.log .lbl{margin-bottom:9px; display:block;}
.log .r{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
.log .r:last-child{margin-bottom:0;}
.log .r .i{font-family:var(--ui); font-size:9px; color:var(--faint); width:10px;}
.log .r .bar{flex:1; height:12px; background:rgba(18,11,32,.6); border:2px solid var(--line); position:relative;}
.log .r .bar i{position:absolute; left:0; top:0; bottom:0; display:block;
  animation:grow .5s steps(8) backwards;}
@keyframes grow{from{width:0 !important;}}
.log .r .s{font-family:var(--ui); font-size:10px; width:34px; text-align:right; color:var(--dim);}

.spread{padding:11px 12px;}
.spread .cols{display:flex; align-items:flex-end; gap:4px; height:62px; margin:8px 0 5px;}
.spread .cols div{flex:1; background:var(--line); border:2px solid var(--line-hi); min-height:3px; position:relative;}
.spread .cols div.me{background:var(--pink); border-color:var(--pink);}
.spread .cols div em{position:absolute; left:50%; top:-15px; transform:translateX(-50%);
  font-family:var(--ui); font-size:9px; font-style:normal; color:var(--pink); white-space:nowrap;}
.spread .xs{display:flex; gap:4px; font-family:var(--ui); font-size:8px; color:var(--faint);}
.spread .xs span{flex:1; text-align:center;}

.earn{display:flex; align-items:center; gap:10px; padding:10px 12px;}
.earn .sp{flex:1;}
.earn b{font-family:var(--disp); font-size:14px; color:var(--gold);}
.clock{text-align:center; font-family:var(--ui); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);}
.clock b{color:var(--cyan);}
.stack{display:grid; gap:8px;}

/* ====================================================== sheets =========== */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(8,4,16,.82); display:flex;
  align-items:flex-end; justify-content:center; animation:fin .15s steps(2);}
@media (min-width:600px){ .scrim{align-items:center;} }
@keyframes fin{from{opacity:0;}}
.sheet{width:100%; max-width:560px; max-height:90dvh; overflow-y:auto; background:var(--panel);
  border:3px solid var(--line-hi); border-bottom:0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
@media (min-width:600px){ .sheet{border-bottom:3px solid var(--line-hi); margin:0 16px; box-shadow:0 6px 0 0 var(--ink);} }
.sheet-hd{display:flex; align-items:center; gap:10px; margin-bottom:13px;}
.sheet-hd h3{font-family:var(--disp); font-size:14px; margin:0;}
.sheet-hd .sp{flex:1;}
.kv{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:14px;}
.kv div{padding:9px 10px; border:2px solid var(--line); background:rgba(18,11,32,.4);}
.kv b{display:block; font-family:var(--disp); font-size:15px; color:var(--gold);}
.kv span{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); margin-top:5px;}
.trophies{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:7px;}
.tr{padding:9px 6px; text-align:center; border:2px solid var(--line); background:rgba(18,11,32,.4);}
.tr svg{width:30px; height:30px; margin:0 auto 6px; opacity:.22; filter:grayscale(1);}
.tr b{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.06em; color:var(--faint); line-height:1.3;}
.tr small{display:block; font-family:var(--body); font-size:14px; color:var(--faint); margin-top:3px; line-height:1.15;}
.tr.got{border-color:var(--gold); background:rgba(255,201,77,.1);}
.tr.got svg{opacity:1; filter:none;}
.tr.got b{color:var(--gold);}
.tr.got small{color:var(--dim);}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px); z-index:70;
  background:var(--gold); color:#2A1E05; border:3px solid var(--ink); box-shadow:0 4px 0 0 var(--ink);
  padding:10px 16px; font-family:var(--ui); font-weight:700; font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; opacity:0; pointer-events:none; transition:all .16s steps(3);}
.toast.on{opacity:1; transform:translateX(-50%);}

.pf{position:fixed; z-index:65; pointer-events:none; font-family:var(--disp); font-size:15px;
  color:var(--gold); text-shadow:0 3px 0 var(--ink); animation:fly 1s steps(10) forwards;}
@keyframes fly{to{transform:translateY(-62px); opacity:0;}}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div id="scene">
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>
  <canvas class="band far" id="band-far" aria-hidden="true"></canvas>
  <canvas class="band mid" id="band-mid" aria-hidden="true"></canvas>
  <canvas id="stage" aria-hidden="true"></canvas>
</div>
<div id="grain"></div><div id="vig"></div>

<div class="app">
  <div class="top">
    <a class="brand" href="./" aria-label="Gappy home">
      <svg class="mk" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="9" width="4" height="7" fill="#5A3579"/><rect x="11" y="7" width="4" height="9" fill="#5A3579"/>

<script>
/* ============================================================================
   Gappy — the daily leap.
   Two things on opposite cliffs. Guess how wide the gap is, build the bridge,
   jump. Seven a day, same seven for everyone, new set at midnight UTC.
   ========================================================================== */
(function () {
'use strict';

const BANK = window.GAPPY_BANK || [];
const $ = (id) => document.getElementById(id);
const PER_DAY = 7, MAX_Q = 1000, STORE = 'gappy_v1';
const EPOCH = Date.UTC(2026, 0, 1);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const comma = (n) => Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ------------------------------------------------------------ determinism */
const dayIndex = (t) => {
  const d = new Date(t === undefined ? Date.now() : t);
  return Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - EPOCH) / 86400000);
};
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(n, seed) {
  const a = Array.from({ length: n }, (_, i) => i), rnd = mulberry32(seed);
  for (let i = a.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickDay(day) {
  const slots = Math.floor(BANK.length / PER_DAY);
  if (slots < 1) return BANK.slice(0, PER_DAY);
  const cycle = Math.floor(day / slots), slot = ((day % slots) + slots) % slots;
  return shuffled(BANK.length, 0x9E3779B9 ^ cycle).slice(slot * PER_DAY, slot * PER_DAY + PER_DAY).map((i) => BANK[i]);
}
const pickRandom = (n) => shuffled(BANK.length, (Math.random() * 1e9) | 0).slice(0, n).map((i) => BANK[i]);
const answerOf = (q) => q.type === 'percent' ? (q.a.value / q.b.value) * 100 : q.a.value / q.b.value;

/* --------------------------------------------------------------- scoring */
function scoreGuess(type, guess, actual) {
  const e = type === 'percent'
    ? Math.abs(guess - actual) / 20
    : Math.log(Math.max(guess / actual, actual / guess)) / Math.log(4);
  return Math.max(0, Math.round(MAX_Q * (1 - Math.pow(clamp(e, 0, 1), 1.35))));
}
/* Seven tiers rather than four. Each one has its own name, its own colour
   and its own leap: the rarer the guess, the longer the hang time and the
   higher the arc, so a bullseye is something you watch rather than read. */
const TIERS = [
  { min:1000, n:'THE GAPPY',      c:'#19E59B', sq:'🟩', dur:1850, apex:1.00, slow:true  },
  { min:950,  n:'DEAD RECKONING', c:'#5FD9E8', sq:'🟩', dur:1500, apex:0.84, slow:false },
  { min:850,  n:'HAIRLINE',       c:'#8FE870', sq:'🟩', dur:1250, apex:0.70, slow:false },
  { min:700,  n:'CLEAN CROSSING', c:'#F5C542', sq:'🟨', dur:1020, apex:0.56, slow:false },
  { min:450,  n:'SCRAMBLED OVER', c:'#E89B3C', sq:'🟧', dur:820,  apex:0.40, slow:false },
  { min:150,  n:'CLIPPED THE EDGE',c:'#E8734A',sq:'🟧', dur:640,  apex:0.26, slow:false },
  { min:0,    n:'INTO THE VOID',  c:'#E8604A', sq:'⬛', dur:470,  apex:0.14, slow:false },
];
const tierOf = (s) => TIERS.find((t) => s >= t.min) || TIERS[TIERS.length - 1];
const tierIx = (s) => TIERS.indexOf(tierOf(s));
const band = (s) => s >= 900 ? 0 : s >= 700 ? 1 : s >= 400 ? 2 : 3;   // kept for the pips
const RANKS = [
  [6500, 'CANYON KING'], [5600, 'BRIDGE MASTER'], [4600, 'SURE FOOTED'],
  [3400, 'STEADY HAND'], [2200, 'WOBBLY'], [1000, 'LOOSE GRAVEL'], [0, 'SPLAT'],
];
const rankOf = (t) => (RANKS.find(([m]) => t >= m) || RANKS[RANKS.length - 1])[1];

/* ----------------------------------------------------------- dial mapping */
const toValue = (type, pos) => type === 'percent' ? pos / 10 : Math.pow(10, (pos / 1000) * 3);
const toPos = (type, v) => type === 'percent' ? v * 10 : (Math.log10(clamp(v, 1, 1000)) / 3) * 1000;
const frac = (type, v) => type === 'percent' ? clamp(v / 100, 0, 1) : clamp(Math.log10(clamp(v, 1, 1000)) / 3, 0, 1);
const fmtV = (type, v) => type === 'percent' ? (Math.round(v * 10) / 10).toFixed(1)
  : v >= 100 ? comma(v) : v.toFixed(1);
function fmtFig(n) {
  if (n >= 1e9) return (n / 1e9).toPrecision(3).replace(/\.?0+$/, '') + 'bn';
  if (n >= 1e6) return (n / 1e6).toPrecision(3).replace(/\.?0+$/, '') + 'm';
  if (n >= 1000) return comma(n);
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
}

/* ------------------------------------------------------------------ store */
const BLANK = { days:{}, streak:0, best:0, played:0, sum:0, last:null, dist:[0,0,0,0,0,0,0],
                sparks:0, cats:[], trophies:[], sound:true, perfects:0 };
function load() {
  try { return Object.assign({}, BLANK, JSON.parse(localStorage.getItem(STORE) || '{}')); }
  catch (e) { return Object.assign({}, BLANK); }
}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
let S = load();

/* ------------------------------------------------------------------ sound
   A handful of square-wave blips. No files, nothing to download, and it only
   ever starts after a real tap because that is how WebAudio works. */
const SFX = (() => {
  let ctx = null;
  const on = () => S.sound !== false;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function blip(freq, dur, type, vol, slideTo) {
    if (!on()) return;
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.06 : vol, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  return {
    tick: () => blip(520, 0.02, 'square', 0.018),
    leap: () => blip(260, 0.26, 'square', 0.05, 760),
    land: (b) => {
      const f = [660, 560, 420, 180][b];
      blip(f, 0.1, 'square', 0.07);
      setTimeout(() => blip(b === 3 ? 120 : f * 1.5, 0.16, b === 3 ? 'sawtooth' : 'square', 0.055), 95);
    },
    win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.16, 'square', 0.06), i * 95)),
    pip: () => blip(880, 0.05, 'square', 0.04),
    unlock: () => [784, 988, 1318].forEach((f, i) => setTimeout(() => blip(f, 0.2, 'triangle', 0.08), i * 120)),
  };
})();

/* ---------------------------------------------------------------- biomes */
const BIOMES = {
  Earth:    ['#07171C','#0E2F38','#2A5A5C','#B4763C','#E8A64C'],
  Space:    ['#03060F','#070D22','#101A38','#1D2A52','#30406E'],
  Nature:   ['#04150F','#0A2A1E','#154632','#3E7A4A','#7CB45C'],
  Body:     ['#16090E','#2E1220','#55243A','#9A4A52','#D4826A'],
  Built:    ['#060F18','#0D1F30','#17324A','#2E5272','#5C86A6'],
  Transport:['#07131A','#0F2838','#1B4356','#306C7E','#62A0AE'],
  Sport:    ['#0C130A','#192A14','#2B4A20','#4E7A2E','#8CB44A'],
  Distance: ['#050D18','#0B1C30','#143050','#28527A','#5086AE'],
  Time:     ['#160F06','#30200C','#523618','#8A5C24','#D29A46'],
  Scale:    ['#0A0C16','#141A30','#22304E','#3A4E76','#6880A8'],
  Everyday: ['#07171C','#0E2F38','#2A5A5C','#B4763C','#E8A64C'],
};
function setBiome(cat) {
  const b = BIOMES[cat] || BIOMES.Earth, r = document.documentElement.style;
  b.forEach((c, i) => r.setProperty('--sky-' + (i + 1), c));
  drawBands();
}

/* ------------------------------------------------------- pixel scenery */
const PXS = 4;   // one "pixel" is this many device-independent px
function mesa(cv, color, seed, heightFrac, roughness) {
  if (!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  x.fillStyle = color;
  const rnd = mulberry32(seed);
  const cols = Math.ceil(w / PXS);
  let y = h * (1 - heightFrac);
  for (let c = 0; c < cols; c++) {
    // plateaus: hold a level for a stretch, then step
    if (rnd() < roughness) y += (rnd() < 0.5 ? -1 : 1) * PXS * (1 + ((rnd() * 3) | 0));
    y = clamp(y, h * 0.06, h - PXS);
    const yy = Math.round(y / PXS) * PXS;
    x.fillRect(c * PXS, yy, PXS, h - yy);
  }
}
function drawBands() {
  const cs = getComputedStyle(document.documentElement);
  const pick = (n) => cs.getPropertyValue('--sky-' + n).trim();
  mesa($('band-far'), shade(pick(3), -0.34), 11, 0.70, 0.17);
  mesa($('band-mid'), shade(pick(2), -0.22), 29, 0.78, 0.24);
}
function shade(hex, amt) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#241536';
  const n = parseInt(m[1], 16);
  const f = (v) => clamp(Math.round(v + (amt < 0 ? v * amt : (255 - v) * amt)), 0, 255);
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
function starfield() {
  const el = $('stars'), rnd = mulberry32(7);
  let html = '';
  for (let i = 0; i < 70; i++) {
    const s = rnd() < 0.18 ? 3 : 2;
    html += `<i style="position:absolute;left:${(rnd()*100).toFixed(2)}%;top:${(rnd()*100).toFixed(2)}%;
      width:${s}px;height:${s}px;background:#fff;opacity:${(0.18+rnd()*0.5).toFixed(2)}"></i>`;
  }
  el.innerHTML = html;
}

/* ------------------------------------------------------------- sprites */
const PAL = { c:'#C9A227', s:'#E8B28A', d:'#2A1E18', j:'#FF4D9D', b:'#3A2A1A', f:'#4DE8E8', w:'#F7ECFF' };
const HERO = [
  '...ccccc...','..ccccccc..','.ccccccccc.','...sssss...','...dsssd...','...sssss...',
  '..jjjjjjj..','.jjjjjjjjj.','sjjjjjjjjjs','.jjjjjjjjj.','..jj...jj..','..jj...jj..',
  '..bb...bb..','.bbb...bbb.',
];
const HERO_JUMP = [
  '...ccccc...','..ccccccc..','.ccccccccc.','...sssss...','...dsssd...','...sssss...',
  's.jjjjjjj.s','sjjjjjjjjjs','.jjjjjjjjj.','..jjjjjjj..','..bb...bb..','...bb.bb...',
  '...........','...........',
];
const FLAG = [
  '.f.........','.fffffff...','.ffffffff..','.fffffff...','.f.........','.f.........',
  '.f.........','.f.........','.f.........','.f.........','.f.........','.f.........',
  '.f.........','.f.........',
];
function sprite(x, map, px, py, s, flip) {
  for (let r = 0; r < map.length; r++) for (let c = 0; c < map[r].length; c++) {
    const k = map[r][c]; if (k === '.') continue;
    x.fillStyle = PAL[k] || '#fff';
    const cc = flip ? (map[r].length - 1 - c) : c;
    x.fillRect(px + cc * s, py + r * s, s, s);
  }
}

/* ----------------------------------------------------------- the canyon
   Drawn straight onto the page background. The UI floats above it, so the
   leap happens out in the world rather than inside a little window. */
let anim = null, stageState = null;
function stageGeom() {
  const cv = $('stage');
  if (!cv) return { w:0, h:0 };
  const w = cv.clientWidth, h2 = cv.clientHeight;
  const P = 5;
  const gy = Math.round(h2 * 0.46 / P) * P;              // cliff-top line
  const pad = Math.max(26, Math.min(70, w * 0.09));
  const L = Math.round(pad / P) * P;
  const R = Math.round((w - pad) / P) * P;
  return { cv, w, h: h2, P, gy, L, R, xOf: (f) => Math.round((L + clamp(f,0,1) * (R - L)) / P) * P };
}
function drawStage(o) {
  const g = stageGeom(); if (!g.w || !g.h) return;
  stageState = o;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  g.cv.width = Math.round(g.w * dpr); g.cv.height = Math.round(g.h * dpr);
  const x = g.cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, g.w, g.h);
  const cs = getComputedStyle(document.documentElement);
  const lip  = cs.getPropertyValue('--rock-lip').trim() || '#C98A47';
  const body = cs.getPropertyValue('--rock-mid').trim() || '#3A2A22';
  const deep = cs.getPropertyValue('--rock-near').trim() || '#241812';
  const P = g.P;

  // the void: dark, with strata fading into it
  x.fillStyle = 'rgba(4,10,14,.92)';
  x.fillRect(0, g.gy, g.w, g.h - g.gy);
  x.fillStyle = 'rgba(255,255,255,.028)';
  for (let yy = g.gy + P * 2; yy < g.h; yy += P * 5) x.fillRect(0, yy, g.w, P);

  const cliff = (x0, x1) => {
    if (x1 <= x0) return;
    x.fillStyle = body; x.fillRect(x0, g.gy, x1 - x0, g.h - g.gy);
    x.fillStyle = lip;  x.fillRect(x0, g.gy, x1 - x0, P);
    x.fillStyle = deep;
    for (let yy = g.gy + P * 3; yy < g.h; yy += P * 4) x.fillRect(x0, yy, x1 - x0, P);
    // crumbling edge pixels so the lip is not a ruler-straight line
    const rnd = mulberry32(Math.round(x0) * 31 + 7);
    for (let i = 0; i < 7; i++) {
      const px = x0 + Math.round(rnd() * (x1 - x0) / P) * P;
      x.fillStyle = lip; x.fillRect(px, g.gy - P, P, P);
    }
  };
  cliff(0, g.L);                                   // the side you start on
  if (o.showFar) {
    const fx = g.xOf(o.actualF);
    cliff(fx, g.w);
    sprite(x, FLAG, fx + P * 3, g.gy - FLAG.length * P, P);
  }

  // the bridge you built: planks out over the void
  const bx = g.xOf(o.guessF);
  const plank = o.tierColour || '#2E6E78';
  for (let px = g.L; px < bx; px += P * 2) {
    x.fillStyle = plank; x.fillRect(px, g.gy - P, P, P);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(px, g.gy, P, P);
  }
  if (bx > g.L) { x.fillStyle = plank; x.fillRect(bx - P, g.gy - P * 3, P, P * 3); }

  // fog hiding the far side until you commit
  if (!o.showFar) {
    const fogX = bx + P * 2;
    const grd = x.createLinearGradient(fogX, 0, Math.min(g.w, fogX + 150), 0);
    const c1 = cs.getPropertyValue('--sky-2').trim() || '#0E2F38';
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(0.35, c1 + 'd9'); grd.addColorStop(1, c1);
    x.fillStyle = grd; x.fillRect(fogX, 0, g.w - fogX, g.h);
    x.fillStyle = cs.getPropertyValue('--faint').trim() || '#5C8A88';
    for (let i = 0; i < 24; i++) {
      const rnd = mulberry32(i * 97);
      x.fillRect(fogX + 20 + Math.round(rnd() * (g.w - fogX - 30) / P) * P,
                 Math.round(rnd() * g.h / P) * P, P, P);
    }
  }

  // the climber
  const hx = o.heroF === undefined ? g.L - HERO[0].length * P - P * 2 : g.xOf(o.heroF);
  const hy = g.gy - HERO.length * P - (o.hop || 0) + (o.fall || 0);
  sprite(x, o.jumping ? HERO_JUMP : HERO, hx, hy, P);
  // a dust puff on take-off and on landing
  if (o.dust) {
    x.fillStyle = 'rgba(201,138,71,.55)';
    for (let i = 0; i < 5; i++) x.fillRect(hx - P * 2 + i * P * 2, g.gy - P, P, P);
  }
}

/* The leap. Rarer guesses hang in the air longer and arc higher — a Gappy is
   a slow soar, a void is a short stumble. */
function animateLeap(guessF, actualF, score, done) {
  cancelAnimationFrame(anim);
  const T = tierOf(score), landed = score >= 700;
  const g = stageGeom();
  // never arc higher than the sky above the cliff, or the climber leaves frame
  const headroom = Math.max(24, g.gy - HERO.length * g.P - 8);
  const apexPx = headroom * T.apex;
  const endF = landed ? actualF : Math.min(guessF, actualF * 0.9);
  const t0 = performance.now(), dur = T.dur;
  (function step(t) {
    let k = clamp((t - t0) / dur, 0, 1);
    // a Gappy gets a beat of slow motion at the top of the arc
    const e = T.slow
      ? (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
      : 1 - Math.pow(1 - k, 2);
    const f = e * endF;
    const hop = Math.sin(e * Math.PI) * apexPx;
    const fall = (!landed && k > 0.6) ? Math.pow((k - 0.6) / 0.4, 2) * (g.h - g.gy - 28) : 0;
    drawStage({ guessF, actualF, showFar: true, heroF: f, hop, fall,
                jumping: k < 0.97 || !landed, tierColour: T.c,
                dust: k < 0.1 || (landed && k > 0.94) });
    if (k < 1) anim = requestAnimationFrame(step); else if (done) done();
  })(t0);
}

/* ------------------------------------------------------------- trophies */
const TROPHY = [
  { id:'first',   n:'FIRST LEAP',   d:'Finish one daily',           t:(s)=>s.played>=1 },
  { id:'perfect', n:'BULLSEYE',     d:'1,000 on one gap',           t:(s)=>s.perfects>=1 },
  { id:'triple',  n:'HAT TRICK',    d:'Three 1,000s in a day',      t:(s,d)=>d&&d.filter(r=>r.score===1000).length>=3 },
  { id:'k5',      n:'SURE FOOTED',  d:'Score 5,000+',               t:(s)=>s.best>=5000 },
  { id:'k6',      n:'CANYON KING',  d:'Score 6,000+',               t:(s)=>s.best>=6000 },
  { id:'clean',   n:'NO FALLS',     d:'All seven over 700',         t:(s,d)=>d&&d.length===7&&d.every(r=>r.score>=700) },
  { id:'week',    n:'SEVEN DAYS',   d:'A 7 day streak',             t:(s)=>s.streak>=7 },
  { id:'fort',    n:'FORTNIGHT',    d:'A 14 day streak',            t:(s)=>s.streak>=14 },
  { id:'ten',     n:'REGULAR',      d:'Play 10 dailies',            t:(s)=>s.played>=10 },
  { id:'world',   n:'WELL TRAVELLED',d:'See all 11 regions',        t:(s)=>s.cats.length>=11 },
];
function checkTrophies(dayResults) {
  const got = [];
  TROPHY.forEach((tr) => {
    if (S.trophies.indexOf(tr.id) === -1 && tr.t(S, dayResults)) { S.trophies.push(tr.id); got.push(tr); }
  });
  if (got.length) { save(); SFX.unlock(); toast('Unlocked: ' + got[0].n); }
  return got;
}

/* ---------------------------------------------------------------- state */
let mode = 'daily', qs = [], idx = 0, results = [], locked = false, today = dayIndex();
const V = { title:$('v-title'), play:$('v-play'), done:$('v-done') };
function show(n) { Object.keys(V).forEach((k) => { V[k].hidden = k !== n; });
  $('cliffnotes').hidden = n !== 'play'; window.scrollTo(0, 0); if (n === 'play') placeNotes(); }
function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
function pointsFly(el, n) {
  const r = el.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'pf'; d.textContent = '+' + comma(n);
  d.style.left = (r.left + r.width / 2 - 22) + 'px'; d.style.top = (r.top - 6) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}

function placeNotes() {
  if (V.play.hidden) return;
  const cn = $('cliffnotes');
  cn.style.top = Math.round($('stage').getBoundingClientRect().top + 6) + 'px';
}

/* ---------------------------------------------------------------- title */
function paintTitle() {
  const rec = S.days[today];
  $('t-day').textContent = 'Canyon #' + today + (rec && rec.done ? ' · cleared' : '');
  $('m-daily-s').textContent = rec && rec.done ? 'done for today' : '7 gaps · one try';
  $('b-play').textContent = mode === 'endless' ? '▲ Endless run ▲'
    : (rec && rec.done ? '▲ See your crossing ▲' : '▲ Take the leap ▲');
  $('chip-sparks-n').textContent = comma(S.sparks);
  $('chip-streak').hidden = !(S.streak > 0);
  $('chip-streak-n').textContent = S.streak;
  // a little canyon vignette under the title
  const g = [];
  const P = 3, W = 190, H = 54, gy = 36;
  g.push(`<rect x="0" y="${gy}" width="46" height="${H-gy}" fill="#2C1942"/>`);
  g.push(`<rect x="0" y="${gy}" width="46" height="3" fill="#5A3579"/>`);
  g.push(`<rect x="132" y="${gy-6}" width="58" height="${H-gy+6}" fill="#2C1942"/>`);
  g.push(`<rect x="132" y="${gy-6}" width="58" height="3" fill="#5A3579"/>`);
  for (let x = 50; x < 130; x += 6) g.push(`<rect x="${x}" y="${gy-3}" width="3" height="3" fill="#8A5BB0" opacity=".6"/>`);
  HERO.forEach((row, r) => { for (let c = 0; c < row.length; c++) { const k = row[c];
    if (k !== '.') g.push(`<rect x="${14+c*P}" y="${gy-HERO.length*P+r*P}" width="${P}" height="${P}" fill="${PAL[k]}"/>`); } });
  FLAG.forEach((row, r) => { for (let c = 0; c < row.length; c++) { const k = row[c];
    if (k !== '.') g.push(`<rect x="${140+c*P}" y="${gy-6-FLAG.length*P+r*P}" width="${P}" height="${P}" fill="${PAL[k]}"/>`); } });
  $('t-hero').innerHTML = g.join('');
}

/* ----------------------------------------------------------------- play */
function startDaily() {
  const rec = S.days[today];
  if (rec && rec.done) { mode = 'daily'; results = rec.results || []; qs = pickDay(today); paintDone(); return show('done'); }
  mode = 'daily'; qs = pickDay(today); idx = 0; results = []; show('play'); paintQ();
}
function startEndless() { mode = 'endless'; qs = pickRandom(PER_DAY); idx = 0; results = []; show('play'); paintQ(); }

function paintPips() {
  $('pips').innerHTML = qs.map((_, i) => {
    const r = results[i];
    if (!r) return `<i class="${i === idx ? 'now' : ''}"></i>`;
    const c = tierOf(r.score).c;
    return `<i style="background:${c};border-color:${c}"></i>`;
  }).join('');
}
function paintQ() {
  const q = qs[idx]; locked = false;
  setBiome(q.cat);
  paintPips();
  $('h-mode').textContent = mode === 'endless' ? 'Endless' : 'Daily';
  $('h-run').textContent = comma(results.reduce((a, r) => a + (r ? r.score : 0), 0)) + ' pts';
  $('q-cat').textContent = q.cat;
  $('q-n').textContent = (idx + 1) + ' of ' + PER_DAY;
  $('q-text').textContent = q.q;
  $('tag-a').textContent = q.a.label; $('tag-b').textContent = q.b.label;
  $('fa').textContent = ''; $('fb').textContent = '';
  $('cliffnotes').hidden = false; placeNotes();
  $('r-u').textContent = q.type === 'percent' ? '%' : '×';
  $('r-hint').textContent = q.type === 'percent' ? 'drag to set the share' : 'drag to build your bridge';
  $('slider').value = q.type === 'percent' ? 500 : 0;
  $('dial').hidden = false; $('reveal').hidden = true;
  paintRead(true);
}
let lastTick = 0;
function paintRead(silent) {
  const q = qs[idx], pos = +$('slider').value, v = toValue(q.type, pos);
  $('r-v').textContent = fmtV(q.type, v);
  $('slider').style.setProperty('--p', (pos / 10) + '%');
  const f = frac(q.type, v);
  drawStage({ guessF: f, actualF: 0, showFar: false });
  if (!silent && performance.now() - lastTick > 45) { lastTick = performance.now(); SFX.tick(); }
}
function lockIn() {
  if (locked) return; locked = true;
  const q = qs[idx], guess = toValue(q.type, +$('slider').value), actual = answerOf(q);
  const sc = scoreGuess(q.type, guess, actual);
  results[idx] = { score: sc, guess, actual, id: q.id };
  if (sc === 1000) S.perfects = (S.perfects || 0) + 1;
  if (S.cats.indexOf(q.cat) === -1) { S.cats.push(q.cat); }
  const b = band(sc);
  const gf = frac(q.type, guess), af = frac(q.type, actual);
  $('fa').textContent = fmtFig(q.a.value) + ' ' + q.a.unit;
  $('fb').textContent = fmtFig(q.b.value) + ' ' + q.b.unit;
  SFX.leap();
  animateLeap(gf, af, sc, () => SFX.land(Math.min(3, tierIx(sc) > 3 ? 3 : tierIx(sc) > 1 ? 1 : 0)));

  const T = tierOf(sc);
  const vd = $('verdict'); vd.className = 'verdict';
  vd.style.background = T.c; vd.style.color = '#06141A';
  $('v-l').textContent = T.n; $('v-p').textContent = '+' + comma(sc);
  $('v-p').style.color = '#06141A';
  $('ledger').innerHTML =
    `<div><span class="k">${esc(q.a.label)}</span><span class="v">${esc(fmtFig(q.a.value))} ${esc(q.a.unit)}</span></div>` +
    `<div><span class="k">${esc(q.b.label)}</span><span class="v">${esc(fmtFig(q.b.value))} ${esc(q.b.unit)}</span></div>` +
    `<div><span class="k">You said</span><span class="v">${esc(fmtV(q.type, guess))}${q.type==='percent'?'%':'×'}</span></div>` +
    `<div class="hl"><span class="k">The gap</span><span class="v">${esc(fmtV(q.type, actual))}${q.type==='percent'?'%':'×'}</span></div>`;
  $('cite').textContent = q.src;
  $('dial').hidden = true; $('reveal').hidden = false; $('cliffnotes').hidden = true;
  $('b-next').textContent = idx === PER_DAY - 1 ? 'See your crossing ▶' : 'Next gap ▶';
  paintPips();
  $('h-run').textContent = comma(results.reduce((a, r) => a + (r ? r.score : 0), 0)) + ' pts';
  pointsFly($('v-p'), sc);
  save();
}
function next() { if (idx < PER_DAY - 1) { idx++; SFX.pip(); paintQ(); } else finish(); }

/* --------------------------------------------------------------- finish */
function finish() {
  const total = results.reduce((a, r) => a + r.score, 0);
  if (mode === 'daily' && !(S.days[today] && S.days[today].done)) {
    S.days[today] = { done: true, total, results };
    S.streak = S.last === today - 1 ? S.streak + 1 : 1;
    S.last = today; S.played += 1; S.sum += total;
    S.best = Math.max(S.best, total);
    S.sparks = (S.sparks || 0) + Math.round(total / 10);
    S.dist[clamp(Math.floor(total / 1000), 0, 6)] += 1;
    save();
  }
  checkTrophies(results);
  SFX.win();
  paintDone(); show('done');
}
function paintDone() {
  const total = results.reduce((a, r) => a + r.score, 0);
  $('d-kick').textContent = mode === 'endless' ? 'Endless run' : 'Canyon #' + today;
  $('d-rank').textContent = rankOf(total);
  $('d-log').innerHTML = '<span class="lbl">Leap log — longer = closer</span>' + results.map((r, i) => {
    const col = tierOf(r.score).c;
    return `<div class="r"><span class="i">${i+1}</span><span class="bar">` +
      `<i style="width:${Math.max(2, r.score/10)}%;background:${col};animation-delay:${i*70}ms"></i></span>` +
      `<span class="s">${comma(r.score)}</span></div>`;
  }).join('');
  // your own spread, not an invented global one
  const d = S.dist, mx = Math.max(1, ...d), myB = clamp(Math.floor(total / 1000), 0, 6);
  $('d-spread').innerHTML = '<span class="lbl">Your scores so far</span>' +
    `<div class="cols">${d.map((n, i) => `<div class="${i===myB&&mode!=='endless'?'me':''}" style="height:${Math.max(4, n/mx*100)}%">` +
      `${i===myB&&mode!=='endless'?'<em>you</em>':''}</div>`).join('')}</div>` +
    `<div class="xs">${['0k','1k','2k','3k','4k','5k','6k'].map((l)=>`<span>${l}</span>`).join('')}</div>`;
  const got = S.trophies.length;
  $('d-earn').innerHTML = mode === 'endless'
    ? `<span class="lbl">Practice run — nothing banked</span>`
    : `<span class="lbl">Sparks earned</span><div class="sp" style="flex:1"></div><b>+${comma(Math.round(total/10))}</b>`;
  $('d-score').textContent = '0';
  countUp($('d-score'), total, 900);
  $('b-share').hidden = mode === 'endless';
  $('chip-sparks-n').textContent = comma(S.sparks);
  $('chip-streak').hidden = !(S.streak > 0);
  $('chip-streak-n').textContent = S.streak;
  clock();
}
function countUp(el, to, dur) {
  const t0 = performance.now();
  (function step(t) {
    const k = clamp((t - t0) / dur, 0, 1);
    el.textContent = comma(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function clock() {
  const el = $('d-clock');
  if (mode === 'endless') { el.textContent = ''; return; }
  const upd = () => {
    const n = new Date();
    let s = Math.max(0, Math.floor((Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1) - n.getTime()) / 1000));
    const p = (v) => String(v).padStart(2, '0');
    el.innerHTML = 'Next canyon in <b>' + p(s/3600|0) + ':' + p(s%3600/60|0) + ':' + p(s%60) + '</b>';
  };
  upd(); clearInterval(clock._i); clock._i = setInterval(upd, 1000);
}

/* ---------------------------------------------------------------- share */
async function share() {
  const total = results.reduce((a, r) => a + r.score, 0);
  const text = `Gappy · canyon #${today}\n${comma(total)}/7000 · ${rankOf(total)}\n` +
    results.map((r) => tierOf(r.score).sq).join('') + '\njessebaizer.com/game';
  try {
    if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Copy failed'); }
    ta.remove();
  }
}

/* --------------------------------------------------------------- sheets */
const XBTN = '<button type="button" class="icb" data-close aria-label="Close"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 4h2v2H3zM5 6h2v2H5zM7 8h2v2H7zM9 6h2v2H9zM11 4h2v2h-2zM3 10h2v2H3zM5 8h2v2H5zM9 10h2v2H9zM11 10h2v2h-2z"/></svg></button>';
function sheet(html) {
  const w = document.createElement('div'); w.className = 'scrim';
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => w.remove();
  w.addEventListener('mousedown', (e) => { if (e.target === w) close(); });
  w.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
  document.body.appendChild(w);
}
function helpSheet() {
  sheet(`<div class="sheet-hd"><h3>HOW TO PLAY</h3><div class="sp"></div>${XBTN}</div>
  <div class="howto" style="margin-bottom:14px">
    <div><i>1</i><span>Two things stand on opposite cliffs. You are told what they are, <b>not how far apart.</b></span></div>
    <div><i>2</i><span>Slide to build your bridge. The canyon is <b>logarithmic</b> — 1× to 1000× fits on one screen.</span></div>
    <div><i>3</i><span>Leap. The fog clears, the far cliff appears, and you see whether you made it.</span></div>
    <div><i>4</i><span>Scoring is on how far out you are, not raw numbers. <b>Four times out and you fall.</b></span></div>
    <div><i>5</i><span>Seven gaps, 1,000 each. Everyone gets the same seven. New canyon at <b>midnight UTC.</b></span></div>
  </div>
  <p class="p">Every gap is worked out from two sourced figures, both shown on the reveal — so you leave knowing two real numbers, not just a score. Endless mode never touches your streak.</p>`);
}
function statsSheet() {
  const avg = S.played ? Math.round(S.sum / S.played) : 0;
  sheet(`<div class="sheet-hd"><h3>YOUR RECORD</h3><div class="sp"></div>${XBTN}</div>
  <div class="kv">
    <div><b>${S.played}</b><span>Canyons cleared</span></div>
    <div><b>${S.streak}</b><span>Day streak</span></div>
    <div><b>${comma(S.best)}</b><span>Best crossing</span></div>
    <div><b>${comma(avg)}</b><span>Average</span></div>
    <div><b>${comma(S.sparks)}</b><span>Sparks</span></div>
    <div><b>${S.perfects||0}</b><span>Bullseyes</span></div>
  </div>
  <p class="p">Kept in this browser only. Clear your site data and it goes, and another browser starts fresh.</p>`);
}
function trophySheet() {
  sheet(`<div class="sheet-hd"><h3>TROPHIES ${S.trophies.length}/${TROPHY.length}</h3><div class="sp"></div>${XBTN}</div>
  <div class="trophies">${TROPHY.map((t) => {
    const got = S.trophies.indexOf(t.id) !== -1;
    return `<div class="tr ${got?'got':''}"><svg viewBox="0 0 16 16" fill="${got?'#FFC94D':'#7B63A0'}">
      <path d="M4 2h8v3a4 4 0 0 1-8 0zM2 3h2v2a2 2 0 0 1-2-2zm10 0h2a2 2 0 0 1-2 2zM7 9h2v3H7zM5 12h6v2H5z"/></svg>
      <b>${esc(t.n)}</b><small>${esc(t.d)}</small></div>`;
  }).join('')}</div>`);
}

/* ----------------------------------------------------------------- wire */
$('slider').addEventListener('input', () => paintRead(false));
$('b-lock').addEventListener('click', lockIn);
$('b-next').addEventListener('click', next);
$('b-play').addEventListener('click', () => { SFX.pip(); mode === 'endless' ? startEndless() : startDaily(); });
$('b-endless2').addEventListener('click', () => { mode = 'endless'; startEndless(); });
$('b-share').addEventListener('click', share);
$('b-help').addEventListener('click', helpSheet);
$('b-stats').addEventListener('click', statsSheet);
$('b-trophy').addEventListener('click', trophySheet);
$('m-daily').addEventListener('click', () => { mode='daily'; markMode(); paintTitle(); });
$('m-endless').addEventListener('click', () => { mode='endless'; markMode(); paintTitle(); });
function markMode() {
  $('m-daily').classList.toggle('on', mode === 'daily');
  $('m-endless').classList.toggle('on', mode === 'endless');
}
function soundIcon() {
  $('b-sound').classList.toggle('off', S.sound === false);
  $('wv1').style.display = S.sound === false ? 'none' : '';
  $('wv2').style.display = S.sound === false ? 'none' : '';
}
$('b-sound').addEventListener('click', () => { S.sound = S.sound === false; save(); soundIcon(); if (S.sound) SFX.pip(); });
const nudge = (d) => { const s = $('slider'); s.value = clamp(+s.value + d, 0, 1000); paintRead(false); };
$('s-up').addEventListener('click', () => nudge(8));
$('s-dn').addEventListener('click', () => nudge(-8));
document.addEventListener('keydown', (e) => {
  if (document.querySelector('.scrim')) return;
  if (!V.title.hidden && e.key === 'Enter') { e.preventDefault(); return $('b-play').click(); }
  if (V.play.hidden) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); locked ? next() : lockIn(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-8); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(8); }
});
let rt; window.addEventListener('resize', () => {
  clearTimeout(rt); rt = setTimeout(() => { drawBands(); if (!V.play.hidden) { placeNotes(); paintRead(true); } }, 140);
});

/* ------------------------------------------------------------------ boot */
starfield(); drawBands(); markMode(); soundIcon(); paintTitle();
if (!BANK.length) { $('b-play').disabled = true; toast('Question bank failed to load'); }
requestAnimationFrame(() => { drawBands(); drawStage({ guessF:0, actualF:0, showFar:false }); });
setInterval(() => {
  const d = dayIndex();
  if (d !== today) { today = d; results = []; paintTitle(); if (!V.done.hidden) show('title'); }
}, 30000);

window.__gappy = { scoreGuess, answerOf, pickDay, dayIndex, toValue, toPos, BANK, rankOf, band, TROPHY };
})();
