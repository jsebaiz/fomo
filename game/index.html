<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gappy · the daily leap</title>
<meta name="description" content="Seven gaps a day. Two things, one chasm — guess how far apart they really are, build the bridge, make the leap. Travel far enough and the world changes around you. Same seven for everyone, new set at midnight UTC.">
<meta name="theme-color" content="#06141A">
<meta property="og:title" content="Gappy · the daily leap">
<meta property="og:description" content="Seven gaps a day. How far apart are they really?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2306141A'/%3E%3Crect x='4' y='2' width='8' height='6' fill='%2315151F'/%3E%3Crect x='5' y='4' width='2' height='2' fill='%23fff'/%3E%3Crect x='9' y='4' width='2' height='2' fill='%23fff'/%3E%3Crect x='7' y='6' width='2' height='2' fill='%23F5A623'/%3E%3Crect x='3' y='8' width='10' height='6' fill='%2315151F'/%3E%3Crect x='5' y='8' width='6' height='5' fill='%23F8F8FB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* the five sky stops and the three rock tones are swapped out per region */
  --sky-1:#07171C; --sky-2:#0E2F38; --sky-3:#2A5A5C; --sky-4:#B4763C; --sky-5:#E8A64C;
  --rock-lip:#C98A47; --rock-mid:#3A2A22; --rock-near:#241812;
  --ink:#06141A; --panel:#0C2129; --panel-2:#113039; --line:#1E4B55; --line-hi:#2E6E78;
  --text:#F2F7F5; --dim:#8FB3B0; --faint:#5C8A88;
  --pink:#19E59B; --pink-dk:#0E8F62;
  --cyan:#5FD9E8; --mint:#19E59B; --gold:#F5C542; --red:#E8604A; --amber:#E89B3C;
  --disp:'Press Start 2P', monospace;
  --ui:'Silkscreen', monospace;
  --body:'VT323', monospace;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%; background:var(--ink);}
body{margin:0; background:var(--ink); color:var(--text); font-family:var(--ui);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:none; image-rendering:pixelated;
  overscroll-behavior-y:none; min-height:100dvh;}
button,input{font-family:var(--ui); font-size:inherit; color:inherit;}
button{cursor:pointer; border:0; background:none;}
svg{display:block; shape-rendering:crispEdges;}
::selection{background:var(--pink); color:#06141A;}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

/* ====================================================== pixel chrome ===== */
/* hard-edged box with a chunky offset shadow — no blur anywhere */
.box{background:rgba(12,33,41,.93); border:3px solid var(--line); box-shadow:0 4px 0 0 rgba(6,20,26,.85);}
.box-hi{border-color:var(--line-hi);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  font-family:var(--ui); font-weight:700; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
  padding:15px 18px; border:3px solid var(--ink); background:var(--panel-2); color:var(--text);
  box-shadow:0 5px 0 0 var(--ink); transition:transform .06s steps(2), box-shadow .06s steps(2);}
.btn:active{transform:translateY(5px); box-shadow:0 0 0 0 var(--ink);}
.btn:disabled{opacity:.4; cursor:default; transform:none; box-shadow:0 5px 0 0 var(--ink);}
.btn-go{background:var(--pink); color:#04291B; border-color:#04291B; box-shadow:0 5px 0 0 #04291B;}
.btn-go:active{box-shadow:0 0 0 0 #04291B;}
.btn-gold{background:var(--gold); color:#2A1E05; border-color:#2A1E05; box-shadow:0 5px 0 0 #2A1E05;}
.btn-gold:active{box-shadow:0 0 0 0 #2A1E05;}
.btn-ghost{background:rgba(255,255,255,.05); border-color:var(--line);
  box-shadow:0 5px 0 0 var(--ink); color:var(--dim);}
.btn-ghost:hover{color:var(--text); border-color:var(--line-hi);}
.btn-sm{padding:9px 12px; font-size:11px; width:auto; box-shadow:0 3px 0 0 var(--ink);}
.btn-sm:active{transform:translateY(3px);}

.lbl{font-family:var(--ui); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);}
.lbl-hi{color:var(--cyan);}
.p{font-family:var(--body); font-size:19px; line-height:1.3; color:var(--dim);}
.p b{color:var(--text); font-weight:400;}

/* ====================================================== the world =======
   The scene is the page. A full-bleed sky, two parallax ridgelines and one
   full-viewport canvas that holds the canyon, the bird and the leap. */
#scene{position:fixed; inset:0; z-index:0; overflow:hidden; background:linear-gradient(
  180deg, var(--sky-1) 0%, var(--sky-2) 30%, var(--sky-3) 54%, var(--sky-4) 68%, var(--sky-5) 76%);
  transition:background 1.1s steps(6);}
#scene .stars{position:absolute; left:0; right:0; top:0; height:58%;}
/* low sun, off the centre column so it never sits behind a panel */
#scene .sun{position:absolute; left:16%; top:21%; width:62px; height:62px; border-radius:50%;
  background:var(--sky-5); opacity:.26; transition:background 1.1s steps(6);}
#scene .band{position:absolute; left:0; right:0; display:block; width:100%;}
#scene .far{bottom:26%; height:24%;}
#scene .mid{bottom:26%; height:16%;}
#stage{position:absolute; left:0; top:0; width:100%; height:100%; display:block;}
#grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.055;
  background-image:repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px);}
#vig{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(142% 112% at 50% 46%, transparent 56%, rgba(2,10,14,.6) 100%);}
/* keeps UI text legible over a bright sky — kept light, because the bird flies
   up through this band on a good leap and must not go grey doing it */
#haze{position:fixed; left:0; right:0; top:0; height:60%; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, rgba(4,14,20,.42) 0%, rgba(4,14,20,.2) 56%, rgba(4,14,20,0) 100%);
  transition:opacity .25s steps(3);}
/* in play the text all sits on panels or carries its own shadow, so the haze
   lifts — otherwise it washes the bird grey at the top of a big leap */
body.playing #haze{opacity:0;}

/* ====================================================== layout =========== */
.app{position:relative; z-index:2; min-height:100dvh; display:flex; flex-direction:column;
  max-width:560px; margin:0 auto; padding:0 14px calc(14px + env(safe-area-inset-bottom));}
@media (min-width:600px){ .app{padding:0 20px 20px;} }

/* --- top bar --- */
.top{display:flex; align-items:center; gap:6px; padding:12px 0 10px;}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--text);}
.brand .mk{width:30px; height:30px; flex:0 0 30px;}
.brand b{font-family:var(--disp); font-size:12px; letter-spacing:0;
  color:#F6E3C4; text-shadow:0 2px 0 #4A3016;}
.top .sp{flex:1;}
.chip{display:inline-flex; align-items:center; gap:5px; padding:5px 7px; white-space:nowrap; flex:0 0 auto;
  background:rgba(6,20,26,.72); border:2px solid var(--line); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--dim);}
.chip b{color:var(--gold); font-weight:700;}
.chip.fire b{color:var(--amber);}
.icb{position:relative; width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center;
  background:rgba(6,20,26,.72); border:2px solid var(--line); color:var(--dim);}
.icb:hover{border-color:var(--line-hi); color:var(--text);}
.icb svg{width:16px; height:16px;}
.icb.off{color:var(--faint);}
.icb.kitb{border-color:var(--line-hi); color:var(--cyan);}
.icb.new{border-color:var(--gold); color:var(--gold);}
.icb.new::after{content:''; position:absolute; top:-4px; right:-4px; width:8px; height:8px;
  background:var(--gold); border:2px solid var(--ink); animation:blink 1s steps(2) infinite;}
@media (max-width:430px){
  .icb{width:27px; height:27px; flex:0 0 27px;}
  .icb svg{width:14px; height:14px;}
  .top{gap:5px;}
}
@media (max-width:470px){ #chip-sparks{display:none;} }
@media (max-width:350px){ .brand b{display:none;} }

main{flex:1; display:flex; flex-direction:column; min-height:0;}
.rope{height:7px; margin:2px 0 10px; background-image:
  linear-gradient(90deg, var(--rock-lip) 0 5px, transparent 5px 10px);
  background-size:10px 3px; background-repeat:repeat-x; background-position:0 2px; opacity:.5;}

/* ====================================================== title screen ===== */
.title{flex:1; display:flex; flex-direction:column; justify-content:center; gap:15px; padding:8px 0 16px;}
.title-art{text-align:center; position:relative;}
.title-art h1{font-family:var(--disp); font-size:clamp(30px,10.5vw,54px); line-height:1; margin:0;
  letter-spacing:0; color:#F6E3C4;
  text-shadow:0 3px 0 var(--rock-lip), 0 6px 0 #6E4722, 0 9px 0 var(--ink), 4px 9px 0 var(--ink);}
.title-art h1 span{color:var(--mint); text-shadow:0 3px 0 #0E8F62, 0 6px 0 #075C3F, 0 9px 0 var(--ink);}
.title-art .sub{font-family:var(--ui); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gold); margin-top:12px;}
.title-art .day{font-family:var(--ui); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); margin-top:6px;}
.title-art .hero{width:100%; max-width:390px; margin:12px auto 2px; display:block;}

.modes{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.mode{padding:11px 8px; border:3px solid var(--ink); background:rgba(12,33,41,.82); text-align:center;
  box-shadow:0 4px 0 0 var(--ink);}
.mode b{display:block; font-family:var(--ui); font-weight:700; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase;}
.mode span{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.08em; color:var(--faint); margin-top:4px;}
.mode.on{background:var(--cyan); color:#06282A;}
.mode.on span{color:#0A3A3C;}
.mode:disabled{opacity:.45;}

.howto{display:grid; gap:8px;}
.howto div{display:flex; gap:10px; align-items:flex-start; font-family:var(--body); font-size:18px;
  line-height:1.25; color:var(--dim);}
.howto i{flex:0 0 20px; height:20px; background:var(--pink); color:#04291B; font-family:var(--ui);
  font-size:10px; font-weight:700; display:grid; place-items:center; font-style:normal; margin-top:2px;}
.howto b{color:var(--text); font-weight:400;}

/* ====================================================== play ============= */
/* the lower third of the screen belongs to the canyon — nothing sits in it */
.play{flex:1; display:flex; flex-direction:column; min-height:0; padding-bottom:37vh;}
/* on a short screen the dial moves up instead of the canyon shrinking away */
@media (max-height:700px){ .play{padding-bottom:30vh;} }
@media (max-height:620px){ .play{padding-bottom:22vh;} }
.play.leaping{pointer-events:none;}
.play.leaping .hud, .play.leaping .qcard, .play.leaping .trail{opacity:0;}
.play .hud, .play .qcard, .play .trail{transition:opacity .2s steps(2);}

.hud{display:flex; align-items:center; gap:8px; padding:2px 0 7px;}
.hud .sp{flex:1;}
.hud #h-run{white-space:nowrap; flex:0 0 auto;}
.rgn{display:inline-flex; align-items:center; gap:6px; padding:4px 7px; background:rgba(6,20,26,.74);
  border:2px solid var(--line-hi); font-family:var(--ui); font-weight:700; font-size:9px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--cyan); white-space:nowrap;
  max-width:46%; overflow:hidden; text-overflow:ellipsis;}
.rgn i{width:7px; height:7px; flex:0 0 7px; background:var(--cyan); font-style:normal;}
.pips{display:flex; gap:3px;}
.pips i{width:13px; height:13px; border:2px solid var(--line); background:rgba(6,20,26,.6);}
.pips i.now{border-color:var(--cyan); animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.25;}}

/* distance to the next region */
.trail{display:flex; align-items:center; gap:8px; margin:0 0 9px;}
.trail .bar{flex:1; height:7px; border:2px solid var(--line); background:rgba(6,20,26,.6); position:relative;}
.trail .bar i{position:absolute; left:0; top:0; bottom:0; background:var(--cyan);
  transition:width .5s steps(8); display:block;}
.trail span{font-family:var(--ui); font-size:9px; letter-spacing:.1em; color:var(--faint); white-space:nowrap;}

.qcard{padding:13px 13px 14px; margin-bottom:10px;}
.qcard .cat{display:flex; align-items:center; gap:7px; margin-bottom:8px;}
.qcard .cat i{width:9px; height:9px; background:var(--cyan); font-style:normal;}
.qcard h2{font-family:var(--body); font-size:clamp(23px,6.4vw,30px); line-height:1.08; margin:0;
  color:var(--text); font-weight:400; letter-spacing:.01em;}

/* labels painted onto the rock faces, down in the scene */
.cliffnotes{position:fixed; left:0; right:0; z-index:3; pointer-events:none;
  max-width:560px; margin:0 auto; padding:0 14px;}
@media (min-width:600px){ .cliffnotes{padding:0 20px;} }
.cn{position:absolute; max-width:43%; padding:6px 8px; background:rgba(4,14,19,.9);
  border:2px solid var(--line-hi); border-top:3px solid var(--rock-lip);}
.cn b{display:block; font-family:var(--ui); font-weight:700; font-size:9px; letter-spacing:.05em;
  line-height:1.3; color:var(--text);}
.cn em{display:block; font-style:normal; font-family:var(--ui); font-size:9px; color:var(--gold); margin-top:3px;}
.cn.a{left:14px;} .cn.b{right:14px; text-align:right;}
@media (min-width:600px){ .cn.a{left:20px;} .cn.b{right:20px;} }

/* the dial */
.dial{margin-top:auto; padding-top:8px;}
.readout{text-align:center; position:relative;}
.readout .v{font-family:var(--disp); font-size:clamp(30px,10vw,46px); line-height:1; color:var(--gold);
  text-shadow:0 4px 0 var(--ink); letter-spacing:0;}
.readout .u{font-family:var(--disp); font-size:.52em; color:var(--amber);}
.readout .hint{font-family:var(--ui); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin-top:9px;}
.track{position:relative; margin:11px 0 3px; padding:12px 0;}
.track input{-webkit-appearance:none; appearance:none; width:100%; height:16px; background:none; display:block; margin:0;}
.track input::-webkit-slider-runnable-track{height:16px; border:3px solid var(--ink);
  background:linear-gradient(90deg, var(--pink) var(--p,0%), rgba(6,20,26,.72) var(--p,0%));}
.track input::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:34px; margin-top:-12px;
  background:var(--gold); border:3px solid var(--ink); box-shadow:inset 0 -5px 0 0 rgba(0,0,0,.22);}
.track input::-moz-range-track{height:16px; border:3px solid var(--ink); background:rgba(6,20,26,.72);}
.track input::-moz-range-progress{height:16px; background:var(--pink);}
.track input::-moz-range-thumb{width:22px; height:30px; border-radius:0; background:var(--gold); border:3px solid var(--ink);}
.steppers{display:flex; gap:7px; justify-content:center; margin:9px 0 11px;}
.steppers button{width:54px; height:34px; border:3px solid var(--ink); background:var(--panel-2);
  font-family:var(--disp); font-size:11px; color:var(--dim); box-shadow:0 4px 0 0 var(--ink);}
.steppers button:hover{color:var(--text);}
.steppers button:active{transform:translateY(4px); box-shadow:none;}

@media (max-height:700px){
  .readout .v{font-size:clamp(26px,8.4vw,36px);}
  .readout .hint{margin-top:6px;}
  .track{margin:8px 0 2px; padding:9px 0;}
  .steppers{margin:7px 0 8px;}
  .steppers button{height:30px;}
  .btn{padding:12px 16px;}
  .qcard{padding:10px 11px 11px; margin-bottom:8px;}
  .qcard h2{font-size:clamp(20px,5.8vw,25px);}
}

/* ====================================================== reveal =========== */
.reveal{animation:pop .22s steps(3);}
@keyframes pop{from{transform:translateY(8px); opacity:0;}}
.verdict{display:flex; align-items:center; gap:9px; padding:10px 12px; margin:10px 0;
  border:3px solid var(--ink);}
.verdict .vl{font-family:var(--disp); font-size:13px; letter-spacing:0;}
.verdict .vp{margin-left:auto; font-family:var(--disp); font-size:17px;}

.ledger{padding:11px 12px; display:grid; gap:7px; margin-bottom:9px;}
.ledger div{display:flex; gap:10px; align-items:baseline; font-family:var(--ui); font-size:11px;}
.ledger .k{color:var(--dim); flex:1; min-width:0;}
.ledger .v{color:var(--text); white-space:nowrap; letter-spacing:.06em;}
.ledger .hl .v{color:var(--gold); font-weight:700; letter-spacing:.1em;}
.cite{font-family:var(--body); font-size:16px; line-height:1.3; color:var(--faint); margin:0 0 11px;}

/* ====================================================== results ========== */
.done{flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:8px 0 10px;}
.bigscore{text-align:center;}
.bigscore .n{font-family:var(--disp); font-size:clamp(34px,12vw,58px); line-height:1; color:var(--gold);
  text-shadow:0 5px 0 var(--ink);}
.bigscore .of{font-family:var(--disp); font-size:.4em; color:var(--faint); display:inline-block; margin-left:4px;}
.rank{display:inline-flex; align-items:center; gap:8px; margin-top:11px; padding:7px 13px;
  border:3px solid var(--ink); background:var(--pink); color:#04291B;
  font-family:var(--disp); font-size:11px; box-shadow:0 4px 0 0 var(--ink);}

.log{padding:11px 12px;}
.log .lbl{margin-bottom:9px; display:block;}
.log .r{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
.log .r:last-child{margin-bottom:0;}
.log .r .i{font-family:var(--ui); font-size:9px; color:var(--faint); width:10px;}
.log .r .bar{flex:1; height:12px; background:rgba(6,20,26,.6); border:2px solid var(--line);
  position:relative; overflow:hidden;}
.log .r .bar i{position:absolute; left:0; top:0; bottom:0; display:block;
  animation:grow .5s steps(8) backwards;}
@keyframes grow{from{width:0 !important;}}
.log .r .s{font-family:var(--ui); font-size:9px; width:62px; text-align:right; color:var(--dim);
  letter-spacing:.06em;}

.spread{padding:11px 12px;}
.spread .cols{display:flex; align-items:flex-end; gap:4px; height:62px; margin:8px 0 5px;}
.spread .cols div{flex:1; background:var(--line); border:2px solid var(--line-hi); min-height:3px; position:relative;}
.spread .cols div.me{background:var(--pink); border-color:var(--pink);}
.spread .cols div em{position:absolute; left:50%; top:-15px; transform:translateX(-50%);
  font-family:var(--ui); font-size:9px; font-style:normal; color:var(--pink); white-space:nowrap;}
.spread .xs{display:flex; gap:4px; font-family:var(--ui); font-size:8px; color:var(--faint);}
.spread .xs span{flex:1; text-align:center;}

.earn{display:flex; align-items:center; gap:10px; padding:10px 12px;}
.earn .sp{flex:1;}
.earn b{font-family:var(--disp); font-size:14px; color:var(--gold); white-space:nowrap; flex:0 0 auto;}
.earn .lbl{min-width:0; letter-spacing:.1em;}
.clock{text-align:center; font-family:var(--ui); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);}
.clock b{color:var(--cyan);}
.stack{display:grid; gap:8px;}

/* ====================================================== sheets =========== */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(2,8,12,.84); display:flex;
  align-items:flex-end; justify-content:center; animation:fin .15s steps(2);}
@media (min-width:600px){ .scrim{align-items:center;} }
@keyframes fin{from{opacity:0;}}
.sheet{width:100%; max-width:560px; max-height:90dvh; overflow-y:auto; background:var(--panel);
  border:3px solid var(--line-hi); border-bottom:0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
@media (min-width:600px){ .sheet{border-bottom:3px solid var(--line-hi); margin:0 16px; box-shadow:0 6px 0 0 var(--ink);} }
.sheet-hd{display:flex; align-items:center; gap:10px; margin-bottom:13px;}
.sheet-hd h3{font-family:var(--disp); font-size:14px; margin:0;}
.sheet-hd .sp{flex:1;}
.kv{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:14px;}
.kv div{padding:9px 10px; border:2px solid var(--line); background:rgba(6,20,26,.4);}
.kv b{display:block; font-family:var(--disp); font-size:15px; color:var(--gold);}
.kv span{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); margin-top:5px;}
.trophies{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:7px;}
.tr{padding:9px 6px; text-align:center; border:2px solid var(--line); background:rgba(6,20,26,.4);}
.tr svg{width:30px; height:30px; margin:0 auto 6px; opacity:.22; filter:grayscale(1);}
.tr b{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.06em; color:var(--faint); line-height:1.3;}
.tr small{display:block; font-family:var(--body); font-size:14px; color:var(--faint); margin-top:3px; line-height:1.15;}
.tr.got{border-color:var(--gold); background:rgba(245,197,66,.1);}
.tr.got svg{opacity:1; filter:none;}
.tr.got b{color:var(--gold);}
.tr.got small{color:var(--dim);}

/* --- wardrobe --- */
.kitprev{display:flex; align-items:center; gap:14px; padding:12px; margin-bottom:14px;
  border:3px solid var(--line-hi); background:rgba(6,20,26,.5);}
.kitprev .pen{flex:0 0 auto; padding:6px 10px; background:rgba(245,197,66,.07);
  border-bottom:3px solid var(--rock-lip);}
.kitprev .pen svg{width:96px; height:108px;}
.kitprev b{display:block; font-family:var(--disp); font-size:11px; color:var(--cyan); line-height:1.5;}
.kitprev span{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); margin-top:7px;}
.kitprev em{display:block; font-style:normal; font-family:var(--body); font-size:17px;
  color:var(--dim); margin-top:7px; line-height:1.2;}
.slot{margin-bottom:13px;}
.slot > .lbl{display:block; margin-bottom:7px;}
.kitgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:7px;}
.kit{display:block; width:100%; padding:8px 5px 7px; text-align:center;
  border:2px solid var(--line); background:rgba(6,20,26,.4);}
.kit svg{width:48px; height:54px; margin:0 auto 5px;}
.kit .kx{height:54px; display:grid; place-items:center; margin-bottom:5px;
  font-family:var(--disp); font-size:14px; color:var(--faint);}
.kit b{display:block; font-family:var(--ui); font-size:9px; letter-spacing:.04em;
  line-height:1.3; color:var(--text);}
.kit small{display:block; font-family:var(--body); font-size:14px; line-height:1.15;
  color:var(--faint); margin-top:3px;}
.kit.on{border-color:var(--cyan); background:rgba(95,217,232,.12);}
.kit.on b{color:var(--cyan);}
.kit.lock{cursor:default;}
.kit.lock b{color:var(--faint);}
.kit.lock small{color:var(--amber);}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px); z-index:70;
  background:var(--gold); color:#2A1E05; border:3px solid var(--ink); box-shadow:0 4px 0 0 var(--ink);
  padding:10px 16px; font-family:var(--ui); font-weight:700; font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; opacity:0; pointer-events:none; transition:all .16s steps(3);
  max-width:calc(100% - 32px); text-align:center;}
.toast.on{opacity:1; transform:translateX(-50%);}

/* the big region card that slides over the scene when you cross a line */
.gate{position:fixed; left:0; right:0; top:30%; z-index:66; pointer-events:none; text-align:center;
  animation:gatein 2.2s steps(14) forwards;}
.gate span{display:inline-block; padding:10px 20px; background:rgba(4,14,19,.92);
  border:3px solid var(--cyan); border-bottom-width:6px;
  font-family:var(--ui); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--cyan);}

  color:#F6E3C4; text-shadow:0 3px 0 var(--ink);}
@keyframes gatein{0%{opacity:0; transform:translateY(14px);} 12%{opacity:1; transform:none;}
  76%{opacity:1;} 100%{opacity:0;}}

.pf{position:fixed; z-index:65; pointer-events:none; font-family:var(--disp); font-size:15px;
  color:var(--gold); text-shadow:0 3px 0 var(--ink); animation:fly 1s steps(10) forwards;}
@keyframes fly{to{transform:translateY(-62px); opacity:0;}}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }

<script>
/* ============================================================================
   Gappy — the daily leap.
   Two things on opposite cliffs. Guess how wide the gap is, build the bridge,
   jump. Seven a day, same seven for everyone, new set at midnight UTC. Every
   point you score is a metre travelled, and every 400 metres the world around
   the bird changes.
   ========================================================================== */
(function () {
'use strict';

var BANK = window.GAPPY_BANK || [];
var $ = function (id) { return document.getElementById(id); };
var PER_DAY = 7, MAX_Q = 100, MAX_DAY = 700, REGION_LEN = 400, STORE = 'gappy_v1';
var EPOCH = Date.UTC(2026, 0, 1);
var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
var comma = function (n) { return Math.round(n).toLocaleString('en-US'); };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };

/* ------------------------------------------------------------ determinism */
function dayIndex(t) {
  var d = new Date(t === undefined ? Date.now() : t);
  return Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - EPOCH) / 86400000);
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(n, seed) {
  var a = [], rnd = mulberry32(seed), i, j, tmp;
  for (i = 0; i < n; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--) { j = (rnd() * (i + 1)) | 0; tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return a;
}
function pickDay(day) {
  var slots = Math.floor(BANK.length / PER_DAY);
  if (slots < 1) return BANK.slice(0, PER_DAY);
  var cycle = Math.floor(day / slots), slot = ((day % slots) + slots) % slots;
  return shuffled(BANK.length, 0x9E3779B9 ^ cycle)
    .slice(slot * PER_DAY, slot * PER_DAY + PER_DAY)
    .map(function (i) { return BANK[i]; });
}
function pickRandom(n) {
  return shuffled(BANK.length, (Math.random() * 1e9) | 0).slice(0, n).map(function (i) { return BANK[i]; });
}
function answerOf(q) { return q.type === 'percent' ? (q.a.value / q.b.value) * 100 : q.a.value / q.b.value; }

/* --------------------------------------------------------------- scoring
   Five bands, nothing in between: land it exactly and it is 100, and each
   step out drops you a quarter. Seven gaps a day makes 700. */
function scoreGuess(type, guess, actual) {
  var e = type === 'percent'
    ? Math.abs(guess - actual)                       // percentage points out
    : Math.max(guess / actual, actual / guess);      // times out
  var cuts = type === 'percent' ? [0.5, 3, 8, 18] : [1.02, 1.25, 1.75, 3];
  if (e <= cuts[0]) return 100;
  if (e <= cuts[1]) return 75;
  if (e <= cuts[2]) return 50;
  if (e <= cuts[3]) return 25;
  return 0;
}
/* One word each. Rarer landings hang in the air longer and arc higher. */
var TIERS = [
  { min:100, n:'PINPOINT', d:'dead on the flag',     c:'#19E59B', sq:'\u{1F7E9}', dur:1700, apex:1.00, slow:true,  m:1.0 },
  { min:75,  n:'CLEAN',    d:'over with room spare', c:'#5FD9E8', sq:'\u{1F7E6}', dur:1450, apex:0.76, slow:false, m:1.0 },
  { min:50,  n:'SCRAPED',  d:'caught the far lip',   c:'#F5C542', sq:'\u{1F7E8}', dur:1080, apex:0.54, slow:false, m:1.0 },
  { min:25,  n:'SHORT',    d:'planks ran out',       c:'#E89B3C', sq:'\u{1F7E7}', dur:760,  apex:0.34, slow:false, m:1.0 },
  { min:0,   n:'VOID',     d:'straight down',        c:'#E8604A', sq:'⬛',    dur:460,  apex:0.13, slow:false, m:1.0 },
];
function tierOf(s) {
  for (var i = 0; i < TIERS.length; i++) if (s >= TIERS[i].min) return TIERS[i];
  return TIERS[TIERS.length - 1];
}
function tierIx(s) { return TIERS.indexOf(tierOf(s)); }
function band(s) { return s >= 100 ? 0 : s >= 75 ? 1 : s >= 50 ? 2 : 3; }
var RANKS = [
  [700, 'FLAWLESS'], [625, 'ICE COLD'], [500, 'SURE FOOTED'],
  [375, 'STEADY'], [250, 'WOBBLY'], [125, 'SLIPPERY'], [0, 'SPLAT'],
];
function rankOf(t) {
  for (var i = 0; i < RANKS.length; i++) if (t >= RANKS[i][0]) return RANKS[i][1];
  return RANKS[RANKS.length - 1][1];
}

/* ----------------------------------------------------------- dial mapping */
function toValue(type, pos) { return type === 'percent' ? pos / 10 : Math.pow(10, (pos / 1000) * 3); }
function toPos(type, v) { return type === 'percent' ? v * 10 : (Math.log10(clamp(v, 1, 1000)) / 3) * 1000; }
function frac(type, v) {
  return type === 'percent' ? clamp(v / 100, 0, 1) : clamp(Math.log10(clamp(v, 1, 1000)) / 3, 0, 1);
}
function fmtV(type, v) {
  return type === 'percent' ? (Math.round(v * 10) / 10).toFixed(1) : v >= 100 ? comma(v) : v.toFixed(1);
}
function fmtFig(n) {
  if (n >= 1e9) return (n / 1e9).toPrecision(3).replace(/\.?0+$/, '') + 'bn';
  if (n >= 1e6) return (n / 1e6).toPrecision(3).replace(/\.?0+$/, '') + 'm';
  if (n >= 1000) return comma(n);
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
}

/* ------------------------------------------------------------------ store */
var BLANK = { days:{}, streak:0, bestStreak:0, best:0, played:0, sum:0, last:null,
              dist:[0,0,0,0,0,0,0], sparks:0, cats:[], trophies:[], sound:true,
              perfects:0, metres:0, regions:1, kit:[], worn:{}, newKit:false, v:2 };
function load() {
  var p = {};
  try { p = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { p = {}; }
  var s = {};
  Object.keys(BLANK).forEach(function (k) { s[k] = BLANK[k]; });
  Object.keys(p).forEach(function (k) { s[k] = p[k]; });
  // arrays and objects get their own copies, so a stale save can never alias BLANK
  s.dist = (Array.isArray(p.dist) && p.dist.length === 7) ? p.dist.slice() : [0,0,0,0,0,0,0];
  s.cats = Array.isArray(p.cats) ? p.cats.slice() : [];
  s.trophies = Array.isArray(p.trophies) ? p.trophies.slice() : [];
  s.kit = Array.isArray(p.kit) ? p.kit.slice() : [];
  s.worn = (p.worn && typeof p.worn === 'object') ? Object.assign({}, p.worn) : {};
  s.days = (p.days && typeof p.days === 'object') ? p.days : {};
  s.metres = Math.max(0, +s.metres || 0);
  s.bestStreak = Math.max(+s.bestStreak || 0, +s.streak || 0);
  s.regions = Math.max(1, +s.regions || 1);
  s.perfects = Math.max(0, +s.perfects || 0);

  /* Scores used to run 0–1000 a gap and 0–7000 a day; they now run 0–100 and
     0–700. That is exactly ten to one, so every stored score divides cleanly
     and the seven dist buckets land in the same places. Metres are seeded from
     the points already earned, which is what metres are. */
  if (+p.v !== 2) {               // p, not s — s already carries BLANK's v
    s.best = Math.round((+s.best || 0) / 10);
    s.sum = Math.round((+s.sum || 0) / 10);
    if (!s.metres) s.metres = s.sum;
    Object.keys(s.days).forEach(function (k) {
      var rec = s.days[k]; if (!rec) return;
      rec.total = Math.round((+rec.total || 0) / 10);
      if (Array.isArray(rec.results)) {
        rec.results.forEach(function (r) { if (r) r.score = Math.round((+r.score || 0) / 10); });
      }
    });
    s.v = 2;                      // regions are reconciled at boot, once
  }                               // REGIONS itself has been assigned
  return s;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
var S = load();

/* ------------------------------------------------------------------ sound
   A handful of square-wave blips. No files, nothing to download, and it only
   ever starts after a real tap because that is how WebAudio works. */
var SFX = (function () {
  var ctx = null;
  function on() { return S.sound !== false; }
  function ac() {
    if (!ctx) { var C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function blip(freq, dur, type, vol, slideTo) {
    if (!on()) return;
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.06 : vol, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  return {
    tick: function () { blip(520, 0.02, 'square', 0.018); },
    leap: function () { blip(260, 0.26, 'square', 0.05, 760); },
    land: function (b) {
      var f = [660, 560, 420, 180][b] || 420;
      blip(f, 0.1, 'square', 0.07);
      setTimeout(function () {
        blip(b === 3 ? 120 : f * 1.5, 0.16, b === 3 ? 'sawtooth' : 'square', 0.055);
      }, 95);
    },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) {
        setTimeout(function () { blip(f, 0.16, 'square', 0.06); }, i * 95);
      });
    },
    pip: function () { blip(880, 0.05, 'square', 0.04); },
    unlock: function () {
      [784, 988, 1318].forEach(function (f, i) {
        setTimeout(function () { blip(f, 0.2, 'triangle', 0.08); }, i * 120);
      });
    },
    gate: function () {
      [392, 523, 659, 880, 1046].forEach(function (f, i) {
        setTimeout(function () { blip(f, 0.22, 'triangle', 0.07); }, i * 110);
      });
    },
  };
})();

/* ---------------------------------------------------------------- regions
   Not tied to the question, tied to the distance. Every 400 metres the sky
   and the rock change under the bird, and the last one holds forever. */

/* ------------------------------------------------------- pixel scenery */
var PXS = 4;   // one scenery "pixel" is this many device-independent px
function mesa(cv, color, seed, heightFrac, roughness) {
  if (!cv) return;
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  var x = cv.getContext('2d'); if (!x) return;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  x.fillStyle = color;
  var rnd = mulberry32(seed), cols = Math.ceil(w / PXS), y = h * (1 - heightFrac), c, yy;
  for (c = 0; c < cols; c++) {
    // plateaus: hold a level for a stretch, then step
    if (rnd() < roughness) y += (rnd() < 0.5 ? -1 : 1) * PXS * (1 + ((rnd() * 3) | 0));
    y = clamp(y, h * 0.06, h - PXS);
    yy = Math.round(y / PXS) * PXS;
    x.fillRect(c * PXS, yy, PXS, h - yy);
  }
}
function drawBands() {
  var cs = getComputedStyle(document.documentElement);
  var pick = function (n) { return cs.getPropertyValue('--sky-' + n).trim(); };
  mesa($('band-far'), shade(pick(3), -0.36), 11, 0.70, 0.17);
  mesa($('band-mid'), shade(pick(2), -0.20), 29, 0.80, 0.24);
}
function shade(hex, amt) {
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#1A2E34';
  var n = parseInt(m[1], 16);
  var f = function (v) { return clamp(Math.round(v + (amt < 0 ? v * amt : (255 - v) * amt)), 0, 255); };
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)]
    .map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
}
function starfield() {
  var el = $('stars'); if (!el) return;
  var rnd = mulberry32(7), html = '', i, s;
  for (i = 0; i < 80; i++) {
    s = rnd() < 0.18 ? 3 : 2;
    html += '<i style="position:absolute;left:' + (rnd() * 100).toFixed(2) + '%;top:' +
      (rnd() * 100).toFixed(2) + '%;width:' + s + 'px;height:' + s + 'px;background:#fff;opacity:' +
      (0.16 + rnd() * 0.5).toFixed(2) + '"></i>';
  }
  el.innerHTML = html;
}

function sprite(x, map, px, py, s) {
  for (var r = 0; r < map.length; r++) for (var c = 0; c < map[r].length; c++) {
    var k = map[r][c]; if (k === '.') continue;
    x.fillStyle = PAL[k] || '#fff';
    x.fillRect(px + c * s, py + r * s, s, s);
  }
}

function drawHero(x, map, px, py, s) {
  sprite(x, map, px, py, s);
  equipped().forEach(function (it) { sprite(x, it.art, px, py + it.y * s, s); });
}
/* the same maps as SVG, for the title art and the wardrobe sheet */
function rects(map, P, ox, oy, flat, op) {
  var g = '', r, c, k;
  for (r = 0; r < map.length; r++) for (c = 0; c < map[r].length; c++) {
    k = map[r][c]; if (k === '.') continue;
    g += '<rect x="' + (ox + c * P) + '" y="' + (oy + r * P) + '" width="' + P + '" height="' + P +
      '" fill="' + (flat || PAL[k] || '#fff') + '"' + (op ? ' opacity="' + op + '"' : '') + '/>';
  }
  return g;
}

  (worn || []).forEach(function (it) { g += rects(it.art, P, 0, it.y * P, null, kitOp); });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
    '" aria-hidden="true">' + g + '</svg>';

/* ----------------------------------------------------------- the canyon
   One full-viewport canvas. The sky, the ridgelines and the chasm are the
   page background; the UI floats on top of them and gets out of the way
   while the bird is in the air. */
var anim = null, stageState = null, cliffF = 0.74;
/* Where the cliff line sits. Measured from where the dial actually ends, so
   the bird always has room to stand on the lip however short the screen is,
   and held steady for the whole question so the ground cannot move mid-leap. */
function pxFor(h) { return h < 580 ? 3 : h < 660 ? 4 : 5; }
function measureCliff() {
  if (V.play.hidden) { cliffF = 0.74; return; }
  var d = $('dial'); if (!d || d.hidden) return;        // mid-leap: keep it
  var r = d.getBoundingClientRect(), h = $('stage').clientHeight || 800;
  if (!r.height) return;
  cliffF = clamp((r.bottom + HERO.length * pxFor(h) + 14) / h, 0.62, 0.9);
}
function stageGeom() {
  var cv = $('stage');
  if (!cv) return { w:0, h:0, P:5, gy:0, L:0, R:0, xOf:function () { return 0; } };
  var w = cv.clientWidth, h = cv.clientHeight;
  var P = pxFor(h || 800);
  var gy = Math.round(h * cliffF / P) * P;               // the cliff-top line
  var pad = Math.max(26, Math.min(74, w * 0.09));
  var L = Math.round(pad / P) * P;
  var R = Math.round((w - pad) / P) * P;
  return { cv:cv, w:w, h:h, P:P, gy:gy, L:L, R:R,
    xOf: function (f) { return Math.round((L + clamp(f, 0, 1) * (R - L)) / P) * P; } };
}
function drawStage(o) {
  var g = stageGeom(); if (!g.w || !g.h) return;
  stageState = o;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  g.cv.width = Math.round(g.w * dpr); g.cv.height = Math.round(g.h * dpr);
  var x = g.cv.getContext('2d'); if (!x) return;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, g.w, g.h);
  var cs = getComputedStyle(document.documentElement);
  var lip  = cs.getPropertyValue('--rock-lip').trim() || '#C98A47';
  var body = cs.getPropertyValue('--rock-mid').trim() || '#3A2A22';
  var deep = cs.getPropertyValue('--rock-near').trim() || '#241812';
  var P = g.P, yy, i;

  // the void: dark, with strata fading into it
  x.fillStyle = 'rgba(3,9,13,.93)';
  x.fillRect(0, g.gy, g.w, g.h - g.gy);
  x.fillStyle = 'rgba(255,255,255,.028)';
  for (yy = g.gy + P * 2; yy < g.h; yy += P * 5) x.fillRect(0, yy, g.w, P);

  function cliff(x0, x1) {
    if (x1 <= x0) return;
    x.fillStyle = body; x.fillRect(x0, g.gy, x1 - x0, g.h - g.gy);
    x.fillStyle = lip;  x.fillRect(x0, g.gy, x1 - x0, P);
    x.fillStyle = deep;
    for (var y2 = g.gy + P * 3; y2 < g.h; y2 += P * 4) x.fillRect(x0, y2, x1 - x0, P);
    // crumbling edge pixels, so the lip is not a ruler-straight line
    var rnd = mulberry32(Math.round(x0) * 31 + 7);
    for (var j = 0; j < 8; j++) {
      var px = x0 + Math.round(rnd() * (x1 - x0) / P) * P;
      x.fillStyle = lip; x.fillRect(px, g.gy - P, P, P);
    }
  }
  cliff(0, g.L);                                   // the side you start on
  var fx = g.xOf(o.actualF);
  if (o.showFar) {
    cliff(fx, g.w);
    sprite(x, FLAG, fx + P * 3, g.gy - FLAG.length * P, P);
  }

  // on the title and results screens the canyon is pure scenery: no bird, no
  // bridge, no mist, so it never competes with the art on top of it
  if (o.idle) { cliff(g.R + P * 6, g.w); return; }

  // the bridge you built: planks out over the void
  var bx = g.xOf(o.guessF);
  var plank = o.tierColour || lip;
  for (var pxx = g.L; pxx < bx; pxx += P * 2) {
    x.fillStyle = plank; x.fillRect(pxx, g.gy - P, P, P);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(pxx, g.gy, P, P);
  }
  if (bx > g.L) { x.fillStyle = plank; x.fillRect(bx - P, g.gy - P * 3, P, P * 3); }

  // mist hiding the far side until you commit — soft at the top, solid below
  if (!o.showFar) {
    var fogX = bx + P * 2;
    var c1 = cs.getPropertyValue('--sky-2').trim() || '#0E2F38';
    var grd = x.createLinearGradient(fogX, 0, Math.min(g.w, fogX + 180), 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(0.4, c1 + 'd0'); grd.addColorStop(1, c1);
    var top = Math.max(0, g.gy - P * 36), slices = 8, sh = (g.h - top) / slices;
    for (i = 0; i < slices; i++) {
      x.globalAlpha = 0.14 + (i / (slices - 1)) * 0.86;
      x.fillStyle = grd;
      x.fillRect(fogX, top + sh * i, g.w - fogX, sh + 1);
    }
    x.globalAlpha = 1;
    x.fillStyle = cs.getPropertyValue('--faint').trim() || '#5C8A88';
    for (i = 0; i < 26; i++) {
      var rnd2 = mulberry32(i * 97);
      x.fillRect(fogX + 18 + Math.round(rnd2() * Math.max(1, g.w - fogX - 28) / P) * P,
                 top + Math.round(rnd2() * (g.h - top) / P) * P, P, P);
    }
  }

  // the bird
  var heroH = HERO.length * P;
  var hx = o.heroF === undefined ? g.L - HERO[0].length * P - P * 2 : g.xOf(o.heroF);
  var hy = g.gy - heroH - (o.hop || 0) + (o.fall || 0);
  drawHero(x, o.jumping ? HERO_JUMP : HERO, hx, hy, P);
  // a dust puff on take-off and on landing
  if (o.dust) {
    x.fillStyle = 'rgba(255,255,255,.4)';
    for (i = 0; i < 5; i++) x.fillRect(hx - P * 2 + i * P * 2, g.gy - P, P, P);
  }
}

/* The leap. Rarer landings hang in the air longer and arc higher — a
   PINPOINT is a slow soar across the whole screen, a VOID is a stumble. */
function animateLeap(guessF, actualF, score, done) {
  cancelAnimationFrame(anim);
  var T = tierOf(score), landed = score >= 50;
  var g = stageGeom();
  // never arc past the top of the frame, and keep a margin so the bird does
  // not peak behind the top bar on the biggest leaps
  var headroom = Math.max(30, g.gy - HERO.length * g.P - Math.round(g.h * 0.07));
  var apexPx = headroom * T.apex;
  var endF = landed ? actualF : Math.min(guessF, actualF * 0.9);
  var t0 = performance.now(), dur = T.dur;
  (function step(t) {
    var k = clamp((t - t0) / dur, 0, 1);
    // the best landings get a beat of slow motion at the top of the arc
    var e = T.slow
      ? (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
      : 1 - Math.pow(1 - k, 2);
    var f = e * endF;
    var hop = Math.sin(e * Math.PI) * apexPx;
    var fall = (!landed && k > 0.6) ? Math.pow((k - 0.6) / 0.4, 2) * (g.h - g.gy - 24) : 0;
    drawStage({ guessF:guessF, actualF:actualF, showFar:true, heroF:f, hop:hop, fall:fall,
                jumping: k < 0.97 || !landed, tierColour:T.c,
                dust: k < 0.1 || (landed && k > 0.94) });
    if (k < 1) anim = requestAnimationFrame(step); else if (done) done();
  })(t0);
}

var mode = 'daily', qs = [], idx = 0, results = [], locked = false, flying = false, today = dayIndex();

}

/* ---------------------------------------------------------------- title */

/* ----------------------------------------------------------------- play */
function startDaily() {
  var rec = S.days[today];
  if (rec && rec.done) {
    mode = 'daily'; results = rec.results || []; qs = pickDay(today);
    paintDone(); return show('done');
  }
  mode = 'daily'; qs = pickDay(today); idx = 0; results = []; show('play'); paintQ();
}
function startEndless() {
  mode = 'endless'; qs = pickRandom(PER_DAY); idx = 0; results = []; show('play'); paintQ();
}
function paintPips() {
  $('pips').innerHTML = qs.map(function (_, i) {
    var r = results[i];
    if (!r) return '<i class="' + (i === idx ? 'now' : '') + '"></i>';
    var c = tierOf(r.score).c;
    return '<i style="background:' + c + ';border-color:' + c + '"></i>';
  }).join('');
}
function paintTrail() {
  var ix = regionIx(), R = REGIONS[ix], last = ix === REGIONS.length - 1;
  var into = last ? REGION_LEN : S.metres % REGION_LEN;
  $('h-region-n').textContent = R.n;
  $('trail-i').style.width = (into / REGION_LEN * 100).toFixed(1) + '%';
  $('trail-t').textContent = last
    ? comma(S.metres) + ' m · the end of the map'
    : comma(REGION_LEN - into) + ' m to ' + REGIONS[ix + 1].n;
}
function paintQ() {
  var q = qs[idx]; locked = false; flying = false;
  cancelAnimationFrame(anim);
  paintPips(); paintTrail();
  $('h-run').textContent = comma(results.reduce(function (a, r) { return a + (r ? r.score : 0); }, 0)) + ' pts';
  $('q-cat').textContent = q.cat;
  $('q-n').textContent = (mode === 'endless' ? 'Endless · ' : '') + (idx + 1) + ' / ' + PER_DAY;
  $('q-text').textContent = q.q;
  $('tag-a').textContent = q.a.label; $('tag-b').textContent = q.b.label;
  $('fa').textContent = ''; $('fb').textContent = '';
  $('cliffnotes').hidden = false; placeNotes();
  $('r-u').textContent = q.type === 'percent' ? '%' : '×';
  $('r-hint').textContent = q.type === 'percent' ? 'drag to set the share' : 'drag to build your bridge';
  $('slider').value = q.type === 'percent' ? 500 : 0;
  $('dial').hidden = false; $('reveal').hidden = true;
  V.play.classList.remove('leaping');
  measureCliff();
  paintRead(true);
  requestAnimationFrame(function () { measureCliff(); placeNotes(); paintRead(true); });
}
var lastTick = 0;
function paintRead(silent) {
  var q = qs[idx]; if (!q) return;
  var pos = +$('slider').value, v = toValue(q.type, pos);
  $('r-v').textContent = fmtV(q.type, v);
  $('slider').style.setProperty('--p', (pos / 10) + '%');
  drawStage({ guessF: frac(q.type, v), actualF: 0, showFar: false });
  if (!silent && performance.now() - lastTick > 45) { lastTick = performance.now(); SFX.tick(); }
}
function lockIn() {
  if (locked || flying) return; locked = true; flying = true;
  var q = qs[idx];
  var guess = toValue(q.type, +$('slider').value), actual = answerOf(q);
  var sc = scoreGuess(q.type, guess, actual);
  results[idx] = { score:sc, guess:guess, actual:actual, id:q.id };
  if (sc === MAX_Q) S.perfects = (S.perfects || 0) + 1;
  if (S.cats.indexOf(q.cat) === -1) S.cats.push(q.cat);

  // every point is a metre, and metres are what move you between regions
  var wasIx = regionIx();
  S.metres = (S.metres || 0) + sc;
  var nowIx = regionIx();
  if (nowIx > wasIx) S.regions = Math.max(S.regions || 1, nowIx + 1);
  save();

  $('fa').textContent = fmtFig(q.a.value) + ' ' + q.a.unit;
  $('fb').textContent = fmtFig(q.b.value) + ' ' + q.b.unit;
  $('dial').hidden = true;
  V.play.classList.add('leaping');            // the UI steps aside for the leap
  SFX.leap();
  animateLeap(frac(q.type, guess), frac(q.type, actual), sc, function () {
    SFX.land(band(sc));
    function land() {
      flying = false;
      V.play.classList.remove('leaping');
      checkKit();
      paintReveal(q, guess, actual, sc);
    }
    if (nowIx > wasIx) {
      // crossing a region line gets its own beat: the sky turns over the
      // bird, the card names the new place, and only then does the reveal
      setRegion();
      // setRegion swaps the rock vars too, so the canyon has to be repainted
      // or the bird lands on the old region's rock under the new sky
      if (stageState) drawStage(stageState);
      paintTrail(); gateCard(REGIONS[nowIx], nowIx); SFX.gate();
      setTimeout(land, 1200);
    } else {
      paintTrail(); land();
    }
  });
}
function paintReveal(q, guess, actual, sc) {
  var T = tierOf(sc), vd = $('verdict');
  vd.style.background = T.c; vd.style.color = '#04121A'; vd.style.borderColor = '#04121A';
  $('v-l').textContent = T.n;
  $('v-p').textContent = '+' + comma(sc);
  $('v-p').style.color = '#04121A';
  $('ledger').innerHTML =
    '<div><span class="k">' + esc(q.a.label) + '</span><span class="v">' +
      esc(fmtFig(q.a.value)) + ' ' + esc(q.a.unit) + '</span></div>' +
    '<div><span class="k">' + esc(q.b.label) + '</span><span class="v">' +
      esc(fmtFig(q.b.value)) + ' ' + esc(q.b.unit) + '</span></div>' +
    '<div><span class="k">You said</span><span class="v">' +
      esc(fmtV(q.type, guess)) + (q.type === 'percent' ? '%' : '×') + '</span></div>' +
    '<div class="hl"><span class="k">The gap</span><span class="v">' +
      esc(fmtV(q.type, actual)) + (q.type === 'percent' ? '%' : '×') + '</span></div>' +
    '<div><span class="k">' + esc(T.n) + ' — ' + esc(T.d) + '</span><span class="v">+' +
      comma(sc) + ' m</span></div>';
  $('cite').textContent = q.src;
  $('reveal').hidden = false;
  $('cliffnotes').hidden = false;
  $('b-next').textContent = idx === PER_DAY - 1 ? 'See your crossing ▶' : 'Next gap ▶';
  paintPips();
  $('h-run').textContent = comma(results.reduce(function (a, r) { return a + (r ? r.score : 0); }, 0)) + ' pts';
  pointsFly($('v-p'), sc);
}
function next() {
  if (flying) return;                            // no skipping out of the air
  if (idx < PER_DAY - 1) { idx++; SFX.pip(); paintQ(); } else finish();
}

/* --------------------------------------------------------------- finish */
function finish() {
  var total = results.reduce(function (a, r) { return a + r.score; }, 0);
  if (mode === 'daily' && !(S.days[today] && S.days[today].done)) {
    S.days[today] = { done:true, total:total, results:results };
    S.streak = S.last === today - 1 ? S.streak + 1 : 1;
    S.bestStreak = Math.max(S.bestStreak || 0, S.streak);
    S.last = today; S.played += 1; S.sum += total;
    S.best = Math.max(S.best, total);
    S.sparks = (S.sparks || 0) + Math.round(total / 2);
    S.dist[clamp(Math.floor(total / 100), 0, 6)] += 1;
    save();
  }
  checkTrophies(results);
  checkKit();
  SFX.win();
  paintDone(); show('done');
}
function paintDone() {
  var total = results.reduce(function (a, r) { return a + r.score; }, 0);
  $('d-kick').textContent = mode === 'endless' ? 'Endless run' : 'Canyon #' + today;
  $('d-of').textContent = '/' + MAX_DAY;
  $('d-rank').textContent = rankOf(total);
  $('d-log').innerHTML = '<span class="lbl">Leap log — longer is closer</span>' +
    results.map(function (r, i) {
      var T = tierOf(r.score);
      return '<div class="r"><span class="i">' + (i + 1) + '</span><span class="bar">' +
        '<i style="width:' + Math.max(3, r.score) + '%;background:' + T.c +
        ';animation-delay:' + (i * 70) + 'ms"></i></span>' +
        '<span class="s">' + esc(T.n) + '</span></div>';
    }).join('');
  var ix = regionIx(), last = ix === REGIONS.length - 1;
  $('d-trav').innerHTML = '<span class="lbl">' + esc(regionNow().n) + ' &middot; region ' +
    (ix + 1) + '/' + REGIONS.length + '</span><div class="sp" style="flex:1"></div><b>' +
    comma(S.metres) + ' m</b>';
  // your own spread, not an invented global one
  var d = S.dist, mx = Math.max.apply(null, [1].concat(d));
  var myB = clamp(Math.floor(total / 100), 0, 6);
  $('d-spread').innerHTML = '<span class="lbl">Your daily scores so far</span>' +
    '<div class="cols">' + d.map(function (n, i) {
      var me = i === myB && mode !== 'endless';
      return '<div class="' + (me ? 'me' : '') + '" style="height:' +
        Math.max(4, n / mx * 100) + '%">' + (me ? '<em>you</em>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="xs">' + ['0','100','200','300','400','500','600+'].map(function (l) {
      return '<span>' + l + '</span>';
    }).join('') + '</div>';
  $('d-earn').innerHTML = mode === 'endless'
    ? '<span class="lbl">Practice run &middot; metres still count</span>'
    : '<span class="lbl">Sparks earned</span><div class="sp" style="flex:1"></div><b>+' +
      comma(Math.round(total / 2)) + '</b>';
  $('d-score').textContent = '0';
  countUp($('d-score'), total, 900);
  $('b-share').hidden = mode === 'endless';
  $('chip-sparks-n').textContent = comma(S.sparks);
  $('chip-streak').hidden = !(S.streak > 0);
  $('chip-streak-n').textContent = S.streak;
  if (last) { /* nothing more to climb towards; the card above says so */ }
  clock();
}
function countUp(el, to, dur) {
  var t0 = performance.now();
  (function step(t) {
    var k = clamp((t - t0) / dur, 0, 1);
    el.textContent = comma(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function clock() {
  var el = $('d-clock');
  if (mode === 'endless') { el.textContent = ''; return; }
  function upd() {
    var n = new Date();
    var s = Math.max(0, Math.floor(
      (Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1) - n.getTime()) / 1000));
    var p = function (v) { return String(Math.floor(v)).padStart(2, '0'); };
    el.innerHTML = 'Next canyon in <b>' + p(s / 3600) + ':' + p(s % 3600 / 60) + ':' + p(s % 60) + '</b>';
  }
  upd(); clearInterval(clock._i); clock._i = setInterval(upd, 1000);
}

/* ---------------------------------------------------------------- share */
function share() {
  var total = results.reduce(function (a, r) { return a + r.score; }, 0);
  var text = 'Gappy · canyon #' + today + '\n' + comma(total) + '/' + MAX_DAY + ' · ' +
    rankOf(total) + '\n' + results.map(function (r) { return tierOf(r.score).sq; }).join('') +
    '\n' + regionNow().n + ' · ' + comma(S.metres) + ' m\njessebaizer.com/game';
  function copy() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    }
    return fallback();
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed'); }
    ta.remove();
  }
  if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    navigator.share({ text:text }).catch(function (e) {
      if (!e || e.name !== 'AbortError') copy();
    });
    return;
  }
  copy();
}

var XBTN = '<button type="button" class="icb" data-close aria-label="Close">' +
  '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 4h2v2H3zM5 6h2v2H5zM7 8h2v2H7zM9 6h2v2H9z' +

function soundIcon() {
  $('b-sound').classList.toggle('off', S.sound === false);
  $('wv1').style.display = S.sound === false ? 'none' : '';
  $('wv2').style.display = S.sound === false ? 'none' : '';
}
$('b-sound').addEventListener('click', function () {
  S.sound = S.sound === false; save(); soundIcon(); if (S.sound) SFX.pip();
});
function nudge(d) {
  if (locked || flying) return;
  var s = $('slider'); s.value = clamp(+s.value + d, 0, 1000); paintRead(false);
}
$('s-up').addEventListener('click', function () { nudge(8); });
$('s-dn').addEventListener('click', function () { nudge(-8); });
document.addEventListener('keydown', function (e) {
  if (document.querySelector('.scrim')) return;
  if (!V.title.hidden && e.key === 'Enter') { e.preventDefault(); $('b-play').click(); return; }
  if (V.play.hidden) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (locked) next(); else lockIn(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-8); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(8); }
});
var rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () {
    drawBands();
    if (!V.play.hidden) { measureCliff(); placeNotes();
      if (locked && stageState) drawStage(stageState); else paintRead(true); }
    else drawStage({ idle:true, guessF:0, actualF:0 });
  }, 140);
});

/* ------------------------------------------------------------------ boot */
// regions depend on REGIONS, which only exists down here, so the store's
// region count is reconciled now rather than inside load()
S.regions = Math.max(S.regions || 1, regionIx() + 1);
starfield();
setRegion();
markMode(); soundIcon();
checkKit();                 // hand over anything already earned, first load
kitBadge(); paintTitle();
if (!BANK.length) { $('b-play').disabled = true; toast('Question bank failed to load'); }
requestAnimationFrame(function () {
  drawBands();
  drawStage({ idle:true, guessF:0, actualF:0 });
});
function relayout() {
  drawBands();
  if (!V.play.hidden) {
    measureCliff(); placeNotes();
    if (locked && stageState) drawStage(stageState); else paintRead(true);
  } else { drawStage({ idle:true, guessF:0, actualF:0 }); }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout).catch(function () {});
setTimeout(relayout, 1200);

setInterval(function () {
  var d = dayIndex();
  if (d !== today) {
    today = d; results = []; paintTitle();
    if (!V.done.hidden) show('title');
  }
}, 30000);

window.__gappy = { scoreGuess:scoreGuess, answerOf:answerOf, pickDay:pickDay, dayIndex:dayIndex,
  toValue:toValue, toPos:toPos, BANK:BANK, rankOf:rankOf, band:band, TROPHY:TROPHY,
  REGIONS:REGIONS, WARDROBE:WARDROBE, regionIx:regionIx, TIERS:TIERS,
  state:function () { return S; } };
})();
</script>
</body>
