<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Join your chapter · fomo</title>
<link rel="icon" href="/fomo-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0912; --surface:#11101C; --surface-2:#171626; --surface-3:#1E1C30;
  --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.14);
  --white:#FFFFFF; --text:#E8E8F0; --text-dim:#9B9BAD; --text-faint:#6E6E85;
  --blue:#5B5BF5; --blue-hi:#6E6EF8; --blue-dim:#8E8EFA;
  --red:#F2555A; --green:#2ED47A; --gold:#E0B25C;
  --radius:12px; --radius-lg:16px;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{background:var(--bg); color:var(--text); font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
button,input{font-family:inherit;}
a{color:inherit; text-decoration:none;}
svg{display:block;}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }

.wrap{max-width:1180px; margin:0 auto; padding:34px 40px 80px;}
@media (max-width:760px){ .wrap{padding:26px 20px 56px;} }

.wordmark{font-size:1.6rem; font-weight:800; color:var(--blue); letter-spacing:-0.03em; margin-bottom:34px; display:inline-block;}

/* ---------- hero ---------- */
.eyebrow{font-size:0.76rem; font-weight:800; color:var(--blue-dim); letter-spacing:0.13em; text-transform:uppercase; margin-bottom:10px;}
h1{font-size:clamp(2.2rem,5.6vw,3.3rem); font-weight:800; letter-spacing:-0.04em; line-height:1.02; margin:0 0 6px; color:var(--white);}
.school{font-size:1.05rem; color:var(--text-dim); margin:0 0 26px;}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px 26px; margin-bottom:16px;}
@media (max-width:620px){ .card{padding:20px;} }

/* tracker */
.trk-top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.trk-num{font-size:2.4rem; font-weight:800; color:var(--blue); letter-spacing:-0.045em; line-height:1;}
.trk-num small{font-size:1.2rem; color:var(--text-dim); font-weight:600; letter-spacing:-0.02em;}
.trk-goal{font-size:0.98rem; font-weight:800; color:var(--white);}
.bar{height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
.bar span{display:block; height:100%; width:0; border-radius:99px; background:var(--blue); transition:width 1.1s cubic-bezier(.3,.8,.3,1);}
.bar.done span{background:var(--green);}
.trk-note{font-size:0.86rem; color:var(--text-faint); margin-top:13px;}

/* sliders */
.sl-block{padding-top:4px;}
.sl-block + .sl-block{margin-top:22px; padding-top:22px; border-top:1px solid var(--border);}
.sl-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap;}
.sl-lab{font-size:0.76rem; font-weight:800; letter-spacing:0.13em; text-transform:uppercase; color:var(--blue-dim);}
.sl-block.alt .sl-lab{color:var(--gold);}
.sl-amt{font-size:2.1rem; font-weight:800; color:var(--green); letter-spacing:-0.04em; line-height:1; margin-top:9px;}
.sl-block.alt .sl-amt{color:var(--gold); font-size:1.65rem;}
.sl-count{font-size:0.92rem; font-weight:700; color:var(--white); white-space:nowrap;}
.sl-count b{font-size:1.15rem;}
.slider{-webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:99px; outline:none; margin:16px 0 0; cursor:pointer; background:var(--surface-3);}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--white); border:4px solid var(--blue); cursor:grab; box-shadow:0 2px 10px rgba(0,0,0,.6);}
.slider::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--white); border:4px solid var(--blue); cursor:grab;}
.slider.alt::-webkit-slider-thumb{border-color:var(--gold);}
.slider.alt::-moz-range-thumb{border-color:var(--gold);}
.ends{display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-faint); margin-top:7px;}
.sl-note{font-size:0.84rem; color:var(--text-faint); margin-top:11px; line-height:1.5;}
.sl-note b{color:var(--text-dim); font-weight:700;}

/* share */
.share-lab{font-size:0.86rem; font-weight:600; color:var(--text-dim); margin-bottom:12px;}
.share-row{display:flex; gap:10px; flex-wrap:wrap;}
.share-row input{flex:1; min-width:220px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:13px 14px; color:var(--text); font-size:0.88rem; outline:none; text-overflow:ellipsis;}
.share-row input:focus{border-color:var(--blue);}
.btn{border:none; border-radius:10px; padding:13px 22px; font-size:0.84rem; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; white-space:nowrap; transition:background .15s ease, color .15s ease;}
.btn-primary{background:var(--blue); color:#fff;}
.btn-primary:hover{background:var(--blue-hi);}
.btn-ghost{background:var(--surface-2); border:1px solid var(--border-2); color:var(--text); text-transform:none; letter-spacing:0; font-weight:700;}
.btn-ghost:hover{background:var(--surface-3);}
.btn.done{background:var(--green); color:#062B18;}
.share-note{font-size:0.82rem; color:var(--text-faint); margin-top:12px; line-height:1.5;}

/* ---------- two-column body ---------- */
.cols{display:grid; grid-template-columns:1fr 1fr; gap:44px; padding-top:30px; margin-top:26px; border-top:1px solid var(--border);}
@media (max-width:860px){ .cols{grid-template-columns:1fr; gap:36px;} }
.col h2{font-size:0.76rem; font-weight:800; color:var(--blue-dim); letter-spacing:0.13em; text-transform:uppercase; margin:0 0 16px;}
.col p.body{font-size:0.97rem; color:var(--text-dim); line-height:1.65; margin:0 0 18px;}
.col p.body b{color:var(--white); font-weight:700;}
.hr{height:1px; background:var(--border); margin:18px 0;}
.fine{font-size:0.88rem; color:var(--text-faint); line-height:1.6; margin:0;}

.pts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px;}
.pt{display:flex; gap:12px; align-items:flex-start;}
.pt .ic{width:21px; height:21px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--blue); color:var(--blue-dim); display:flex; align-items:center; justify-content:center; font-size:0.68rem; font-weight:800; margin-top:1px;}
.pt .ic svg{width:11px; height:11px;}
.pt .tx{font-size:0.94rem; color:var(--text-dim); line-height:1.55;}
.pt .tx b{color:var(--white); font-weight:700;}

/* form */
.formcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px;}
@media (max-width:620px){ .formcard{padding:20px;} }
.two{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width:480px){ .two{grid-template-columns:1fr;} }
.f{margin-bottom:22px;}
.f label{display:block; font-size:0.86rem; font-weight:600; color:var(--text-dim); margin-bottom:8px;}
.f input{width:100%; background:none; border:none; border-bottom:1px solid var(--border-2); border-radius:0; padding:8px 2px 10px; color:var(--white); font-size:0.98rem; outline:none; transition:border-color .15s ease;}
.f input::placeholder{color:var(--text-faint);}
.f input:focus{border-bottom-color:var(--blue);}
.f .hint{font-size:0.8rem; color:var(--text-faint); margin-top:8px; line-height:1.5;}
.f .hint a{color:var(--blue-dim); font-weight:600;}
.msg{font-size:0.86rem; margin:14px 0 0; min-height:1.2em;}
.msg.err{color:var(--red);}

.done-wrap .tick{width:46px; height:46px; margin-bottom:16px; border-radius:50%; background:rgba(46,212,122,.14); color:var(--green); display:flex; align-items:center; justify-content:center;}
.done-wrap .tick svg{width:22px; height:22px;}
.done-wrap h3{margin:0 0 8px; font-size:1.25rem; font-weight:800; color:var(--white); letter-spacing:-0.025em;}
.done-wrap p{margin:0 0 16px; font-size:0.92rem; color:var(--text-dim); line-height:1.6;}
.done-wrap p b{color:var(--white);}

.state{padding:90px 20px; text-align:center; color:var(--text-faint); font-size:0.95rem; line-height:1.8;}
.state a{color:var(--blue-dim); font-weight:600;}
.foot{border-top:1px solid var(--border); margin-top:40px; padding-top:22px; font-size:0.8rem; color:var(--text-faint); line-height:1.7;}
.foot a{color:var(--text-dim);}
</style>
</head>
<body>

<div class="wrap">
  <a class="wordmark" href="/fomo/clans/">fomo</a>
  <div class="state" id="state">Loading…</div>
  <div id="page" hidden></div>
</div>

<script src="/fomo/greek-data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const { orgFor } = GreekData;

const APP_URL = 'https://apps.apple.com/us/app/fomo-never-miss-out/id6741115427';

// What a chapter earns scales with how many of them join, so the figure on the
// page is that chapter's own rather than a flat number that fits nobody.
const PER_MEMBER = 6.25;
const REFERRAL_PCT = 0.20;
const MIN_SIZE = 15;
const MAX_SIZE = 500;
const payout = (n) => Math.round(n * PER_MEMBER);
const referral = (n) => Math.round(n * PER_MEMBER * REFERRAL_PCT);
const clampSize = (n) => Math.max(MIN_SIZE, Math.min(MAX_SIZE, Math.round(Number(n) || 0) || MIN_SIZE));
const usd = (v) => '$' + v.toLocaleString('en-US');

const ref = (new URLSearchParams(location.search).get('ref') || '').toLowerCase();

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function copyTo(btn, text, okLabel) {
  const label = btn.dataset.label || btn.textContent.trim();
  btn.dataset.label = label;
  const finish = (ok) => {
    btn.classList.toggle('done', ok);
    btn.textContent = ok ? okLabel : 'Press ⌘C';
    setTimeout(() => { btn.classList.remove('done'); btn.textContent = label; }, 1800);
  };
  navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => {
    // Clipboard needs a secure context and permission; fall back to selecting
    // the text so the button still leaves the user somewhere useful.
    const i = $('reflink');
    if (i) { i.focus(); i.select(); i.setSelectionRange(0, 99999); }
    finish(false);
  });
}

function render(c) {
  const known = !!c;
  const size = known ? (c.chapterSize || 0) : 0;
  const goal = known ? (c.goal || 0) : 0;
  const have = known ? (c.members || 0) : 0;
  const left = Math.max(0, goal - have);
  const pct = goal ? Math.min(100, Math.round((have / goal) * 100)) : 0;
  const hit = goal > 0 && have >= goal;
  // With no chapter, open the calculator on a mid-sized house rather than the
  // floor — it reads as an example, not as a lowball.
  // Open the slider on the goal, not the full roster, so it agrees with the
  // "unlock $X" figure in the tracker directly above it.
  const startSize = clampSize(known ? (goal || size || MIN_SIZE) : 100);
  const unlock = payout(goal || startSize);
  const link = known ? c.referralUrl : '';
  const org = known ? orgFor(c.chapterName) : null;
  const kind = org && org[2] === 'sorority' ? 'Sorority' : 'Fraternity';
  const shareMsg = known
    ? `We're getting ${c.chapterName} paid by fomo — every one of us who signs up is worth $${PER_MEMBER.toFixed(2)} to the house, and we need ${left || 'a few'} more. Takes about a minute: ${link}`
    : '';

  $('page').innerHTML = `
    <div class="eyebrow">Greek Wars${known ? ' · ' + kind : ''}</div>
    <h1>${known ? esc(c.chapterName) : 'Get your chapter paid.'}</h1>
    <p class="school">${known ? esc(c.schoolLabel) : 'Every member of the house who joins is worth money to the chapter.'}</p>

    ${known ? `<div class="card">
      <div class="trk-top">
        <div class="trk-num">${have}<small> of ${goal}</small></div>
        <div class="trk-goal">${hit ? `Goal cleared — ${usd(unlock)} unlocked` : `${left} more to unlock ${usd(unlock)}`}</div>
      </div>
      <div class="bar${hit ? ' done' : ''}"><span id="fill"></span></div>
      <div class="trk-note">80% of ${size} active members needed. Updates live.</div>
    </div>` : ''}

    <div class="card">
      <div class="sl-block">
        <div class="sl-head">
          <div><div class="sl-lab">What your chapter earns</div><div class="sl-amt" id="calc-amt">$0</div></div>
          <div class="sl-count"><b id="calc-size">0</b> members joined</div>
        </div>
        <input type="range" class="slider" id="sl-main" min="${MIN_SIZE}" max="${MAX_SIZE}" step="1" value="${startSize}" aria-label="Chapter size">
        <div class="ends"><span>${MIN_SIZE}</span><span>${MAX_SIZE}</span></div>
        <div class="sl-note"><b>$${PER_MEMBER.toFixed(2)}</b> for every member of the house who joins. Drag to see where you land.</div>
      </div>
      <div class="sl-block alt">
        <div class="sl-head">
          <div><div class="sl-lab">Chapter referral rewards</div><div class="sl-amt" id="ref-amt">$0</div></div>
          <div class="sl-count"><b id="ref-size">0</b> members</div>
        </div>
        <input type="range" class="slider alt" id="sl-ref" min="${MIN_SIZE}" max="${MAX_SIZE}" step="1" value="${MIN_SIZE}" aria-label="Size of the chapter you refer">
        <div class="ends"><span>${MIN_SIZE}</span><span>${MAX_SIZE}</span></div>
        <div class="sl-note">Refer another chapter to fomo campus and you earn <b>${Math.round(REFERRAL_PCT * 100)}%</b> of what they earn, on top of your own.</div>
      </div>
    </div>

    ${known ? `<div class="card">
      <div class="share-lab">Send this to your chapter</div>
      <div class="share-row">
        <input type="text" id="reflink" value="${esc(link)}" readonly spellcheck="false" aria-label="Your chapter link">
        <button class="btn btn-primary" id="copy-link">Copy link</button>
        <button class="btn btn-ghost" id="copy-msg">Copy message</button>
      </div>
      <div class="share-note">&ldquo;Copy message&rdquo; gives you the whole thing to paste into your group chat — what it is, how many you need, and the link.</div>
    </div>` : `<div class="card">
      <div class="share-lab">Not registered yet?</div>
      <div class="share-row">
        <a class="btn btn-primary" href="/fomo/clans/create/" style="display:inline-block;">Register your chapter</a>
        <a class="btn btn-ghost" href="/fomo/clans/" style="display:inline-block;">See the leaderboard</a>
      </div>
      <div class="share-note">Takes about two minutes. You get a page like this one with your letters on it, a link to send the house, and a dashboard that tracks who has joined.</div>
    </div>`}

    <div class="cols">
      <div class="col">
        <h2>What this is</h2>
        <p class="body">${known ? `<b>${esc(c.chapterName)}</b> is competing in Greek Wars. Every member of the house who gets on fomo is worth <b>$${PER_MEMBER.toFixed(2)}</b> to the chapter — <b><span data-prize>$0</span></b> for a house your size.`
          : `<b>Greek Wars</b> is chapters across the country racing to get their house onto fomo. Every member who joins is worth <b>$${PER_MEMBER.toFixed(2)}</b> to the chapter — <b><span data-prize>$0</span></b> for a house that size.`}</p>
        <ul class="pts">
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx">Takes about a minute.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx">The money goes to the chapter, not to one person.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx">You compete against every other chapter${known ? ` at ${esc(c.schoolLabel)}` : ''}, and nationally.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx">You need to be 18 or older.</span></li>
        </ul>
        <div class="hr"></div>
        <p class="fine">Trading involves risk, including loss of principal.</p>
      </div>

      <div class="col" id="join">
        <h2>${known ? 'Join your chapter' : 'Get your chapter in'}</h2>
        ${known ? `<div class="formcard" id="joincard">
          <div class="two">
            <div class="f"><label for="j-first">First name</label><input type="text" id="j-first" maxlength="40" autocomplete="given-name" placeholder="Mark"></div>
            <div class="f"><label for="j-last">Last name</label><input type="text" id="j-last" maxlength="40" autocomplete="family-name" placeholder="Zuckerberg"></div>
          </div>
          <div class="f">
            <label for="j-user">fomo username</label>
            <input type="text" id="j-user" maxlength="24" autocomplete="off" spellcheck="false" placeholder="yourusername">
            <div class="hint">No account yet? <a href="${esc(APP_URL)}" target="_blank" rel="noopener">Get fomo on the App Store</a> first — it takes a minute.</div>
          </div>
          <div class="f"><label for="j-email">Email on your fomo account</label><input type="email" id="j-email" maxlength="120" autocomplete="email" placeholder="you@school.edu"></div>
          <div class="f"><label for="j-ig">Instagram</label><input type="text" id="j-ig" maxlength="31" autocomplete="off" placeholder="@yourhandle"></div>
          <button type="button" class="btn btn-primary" id="j-go">Count me in</button>
          <p class="msg" id="j-msg"></p>
        </div>` : `<div class="formcard">
          <p class="body" style="margin:0 0 18px;">This page is per chapter. Register yours and you get one with your letters on it — plus the link to send the house and a dashboard that tracks who has joined.</p>
          <a class="btn btn-primary" href="/fomo/clans/create/" style="display:inline-block;">Register your chapter</a>
          <p class="fine" style="margin-top:16px;">Already registered? Your chapter's link came from whoever signed you up — ask them, or <a href="/fomo/login/" style="color:var(--blue-dim);font-weight:600;">sign in</a> to find it on your dashboard.</p>
        </div>`}
      </div>
    </div>

    <div class="cols">
      <div class="col">
        <h2>How the money works</h2>
        <ul class="pts">
          <li class="pt"><span class="ic">1</span><span class="tx"><b>Everyone downloads fomo.</b> Each member makes an account and submits their username here.</span></li>
          <li class="pt"><span class="ic">2</span><span class="tx"><b>We approve each one.</b> The fomo team checks each username against a real account, usually same day. Approved members move the tracker.</span></li>
          <li class="pt"><span class="ic">3</span><span class="tx"><b>The total climbs.</b> Every approved member adds $${PER_MEMBER.toFixed(2)}${known ? `. Hit ${goal} and the chapter qualifies` : ''}.</span></li>
          <li class="pt"><span class="ic">4</span><span class="tx"><b>The chapter gets paid.</b> Wired to the chapter account through your treasurer within 7 business days of confirmation, plus a crate of fomo gear to the house.</span></li>
        </ul>
        <div class="hr"></div>
        <p class="fine">Who trades best is a separate contest. This money is for getting the house on the app — <a href="/fomo/prizes/" style="color:var(--blue-dim);font-weight:600;">see every tier</a>.</p>
      </div>

      <div class="col">
        <h2>Questions people ask</h2>
        <ul class="pts">
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx"><b>Who gets the money?</b> The chapter — through the treasurer or president on file, never an individual's Venmo.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx"><b>Do I have to trade, or deposit?</b> No. You count as soon as your account is approved. No minimum, no quota.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx"><b>What if I lose money trading?</b> That can happen and we won't pretend otherwise. It has no effect on what the chapter earns.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx"><b>What if we pass the goal later?</b> You qualify whenever you get there. Earlier just means more time trading.</span></li>
          <li class="pt"><span class="ic">${CHECK}</span><span class="tx"><b>Is my information shared?</b> Your username and email go to the fomo team to verify your account. The public board shows chapter totals only.</span></li>
        </ul>
        <div class="hr"></div>
        <p class="fine">Trading involves risk, including loss of principal. You need to be 18 or older to compete.</p>
      </div>
    </div>

    <div class="foot">
      18+ only. fomo is a trading app and all trading involves risk, including the risk of losing money — nothing here is a promise of profit or financial advice.
      Earnings go to the chapter, not to any individual, and are paid once the count is confirmed by the fomo team.
      Full terms on the <a href="/fomo/prizes/">rewards page</a>. © 2026 FOMO Labs Inc.
    </div>`;

  requestAnimationFrame(() => { const f = $('fill'); if (f) f.style.width = pct + '%'; });

  // One handler keeps the amount, the member count and every other money
  // figure on the page pointing at the same number.
  const paintMain = () => {
    const v = clampSize($('sl-main').value);
    $('calc-amt').textContent = usd(payout(v));
    $('calc-size').textContent = v.toLocaleString('en-US');
    document.querySelectorAll('[data-prize]').forEach((el) => { el.textContent = usd(payout(v)); });
  };
  const paintRef = () => {
    const v = clampSize($('sl-ref').value);
    $('ref-amt').textContent = usd(referral(v));
    $('ref-size').textContent = v.toLocaleString('en-US');
  };
  $('sl-main').addEventListener('input', paintMain);
  $('sl-ref').addEventListener('input', paintRef);
  paintMain(); paintRef();

  if (known) {
    $('copy-link').addEventListener('click', () => copyTo($('copy-link'), link, 'Copied'));
    $('copy-msg').addEventListener('click', () => copyTo($('copy-msg'), shareMsg, 'Copied'));
    $('j-go').addEventListener('click', () => submit(c));
    ['j-first', 'j-last', 'j-user', 'j-email', 'j-ig'].forEach((id) => {
      $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(c); });
    });
  }
}

const EMAIL_RE = /^[^\s@]{1,64}@[^\s@.]+(\.[^\s@.]+)+$/;

async function submit(c) {
  const btn = $('j-go'), msg = $('j-msg');
  const username = $('j-user').value.trim();
  const email = $('j-email').value.trim();
  msg.className = 'msg'; msg.textContent = '';
  if (username.length < 2) { msg.className = 'msg err'; msg.textContent = 'Enter your fomo username.'; $('j-user').focus(); return; }
  if (!EMAIL_RE.test(email)) { msg.className = 'msg err'; msg.textContent = 'Enter the email on your fomo account.'; $('j-email').focus(); return; }

  btn.disabled = true; btn.textContent = 'Counting you in…';
  try {
    const res = await fetch('/api/clans/' + encodeURIComponent(ref) + '/join', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        username, email,
        firstName: $('j-first').value.trim(),
        lastName: $('j-last').value.trim(),
        instagram: $('j-ig').value.trim().replace(/^@/, ''),
      }),
    });
    if (res.status === 201) { showDone(c, await res.json()); return; }
    const body = await res.json().catch(() => ({}));
    msg.className = 'msg err'; msg.textContent = body.error || 'Something went wrong.';
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = 'Couldn’t reach the server — try again.';
  }
  btn.disabled = false; btn.textContent = 'Count me in';
}

function showDone(c, data) {
  const link = (data && data.referralUrl) || c.referralUrl;
  $('joincard').innerHTML = `
    <div class="done-wrap">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h3>You’re counted.</h3>
      <p>We’ll approve you into <b>${esc(c.chapterName)}</b> shortly, usually same day. The tracker moves the moment we do.</p>
      <p>Now send this to the group chat. Everyone who joins through it adds $${PER_MEMBER.toFixed(2)} to the house.</p>
      <div class="share-row">
        <input type="text" id="reflink2" value="${esc(link)}" readonly spellcheck="false" aria-label="Your chapter link">
        <button class="btn btn-primary" id="copy-done">Copy link</button>
      </div>
    </div>`;
  $('copy-done').addEventListener('click', () => {
    const b = $('copy-done');
    navigator.clipboard.writeText(link).then(() => {
      b.classList.add('done'); b.textContent = 'Copied';
      setTimeout(() => { b.classList.remove('done'); b.textContent = 'Copy link'; }, 1800);
    }).catch(() => { const i = $('reflink2'); i.focus(); i.select(); b.textContent = 'Press ⌘C'; });
  });
}

function fail(html) { $('state').innerHTML = html; }

(async function load() {
  if (!/^[a-z0-9]{4,16}$/.test(ref)) {
    $('state').hidden = true;
    $('page').hidden = false;
    render(null);
    return;
  }
  try {
    const res = await fetch('/api/clans/' + encodeURIComponent(ref), { cache: 'no-store' });
    if (res.status === 404) {
      fail('That chapter link is no longer valid.<br><a href="/fomo/clans/">See the leaderboard</a>');
      return;
    }
    if (!res.ok) throw new Error('bad status');
    const c = await res.json();
    $('state').hidden = true;
    $('page').hidden = false;
    document.title = `${c.chapterName} · fomo greek wars`;
    render(c);
  } catch (e) {
    fail('Couldn’t load this chapter right now.<br><a href="">Try again</a>');
  }
})();
</script>
</body>
</html>
